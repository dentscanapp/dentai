     'care2-email-cta': '→ Täytä kysely',\n        'care-stat1-value': '~40%',\n        'care-stat1-label': 'Vähemmän unohtuneita aikoja muistutusten ansiosta',\n        'care-stat2-value': '0',\n        'care-stat2-label': 'Käsityö ja täysin automatisoitu prosessi',\n        'care-stat3-value': '24h',\n        'care-stat3-label': 'Palaute hoidon jälkeen',\n        'flow-1': 'Saapuva puhelu/Verkko',\n        'flow-2': 'Tarvekartoitus',\n        'flow-3': 'Kalenterisynk',\n        'flow-4': 'Vahvistus',\n        'flow-done': 'Valmis!',\n        'why-sub': 'Miksi Anna?',\n        'why-title': 'Vapautettu vastaanottokapasiteetti — välittömästi',\n        'why-desc': 'Anna ei korvaa vastaanottoa — hän hoitaa toistuvat tehtävät, jotta tiimisi voi keskittyä siihen mikä todella merkitsee.',\n        'ben1-title': 'Ei enää vastaamattomia puheluita',\n        'ben1-desc': 'Anna vastaanottaa puheluita päivin ja öin — lounastauolla, viikonloppuisin ja pyhäpäivinä. Jokainen potilas pääsee puhumaan jonkun kanssa joka auttaa välittömästi.',\n        'ben2-title': 'Vapautettu vastaanottokapasiteetti',\n        'ben2-desc': 'Vastaanotto voi keskittyä henkilökohtaisiin tapaamisiin, potilasviestintään ja myyntiin — Anna hoitaa rutiinitehtävät taustalla.',\n        'ben3-title': 'Yhdellätoista kielellä, yhdellä äänellä',\n        'ben3-desc': 'Anna kommunikoi yhtä sujuvasti suomeksi, ruotsiksi, norjaksi, tanskaksi, englanniksi, saksaksi, hollanniksi, ranskaksi, italiaksi, slovakiaksi ja unkariksi — ulkomaiset potilaat tunteevat olonsa kotoisaksi vastaanotolla.',\n        'clinic-sub': 'Vastaanoton tiedot',\n        'clinic-title': 'Vastaanoton yksityiskohdat',\n        'clinic-desc': 'Anna tuntee vastaanoton kaikki tärkeät tiedot — aukioloajoista hoitojen kestoon.',\n        'clinic-details-title': 'Vastaanoton tiedot',\n        'clinic-location-label': 'Sijainti',\n        'clinic-location-value': 'Budapest, V. piiri, Keskusta',\n        'clinic-hours-label': 'Aukioloajat',\n        'clinic-hours-value': 'Maanantai–Perjantai 08:00–18:00',\n        'clinic-closed-label': 'Suljettu',\n        'clinic-closed-value': 'Lauantai, sunnuntai ja pyhäpäivät',\n        'clinic-doctors-label': 'Lääkärit',\n        'clinic-doctors-value': 'Dr. Kovács ja Dr. Nagy',\n        'clinic-treatments-title': 'Hoidot & Kesto',\n        'clinic-treatments-note': '30 minuutin aikaikkunat',\n        'treat1-name': 'Tutkimus / Konsultaatio',\n        'treat1-dur': '30 min',\n        'treat2-name': 'Hammaskiven poisto',\n        'treat2-dur': '30 min',\n        'treat4-name': 'Paikan vaihto',\n        'treat4-dur': '45 min',\n        'treat5-name': 'Juurihoito',\n        'treat5-dur': '90 min',\n        'treat6-name': 'Hätähoito',\n        'treat6-dur': '60 min',\n\n        'faq-sub': 'Usein kysytyt kysymykset',\n        'social-sub': 'Social AutoPilot',\n        'social-title': 'Anna julkaisee puolestasi',\n        'social-desc': 'Joka päivä uutta tekoälyn luomaa sisältöä Facebookissa ja LinkedInissä — tekstiä ja kuvia, täysin automaattisesti.',\n        'social-card1-title': 'Automaattinen sisällöntuotanto',\n        'social-card1-text': 'Anna kirjoittaa joka päivä uuden ammattimaisen julkaisun hammashoidon eri aiheista — hampaiden valkaisusta implantteihin ja lasten hammashoidosta päivystyshoitoon. Tekoäly valitsee aiheen satunnaisesti ja laatii asiantuntevan tekstin: otsikko, kysymyksenasettelu, 3–5 käytännön vinkkiä ja toimintakehote. Ei toistoa, ei kaavamaista sävyä — jokainen julkaisu on ainutlaatuinen ja tuore.',\n        'social-card2-title': 'Tekoäly luo kuvat',\n        'social-card2-text': 'Jokaista julkaisua varten Anna luo ammattimaisen hammashoitoaiheisen kuvan — puhtaita, moderneja vastaanottotiloja, säteileviä hymyjä ja korkealaatuisia hoitotuloksia. Kuvat mukautuvat automaattisesti julkaisun aiheeseen, jolloin Facebook- ja LinkedIn-sisältösi pysyy visuaalisesti houkuttelevana ja yhtenäisenä ilman valokuvaajaa.',\n        'social-card2-tag2': 'Ilman vesileimaa',\n        'social-card3-title': 'Facebook ja LinkedIn',\n        'social-card3-text': 'Anna julkaisee samanaikaisesti molemmilla alustoilla: kuvallisen postauksen Facebook-sivulle ja visuaalisen sisällön LinkedIn-yrityssivulle. Julkaisut ilmestyvät välittömästi — ilman manuaalista hyväksyntää. Koko prosessi toimii Make.com-automaatiomoottorin kautta, jossa Claude AI vastaa tekstintuotannosta ja Pollinations kuvien luonnista.',\n        'social-benefit1-title': 'Ajan säästö',\n        'social-benefit1-text': 'Ei tarvitse kirjoittaa sisältöä, etsiä kuvia tai julkaista — Anna hoitaa kaiken',\n        'social-benefit2-title': 'Jatkuva läsnäolo',\n        'social-benefit2-text': 'Päivittäinen tuore sisältö varmistaa, että vastaanotosi ei koskaan näytä passiiviselta',\n        'social-benefit3-title': 'Kasvava tavoittavuus',\n        'social-benefit3-text': 'Säännölliset julkaisut lisäävät orgaanista näkyvyyttä ja houkuttelevat uusia potilaita',\n        'social-benefit4-title': 'Ammatillinen uskottavuus',\n        'social-benefit4-text': 'Laadukkaat, informatiiviset julkaisut vahvistavat vastaanotosi mainetta ja rakentavat luottamusta',\n        'social-follow-fb': 'Seuraa Facebookissa',\n        'social-follow-li': 'Seuraa LinkedInissä',\n        'footer-contact': 'Yhteystiedot',\n        'faq-title': 'Kaikki mitä haluat tietää',\n        'faq-desc': 'Yleisimmät kysymykset ja vastaukset Annasta — jos et löydä etsimääsi, ota yhteyttä minuun!',\n        'faq1-q': 'Toimiiko se olemassa olevassa puhelinnumerossani?',\n        'faq1-a': 'Kyllä! Anna vastaanottaa puheluita olemassa olevassa puhelinnumerossasi — et tarvitse uutta numeroa, vaihtamaan palveluntarjoajaa tai ylimääräistä laitteistoa. Järjestelmä voidaan integroida saumattomasti nykyiseen puhelinlinjaasi, niin että potilaat soittavat samaan numeroon kuin aina ennen. Asennus vie vain muutaman minuutin.',\n        'faq2-q': 'Mitä jos tekoäly ei osaa vastata?',\n        'faq2-a': 'Jos Anna saa kysymyksen johon hän ei ole varautunut (esim. yksityiskohtaiset lääketieteelliset kysymykset, valitusten käsittely, monimutkaiset hintatarjoukset), hän ilmoittaa automaattisesti vastaanoton takaisinsoittoa varten — hän kirjaa potilaan tiedot ja pyynnön yksityiskohdat, jotta vastaanotto voi soittaa potilaalle takaisin mahdollisimman pian. Jos vastaanotto on kiinni, Anna kirjaa pyynnön, ja vastaanotto soittaa potilaalle takaisin seuraavana työpäivänä. Potilas ei jää koskaan ilman vastausta.',\n        'faq3-q': 'Miten pääsee käsiksi järjestelmään?',\n        'faq3-a': 'Anna on toistaiseksi saatavilla portfoliodemona — kehittänyt Peter Petor yksityishenkilönä, eikä se ole vielä kaupallisesti saatavilla. Verkkosivustoa ja puheludemoa voi testata kuka tahansa, niin että hammaslääkärinä, kehittäjänä tai liiketoiminnasta kiinnostuneena saat yleiskuvan siitä miten se toimii. Jos ajattelet lanseerausta tai ainutlaatuista yhteistyötä (pilotiohjelma, integraatio), ota yhteyttä info@dentai.me.',\n        'faq4-q': 'Mitä kieliä hän puhuu?',\n        'faq4-a': 'Toistaiseksi hän kommunikoi sujuvasti yhdellätoista kielellä: suomi, ruotsi, norja, tanska, englanti, saksa, hollanti, ranska, italia, slovakia ja unkari. Kielen valinta tapahtuu automaattisesti — Anna tunnistaa potilaan kielen ja vastaa sillä. Tämä on erityisen arvokasta turistialueilla joissa ulkomaiset potilaat soittavat usein vastaanottoon.',\n        'faq5-a': 'Akuuteissa tilanteissa — esimerkiksi kova hammaskipu, hammasvammat tai verenvuoto — Anna antaa välittömästi prioriteetin puhelulle. Hän tunnistaa akuutti-avainsanat ja yrittää löytää ajan samana päivänä mahdollisimman nopeasti. Todellisissa hätätilanteissa (esim. leukanmurtuma, hallitsematon verenvuoto) hän ohjaa potilaan lähimpään päivystykseen. Akuutteja puheluita ei koskaan käsitellä virheellisesti rutiinivarauksina.',\n        'faq6-q': 'Miten käsitellään tietosuoja (GDPR)?',\n        'faq6-a': 'Anna on kehitetty GDPR-vaatimukset mielessä, mutta on tärkeää olla avoin käytetyistä palveluntarjoajista. Verkkosivusto ja API-liikenne kulkee Cloudflare CDN:n kautta, ja puheenkäsittelyn tarjoaa ElevenLabs — molemmat ovat Yhdysvalloissa sijaitsevia palveluntarjoajia, jotka toimivat EU:n vakiosopimuslausekkeet (SCC) ja tietojenkäsittelysopimusten (DPA) mukaisesti, mutta tietoja voidaan silti siirtää kolmansiin maihin (USA). Ennen lanseerausta jokaisen vastaanoton on tehtävä oma DPA palveluntarjoajien kanssa, ilmoitettava tietojensiirto ja sen oikeudellinen perusta tietosuojaselosteessa, ja on suositeltavaa suorittaa tietosuojavaikutusten arviointi (DPIA). Yksityiskohtaisten terveysvalitusten osalta (erityiset tiedot, GDPR artikla 9) vaaditaan erillinen suostumus. Ennen tuotantolanseerausta on aina suositeltavaa konsultoida tietosuoja-asiantuntijaa/juristia.',\n        'faq7-q': 'Miten Anna yhdistetään puhelinnumeroon?',\n        'faq7-a': 'Kaksi päämenetelmää voidaan käyttää. Uusi numero: Twiliosta tai muista VoIP-palveluntarjoajista voi ostaa puhelinnumeron, joka ohjataan suoraan ElevenLabs Conversational AI Agentille — Twilio-integraatiolla tämä voidaan asentaa muutamassa tunnissa. Olemassa olevan numeron soitonsiirto: vastaanoton nykyiselle numerolle voidaan asettaa ajoitettu soitonsiirto (esim. vain työajan ulkopuolella tai varatun linjan sattuessa), niin että Anna vastaa puheluun vain kun vastaanotto ei ole tavoitettavissa. Tarkka asennus voidaan mukauttaa kunkin vastaanoton infrastruktuuriin yksilöllisesti.',\n        'faq8-q': 'Miten suostumus annetaan puheluissa?',\n        'faq8-a': 'Puhelun yhdistämisen yhteydessä Anna tiedottaa ensimmäisessä lauseessaan soittajalle: tekoälyavustaja puhuu, puhelu saattaa tallentua laadunvarmistusta varten, ja on aina mahdollista pyytää elävän työntekijän takaisinsoittoa (Anna voi pyynnöstä järjestää takaisinsoiton). Jos potilas jatkaa puhelua, tämä katsotaan suostumukseksi konkludenttisella toiminnalla (GDPR artikla 6(1) a ja b). Yksityiskohtaisten terveysvalitusten yhteydessä (esim. kipu, lääkkeet) vaaditaan lisäksi nimenomainen vahvistus. Suostumuksen tosiseikka ja ajankohta kirjataan järjestelmään.',\n        'faq10-q': 'Mitä maksavat vuotuiset käyttökustannukset?',\n        'faq10-a': '<p>Nämä maksaa vastaanotto suoraan palveluntarjoajille. Määrät voivat vaihdella liikenteen mukaan (puheluiden määrä ja kesto). Anna tuottaa myös päivittäin sisältöä Facebookiin ja LinkedIniin.<\u002Fp><ul class=\"space-y-1.5 list-disc pl-5\"><li><strong class=\"text-slate-700\">Verkkotunnus:<\u002Fstrong> 8 – 20 € / vuosi<\u002Fli><li><strong class=\"text-slate-700\">Make.com (Logiikka / Automaatio):<\u002Fstrong> n. 110 € / vuosi<\u002Fli><li><strong class=\"text-slate-700\">ElevenLabs (Ääni):<\u002Fstrong> 125 – 250 € / vuosi<\u002Fli><li><strong class=\"text-slate-700\">Twilio (SMS):<\u002Fstrong> 50 – 150 € / vuosi<\u002Fli><li><strong class=\"text-slate-700\">Cloudflare (Koodi):<\u002Fstrong> 0 €<\u002Fli><li><strong class=\"text-slate-700\">Webhotelli:<\u002Fstrong> 0 – 38 € / vuosi<\u002Fli><li><strong class=\"text-slate-700\">Claude AI (Tekstin tuottaminen):<\u002Fstrong> n. 5 € / vuosi<\u002Fli><li><strong class=\"text-slate-700\">Pollinations AI (Kuvan tuottaminen):<\u002Fstrong> 0 € (ilmainen)<\u002Fli><\u002Ful><div class=\"bg-slate-50 rounded-xl px-4 py-2.5 border border-slate-200/60 -ml-1\"><p class=\"text-sm font-semibold text-slate-800\">Yhteensä: <span class=\"text-dental-700\">n. 298 – 573 € / vuosi<\u002Fspan><\u002Fp><\u002Fdiv><p class=\"text-xs text-slate-400 italic\">Tärkeää vastaanotolle: Pidemmät puhelut tarkoittavat suurempaa laskua. Enemmän puheluita tarkoittaa suurempaa laskua. Enemmän tekstiviestejä tarkoittaa suurempaa laskua. Nämä ovat vain arvioituja arvoja.<\u002Fp>',\n\n        'demo-sub': 'Live demo',\n        'demo-title': 'Kokeile Annaa!',\n        'demo-desc': 'Puhu hänelle puhelimessa, tai tarkista vapaat ajat reaaliajassa — ja koe miltä tuntuu kun mikään ei mättää.',\n        'demo-what': 'Mitä voit kysyä Annalta',\n        'demo-what-s acy<\u002Fa>',\n        'priv-h4': '4. Oikeudellinen perusta ja tietojenkäsittelyn kesto',\n        'priv-p4': 'Oikeudellinen perusta teknisten tietojen käsittelylle on GDPR artikla 6(1) f (oikeutettu etu — turvallinen verkkosivuston toiminta). Oikeudellinen perusta puhepohjaiselle vuorovaikutukselle on suostumus (GDPR artikla 6(1) a), joka annetaan ponnahdusikkunassa ennen puhelun aloittamista. Puhetietoja ei tallenneta pitkäaikaisesti.',\n        'priv-h5': '5. Oikeutesi',\n        'priv-p5': 'Sinulla on oikeus päästä käsiksi, oikaista, poistaa ja vastustaa tietojesi käsittelyä. Hakemus voidaan lähettää info@dentai.me. Valitukset voidaan osoittaa tietosuojavaltuutetulle.',\n        'priv-h6': '6. Vastuunrajoitus',\n        'priv-p6': 'Tämä on portfoliodemo. Tekoälyn tuottamia vastauksia ei pidetä lääketieteellisenä neuvona. Ylläpitäjä ei ota vastuuta käyttäjän antamista tiedoista tai tekoälyn vastauksista mahdollisesti aiheutuvista vahingoista.',\n        'priv-updated': 'Voimaantulo: 26. huhtikuuta 2026.',\n        'modal-title': 'Suostumusilmoitus',\n        'modal-text': 'Puhelua hoitaa tekoäly (AI). Keskustelun aikana käsitellään äänitietoja. Aloittamalla puhelun hyväksyt, että tekoäly tuottaa vastauksia ja että keskustelu ei ole lääketieteellistä neuvontaa.',\n        'modal-checkbox': 'Olen lukenut ja hyväksyn yllä olevan ilmoituksen.',\n        'modal-cancel': 'Peruuta',\n        'modal-accept': 'Hyväksyn',\n\n        'cap-sub': 'Annan kyvyt',\n        'cap-title': 'Kaikki, mitä vastaanottovirkailijan on tiedettävä',\n        'cap-desc': 'Varauksesta peruutukseen ja jonotuslistalle — Anna hoitaa itsenäisesti ja reaaliajassa kaiken potilasviestinnän puhelimitse. Kaikki toiminnot ovat saatavilla kaikilla tuetuilla kielillä.',\n        'cap1-title': 'Vapaat ajat',\n        'cap1-desc': 'Anna hakee reaaliajassa vapaat ajat Google-kalenterista — suodatettuna päivämäärän, kellonajan tai lääkärin mukaan. Potilas saa heti valikoiman ehdotuksia.',\n        'cap1-tag2': 'Reaaliaika',\n        'cap2-title': 'Ajanvaraus',\n        'cap2-desc': 'Kun potilas antaa nimensä, sähköpostiosoitteensa ja haluamansa ajan, Anna tallentaa varauksen kalenteriin ja lähettää heti tekstiviesti- ja sähköpostivahvistuksen.',\n        'cap2-tag1': 'Vahvistus',\n        'cap3-title': 'Ajan muuttaminen',\n        'cap3-desc': 'Jos potilas pyytää toista aikaa, Anna peruuttaa vanhan ja varaa uuden — hän tarkistaa myös uuden ajan saatavuuden kalenterista päällekkäisyyksien välttämiseksi.',\n        'cap3-tag1': 'Vanha → Uusi',\n        'cap3-tag2': 'Tarkistettu',\n        'cap4-title': 'Ajan peruminen',\n        'cap4-desc': 'Potilas voi vahvistaa peruutuksen — Anna poistaa tapahtuman kalenterista ja lähettää peruutusvahvistuksen tekstiviestillä ja sähköpostilla oikealla kielellä.',\n        'cap4-tag1': 'Ilmoitus',\n        'cap4-tag2': 'Kalenteripäivitys',\n        'cap5-title': 'Aikojen haku',\n        'cap5-desc': 'Jos potilas ei muista varaustaan, Anna hakee tulevat ajat puhelinnumeron tai sähköpostiosoitteen perusteella ja lukee ne ääneen muuttamisen tai peruuttamisen helpottamiseksi.',\n        'cap5-tag1': 'Haku',\n        'cap5-tag2': 'Potilastunnistus',\n        'cap6-title': 'Jonotuslista',\n        'cap6-desc': 'Jos vapaata aikaa ei ole, Anna lisää potilaan ensisijaiselle jonotuslistalle — yhdessä tämän toivomien aikojen kanssa. Kun paikka vapautuu, järjestelmä ilmoittaa siitä hänelle automaattisesti.',\n        'cap6-tag1': 'Etusija',\n        'cap6-tag2': 'Automaattinen ilmoitus',\n        'cap7-title': 'Tietojen muuttaminen',\n        'cap7-desc': 'Jos potilas on saanut uuden puhelinnumeron tai sähköpostiosoitteen, Anna päivittää tiedot järjestelmässä — nykyisen sähköpostitunnuksen perusteella, välittömästi.',\n        'cap7-tag1': 'Puhelin / sähköposti',\n        'cap7-tag2': 'Välitön',\n        'cap8-title': 'Puhelun siirto',\n        'cap8-desc': 'Jos potilas haluaa puhua työntekijän kanssa, jos tapahtuu tekninen virhe tai jos Anna ei onnecting': 'Pripájam sa k Anne...',\n        'status-listening': 'Anna počúva — povedzte jej, čo potrebujete',\n        'status-speaking': 'Anna vám odpovedá',\n        'error-server': 'Nepodarilo sa začať hovor. Server nie je dostupný.',\n        'error-mic': 'Povolenie na prístup k mikrofónu je potrebné na začatie hovoru. Povoľte prístup k mikrofónu v nastaveniach prehliadača a skúste to znova.',\n        'error-no-url': 'Nepodarilo sa pripojiť k Anne (signed URL chýba). Skúste to znova neskôr!',\n\n        'header-available': 'Anna dostupná',\n        'header-connecting': 'Pripájam sa...',\n        'header-listening': 'Anna počúva...',\n        'header-speaking': 'Anna hovorí...',\n        'mobile-available': 'Anna dostupná',\n        'menu-label': 'Menu',\n        'menu-close': 'Zavrieť',\n        'float-1': 'Prichádzajúci hovor',\n        'float-2': 'Termín rezervovaný',\n        'float-3': 'Potvrdenie odoslané',\n        'phone-anna-name': 'Anna',\n        'phone-anna-role': 'Senior Asistent · Online',\n        'chat-1': 'Dobrý večer! Chcel by som si rezervovať čistenie zubov na zajtrajšie ráno.',\n        'chat-2': 'Dobrý večer! Hneď sa pozriem na voľné termíny. Zajtra ráno o 9:00 a 11:30 sú oba voľné — ktorý vám vyhovuje?',\n        'chat-3': '9:00 by bolo perfektné!',\n        'chat-4': 'Hotovo! Ste rezervovaný na zajtra o 9:00. Potvrdenie vám pošlem SMS a e-mailom.',\n        'chat-input': 'Napíšte správu Anne...',\n        'how-title-sub': 'Ako to funguje',\n        'how-title': 'Pokojná prax v štyroch krokoch',\n        'how-desc': 'Kompletná automatizácia od hovoru po vyšetrenie. Pacient sa len prihlási, prácu v pozadí vykoná Anna.',\n        'step1-title': 'Prichádzajúca žiadosť',\n        'step1-desc': 'Pacient zavolá alebo rezervuje na stránke — Anna okamžite zdvihne hovor, cez deň aj v noci. Žiadne čakanie, žiadny obsadený tón.',\n        'step1-tag1': 'Telefón',\n        'step1-tag2': 'Webová rezervácia',\n        'step2-title': 'Inteligentné zistenie potrieb',\n        'step2-desc': 'Anna analyzuje požiadavku pacienta — akútna bolesť zuba, rutinné čistenie alebo konzultácia — a okamžite smeruje k správnej špecializácii.',\n        'step2-tag1': 'Triaž',\n        'step2-tag2': 'Viacjazyčne',\n        'step3-title': 'Synchronizácia kalendára',\n        'step3-desc': 'Anna vidí voľné termíny v reálnom čase a okamžite ich rezervuje — alebo zmení, ak pacient požaduje iný čas.',\n        'step3-tag1': 'V reálnom čase',\n        'step3-tag2': 'Rezervácia/Zmena',\n        'step4-title': 'Odborné informácie',\n        'step4-desc': 'Anna odpovedá na otázky o liečbe a prevádzke ambulancie, aby pacient mal všetky informácie potrebné na rozhodnutie.',\n        'step4-tag1': 'E-mail',\n        'step4-tag2': 'SMS',\n        'step4-tag3': 'Kalendár',\n        'care-sub': 'Automatická následná starostlivosť',\n        'care-title': 'Je tam pred aj po stretnutí',\n        'care-desc': 'Anna nielen rezervuje — stará sa. Ráno pred liečbou pripomenie, deň po liečbe sa opýta. Pacient sa nikdy necíti zabudnutý, a ambulancia získava skutočnú spätnú väzbu o kvalite.',\n        'care1-title': 'SMS pripomenutie pred termínom',\n        'care1-subtitle': 'Automatické — Bez ľudského zásahu',\n        'care1-desc': 'Ráno pred liečbou Anna automaticky pošle pacientovi SMS o nasledujúcom termíne, aby zabránila zabudnutiu. Tento proces drasticky znižuje počet nedostavení a úplne oslobodzuje recepciu od manuálnych pripomenutí.',\n        'care1-tag1': 'Twilio SMS',\n        'care1-tag2': 'Google Kalendár',\n        'care1-tag3': 'Časovaný',\n        'care1-step1-title': 'Časovanie: každé ráno',\n        'care1-step1-desc': 'Systém každé ráno odošle pripomienkové SMS pre nasledujúce rezervácie',\n        'care1-step2-title': 'Vyhľadávanie v kalendári',\n        'care1-step2-desc': 'Anna načíta udalosť z Google Kalendára a skontroluje detaily',\n        'care1-step3-title': 'Odoslanie SMS (Twilio)',\n        'care1-step3-desc': 'Personalizovaná pripomienková SMS — meno, čas a miesto sú súčasťou',\n        'care1-sms-header': 'Pripomienka · zajtrajší termín',\n        'care1-sms-body': 'Pripomienka: váš zubársky termín zajtra',\n        'care1-sms-arrival': 'Prosím, príďte o 10 minút skôr.',\n        'care1-sms-date': '📅 29. 04. 2026 · 10:00',\n        'care1-sms-footer': '— DentAi asistentka',\n        'care1-sms-preview': 'Vážený Ján Kováč! 👋',\n        'care2-title': 'Následná starostlivosť po liečbe / dotazník',\n        'care2-subtitle': 'Automatické — Bez ľudského zásahu',\n        'care2-desc': 'Deň po liečbe Anna odošle krátky dotazník e-mailom, v ktorom pacient môže ohodnotiť službu. Spätné väzby sa automaticky zaznamenávajú, takže ambulancia môže neustále zlepšovať kvalitu služieb bez manuálneho zadávania údajov.',\n        'care2-tag1': 'Gmail',\n        'care2-tag2': 'Štatistika',\n        'care2-tag3': 'Časovaný',\n        'care2-step1-title': 'Časovanie: deň po liečbe',\n        'care2-step1-desc': 'Deň po liečbe systém odošle pacientom e-maily s dotazníkom',\n        'care2-step2-title': 'E-mail s dotazníkom (Gmail)',\n        'care2-step2-desc': 'Personalizovaný e-mail s odkazom na dotazník — spokojnosť, skúsenosti, návrhy',\n        'care2-step3-title': 'Štatistické zaznamenávanie',\n        'care2-step3-desc': 'Odpovede sa automaticky vložia do štatistickej tabuľky Google Sheets',\n        'care2-email-from': 'DentAi Asistent',\n        'care2-email-to': '→ jan.kovac@email.sk',\n        'care2-email-subject': 'Spätná väzba na vyšetrenie – DentAi',\n        'care2-email-body': 'Vážený Ján Kováč! Dúfame, že dnešná návšteva prebehla hladko. Váš názor je pre nás dôležitý: prosím, podeľte sa o svoje skúsenosti prostredníctvom krátkeho dotazníka, aby sme mohli ešte viac zvýšiť úroveň našej starostlivosti.',\n        'care2-email-cta': '→ Vyplniť dotazník',\n        'care-stat1-value': '~40%',\n        'care-stat1-label': 'Menej zabudnutých termínov vďaka pripomienkam',\n        'care-stat2-value': '0',\n        'care-stat2-label': 'Ručná práca a plne automatizovaný proces',\n        'care-stat3-value': '24h',\n        'care-stat3-label': 'Spätná väzba po liečbe',\n        'flow-1': 'Prichádzajúci hovor/Web',\n        'flow-2': 'Zistenie potrieb',\n        'flow-3': 'Synchronizácia kalendára',\n        'flow-4': 'Potvrdenie',\n        'flow-done': 'Hotovo!',\n        'why-sub': 'Prečo Anna?',\n        'why-title': 'Uvoľnená kapacita recepcie — okamžite',\n        'why-desc': 'Anna nenahradzuje recepciu — preberá opakujúce sa úlohy, aby sa váš tím mohol sústrediť na to, čo je skutočne dôležité.',\n        'ben1-title': 'Už nikdy zmeškaný hovor',\n        'ben1-desc': 'Anna prijíma hovory vo dne aj v noci — počas obeda, cez víkendy aj sviatky. Každý pacient sa môže rozprávať s niekým, kto okamžite pomôže.',\n        'ben2-title': 'Uvoľnená kapacita recepcie',\n        'ben2-desc': 'Recepcia sa môže sústrediť na osobné stretnutia, komunikáciu s pacientmi a predaj — Anna vykonáva rutinné úlohy v pozadí.',\n        'ben3-title': 'V jedenástich jazykoch, jedným hlasom',\n        'ben3-desc': 'Anna plynulo komunikuje po slovensky, nórsky, dánsky, švédsky, fínsky, holandsky, anglicky, nemecky, francúzsky, taliansky aj maďarsky — zahraniční pacienti sa cítia v ambulancii ako doma.',\n        'clinic-sub': 'Informácie o ambulancii',\n        'clinic-title': 'Detaily ambulancie',\n        'clinic-desc': 'Anna pozná všetky dôležité údaje ambulancie — od otváracích hodín po trvanie liečby.',\n        'clinic-details-title': 'Detaily ambulancie',\n        'clinic-location-label': 'Poloha',\n        'clinic-location-value': 'Budapešť, V. obvod, Centrum',\n        'clinic-hours-label': 'Otváracie hodiny',\n        'clinic-hours-value': 'Pondelok–Piatok 08:00–18:00',\n        'clinic-closed-label': 'Zatvorené',\n        'clinic-closed-value': 'Sobota, nedeľa a sviatky',\n        'clinic-doctors-label': 'Lekári',\n        'clinic-doctors-value': 'Dr. Kovács a Dr. Nagy',\n        'clinic-treatments-title': 'Liečby & Trvanie',\n        'clinic-treatments-note': '30-minútové časové bloky',\n        'treat1-name': 'Vyšetrenie / Konzultácia',\n        'treat1-dur': '30 min',\n        'treat2-name': 'Odstránenie zubného kameňa',\n        'treat2-dur': '30 min',\n        'treat4-name': 'Výmena plomby',\n        'treat4-dur': '45 min',\n        'treat5-name': 'Ošetrenie koreňa',\n        'treat5-dur': '90 min',\n        'treat6-name': 'Núdzová starostlivosť',\n        'treat6-dur': '60 min',\n\n        'faq-sub': 'Časté otázky',\n        'social-sub': 'Social AutoPilot',\n        'social-title': 'Anna publikuje za vás',\n        'social-desc': 'Každý deň nový obsah generovaný AI na Facebooku a LinkedIn — text aj obrázky, úplne automaticky.',\n        'social-card1-title': 'Automatizované vytváranie obsahu',\n        'social-card1-text': 'Anna každý deň napíše nový odborný príspevok na rôzne stomatologické témy — od bielenia zubov po implantáty, od detskej stomatológie po urgentnú starostlivosť. AI náhodne vyberie tému a následne vytvorí formálny, odborný text: nadpis, otázka, 3–5 praktických tipov a výzvu k akcii. Žiadne opakovanie, žiadny fádny tón — každý príspevok je jedinečný a aktuálny.',\n        'social-card2-title': 'AI vytvára obrázky',\n        'social-card2-text': 'Ku každému príspevku Anna generuje profesionálny stomatologický obrázok — čisté, moderné prostredie ordinácie, žiariace úsmevy, estetické výsledky liečby. Obrázky sa automaticky prispôsobujú téme príspevku, takže váš obsah na Facebooku a LinkedIn zostáva vizuálne príťažlivý a konzistentný, a to aj bez fotografa.',\n        'social-card2-tag2': 'Bez vodoznaku',\n        'social-card3-title': 'Facebook a LinkedIn',\n        'social-card3-text': 'Anna publikuje súčasne na oboch platformách: s fotografiou na Facebook stránke a s vizuálnym obsahom na firemnom profile LinkedIn. Príspevky sa zobrazia okamžite — bez potreby schvaľovania. Celý proces beží cez automatizačný motor Make.com, pričom Claude AI píše texty a Pollinations generuje obrázky.',\n        'social-benefit1-title': 'Úspora času',\n        'social-benefit1-text': 'Netreba písať obsah, hľadať obrázky alebo publikovať — Anna všetko zvládne',\n        'social-benefit2-title': 'Konzistentná prítomnosť',\n        'social-benefit2-text': 'Denný čerstvý obsah zabezpečuje, že vaša prax nikdy nevyzerá neaktívne',\n        'social-benefit3-title': 'Rastúci dosah',\n        'social-benefit3-text': 'Pravidelné príspevky zvyšujú organickú viditeľnosť a priťahujú nových pacientov',\n        'social-benefit4-title': 'Odborná dôveryhodnosť',\n        'social-benefit4-text': 'Kvalitné, informatívne príspevky posilňujú reputáciu vašej praxe a budujú dôveru',\n        'social-follow-fb': 'Sledujte na Facebooku',\n        'social-follow-li': 'Sledujte na LinkedIn',\n        'footer-contact': 'Kontakt',\n        'faq-title': 'Všetko, čo chcete vedieť',\n        'faq-desc': 'Najčastejšie otázky a odpovede o Anne — ak nenájdete to, čo hľadáte, kontaktujte ma!',\n        'faq1-q': 'Funguje to na mojom súčasnom telefónnom čísle?',\n        'faq1-a': 'Áno! Anna prijíma hovory na vaše súčasné telefónne číslo — nepotrebujete nové číslo, zmenu operátora ani extra zariadenie. Systém sa dá bezproblémovo integrovať s vašou súčasnou telefónnou linkou, takže pacienti volajú na rovnaké číslo, ktoré doteraz poznali. Nastavenie trvá len niekoľko minút.',\n        'faq2-q': 'Čo ak AI nevie odpovedať?',\n        'faq2-a': 'Ak Anna dostane otázku, na ktorú nie je pripravená (napr. špecifická lekárska otázka, riešenie sťažností, komplexná cenová ponuka), automaticky upozorní recepciu ambulancie na spätné zavolanie — zaznamná údaje pacienta a podrobnosti požiadavky, aby recepcia mohla pacienta kontaktovať čo najskôr. Ak je ambulancia zatvorená, Anna si zaznamená požiadavku a recepcia nasledujúci pracovný deň pacientovi zavolá. Pacient nikdy neostane bez odpovede.',\n        'faq3-q': 'Ako je možné získať prístup k systému?',\n        'faq3-a': 'Anna je momentálne dostupná ako portfóliová demo — vyvinutá Petrom Peterom ako súkromná osoba, zatiaľ sa nepredáva komerčne. Webová stránka a konverzačná demo sú k dispozícii na vyskúšanie pre každého, takže ako zubár, vývojár alebo obchodne záujemcový môžete získať prehľad o fungovaní. Ak uvažujete o nasadení alebo unikátnej spolupráci (pilotný program, integrácia), kontaktujte ma na info@dentai.me.',\n        'faq4-q': 'V koľkých jazykoch hovorí?',\n        'faq4-a': 'Momentálne plynulo komunikuje v jedenástich jazykoch: slovensky, nórsky, dánsky, švédsky, fínsky, holandsky, anglicky, nemecky, francúzsky, taliansky a maďarsky. Výber jazyka je automatický — Anna rozpozná jazyk pacienta a odpovedá v ňom. To je obzvlášť cenné v turisticky frekventovaných oblastiach, kde zahraniční pacienti často volajú do ambulancie.',\n        'faq5-q': 'Ako sa riešia urgentné prípady?',\n        'faq5-a': 'V urgentných situáciách — napríklad pri silnej bolesti zuba, úraze (traume) alebo krvácaní — Anna okamžite prioritizuje hovor. Rozpoznáva kľúčové slová naliehavosti a okamžite informuje zubára alebo personál ambulancie. a snaží sa čo najrýchlejšie nájsť termín na ten istý deň. Urgentné hovory nikdy neskončia ako rutinné rezervácie.',\n        'faq6-q': 'Ako sa zabezpečuje ochrana údajov (GDPR)?',\n        'faq6-a': 'Anna bola vytvorená s ohľadom na požiadavky GDPR, ale je dôležité byť transparentný o použitých poskytovateľoch služieb. Webová stránka a API prenos prechádzajú cez Cloudflare CDN a spracovanie hlasu zabezpečuje ElevenLabs — obaja sú poskytovatelia z USA, ktorí fungujú so Štandardnými zmluvnými doložkami (SCC) a Dohodami o spracovaní údajov (DPA), napriek tomu môžu byť údaje preniesané do tretej krajiny (USA). Pred uvedením do prevádzky musí každá ambulancia uzatvoriť vlastnú DPA s poskytovateľmi, v oznámení o ochrane údajov uviesť skutočnosť a právny základ prenosu údajov a odporuča sa vypracovať posúdenie vplyvu na ochranu údajov (DPIA). Na podrobné zdravotné sťažnosti (osobitné údaje, článok 9 GDPR) je potrebný osobitný výslovný súhlas. Pred uvedením do prevádzky sa vždy odporúča konzultácia s odborníkom na ochranu údajov/právnikom.',\n        'faq7-q': 'Ako sa Anna prepojí s vaším telefónnym číslom?',\n        'faq7-a': 'Možné sú dva hlavné prístupy. Nové číslo: od Twilia alebo iného VoIP poskytovateľa je možné zakúpiť telefónne číslo, ktoré je nasmerované priamo na ElevenLabs Conversational AI Agent — pomocou Twilio integrácie to možno nastaviť za niekoľko hodín. Presmerovanie existujúceho čísla: na súčasnom čísle ambulancie je možné nastaviť periodické presmerovanie (napr. len mimo pracovnej doby alebo pri obsadenej linke), takže Anna preberá hovory len vtedy, keď recepcia nie je k dispozícii. Presné nastavenie možno individuálne prispôsobiť infraštruktúre každej ambulancie.',\n        'faq8-q': 'Ako sa udeľuje súhlas pri telefónnom hovore?',\n        'faq8-a': 'Pri nadviazaní hovoru Anna v prvej vete informuje volajúceho: hovorí asistent s umelou inteligenciou, hovor môže byť nahrávaný za účelom zabezpečenia kvality a kedykoľvek je možné vyžiadať si spätné zavolanie od živého pracovníka (Anna môže na požiadanie zariadiť spätné zavolanie). Ak pacient pokračuje v rozhovore, považuje sa to za súhlas konkludentným konaním (článok 6 ods. 1 písm. a a b GDPR). Pri podrobných zdravotných sťažnostiach (napr. bolesť, lieky) je potrebné ďalšie výslovné potvrdenie. Skutočnosť a čas súhlasu systém zaznamenáva.',\n        'faq10-q': 'Koľko stoja ročné prevádzkové náklady?',\n        'faq10-a': '<p>Tieto náklady platí ambulancia priamo poskytovateľom služieb. Sumy sa môžu líšiť v závislosti od prevádzky (počet a dĺžka hovorov). Anna navyše denne generuje obsah pre Facebook a LinkedIn.<\u002Fp><ul class=\"space-y-1.5 list-disc pl-5\"><li><strong class=\"text-slate-700\">Doménové meno:<\u002Fstrong> 8 – 20 € / rok<\u002Fli><li><strong class=\"text-slate-700\">Make.com (Logika a automatizácia):<\u002Fstrong> cca 110 € / rok<\u002Fli><li><strong class=\"text-slate-700\">ElevenLabs (Hlas):<\u002Fstrong> 125 – 250 € / rok<\u002Fli><li><strong class=\"text-slate-700\">Twilio (SMS):<\u002Fstrong> 50 – 150 € / rok<\u002Fli><li><strong class=\"text-slate-700\">Cloudflare (Kód):<\u002Fstrong> 0 €<\u002Fli><li><strong class=\"text-slate-700\">Webhosting:<\u002Fstrong> 0 – 38 € / rok<\u002Fli><li><strong class=\"text-slate-700\">Claude AI (Generovanie textu):<\u002Fstrong> cca 5 € / rok<\u002Fli><li><strong class=\"text-slate-700\">Pollinations AI (Generovanie obrázkov):<\u002Fstrong> 0 € (bezplatne)<\u002Fli><\u002Ful><div class=\"bg-slate-50 rounded-xl px-4 py-2.5 border border-slate-200/60 -ml-1\"><p class=\"text-sm font-semibold text-slate-800\">Celkom: <span class=\"text-dental-700\">cca 298 – 573 € / rok<\u002Fspan><\u002Fp><\u002Fdiv><p class=\"text-xs text-slate-400 italic\">Dôležité informácie pre ambulanciu: Dlhší rozhovor znamená vyšší účet. Viac hovorov znamená vyšší účet. Viac SMS znamená vyšší účet. Tieto sú len odhadované hodnoty.<\u002Fp>',\n\n        'demo-sub': 'Živé demo',\n        'demo-title': 'Vyskúšajte Annu!',\n        'demo-desc': 'Porozprávajte sa s ňou telefónom alebo si pozrite voľné termíny v reálnom čase — a zažite, aké to je, keď vám nič neunikne.',\n        'demo-what': 'Čo sa môžete opýtať Anny',\n        'demo-what-sub': 'Jednoducho rozprávajte prirodzene — Anna rozumie!',\n        'prompt1-title': 'Rezervácia termínu',\n        'prompt1-text': '«Chcel by som rezervovať čistenie zubov na budúci utorok o 14:00»',\n        'prompt2-title': 'Zmena termínu',\n        'prompt2-text': '«Chcem presunúť zajtrajší termín na štvrtok»',\n        'prompt3-title': 'Akútna bolesť zuba',\n        'prompt3-text': '«Bolí ma zub a je to čoraz horšie — môžete ma prijať ešte dnes?»',\n        'prompt4-title': 'Odborné informácie',\n        'prompt4-text': 'Anna odpovedá na otázky o liečbe a prevádzke ambulancie, aby pacient mal všetky informácie potrebné na rozhodnutie.',\n        'demo-available': 'Anna dostupná',\n        'demo-response': 'Odpoveď <2 s',\n        'demo-voice': 'Hlasová konverzácia s Annou',\n        'cal-title': 'Annin živý kalendár',\n        'cal-sub': 'Voľné termíny v reálnom čase',\n        'cal-sync': 'Synchronizácia:',\n        'cal-auto': 'Automatická aktualizácia každých 30 sekúnd',\n        'cal-refresh': 'Aktualizovať teraz',\n        'cal-loading': 'Načítavam Annin kalendár...',\n        'cal-err-title': 'Kalendár momentálne nie je dostupný',\n        'cal-err-desc': 'Skúste to prosím neskôr alebo zavolajte Anne priamo.',\n        'cal-err-retry': 'Skúsiť znova',\n        'footer-desc': 'Anna — DentAi Senior Asistentka. Nonstop príjem hovorov, online rezervácia a automatické potvrdenie, aby vaša prax vždy fungovala pokojne.',\n        'footer-langs': 'Jazyky',\n        'footer-info-title': 'Informácie',\n        'footer-portfolio': 'Portfóliové demo Vytvoril: Peter Petor',\n        'footer-impressum': 'Impressum',\n        'footer-privacy': 'Oznámenie o ochrane údajov',\n        'footer-gdpr': 'Právne vyhlásenie: Toto je portfóliová demo. Prosím, neuvádzajte skutočné údaje! Za odpovede AI nepreberám zodpovednosť.',\n        'footer-copy': '© 2026 DentAi Asistent. Všetky práva vyhradené. Prevádzkované AI Annou.',\n        'time-past': 'Požadovaný termín už uplynul. Prosím, vyberte budúci termín.',\n        'time-too-close': 'Termín je príliš skoro — minimálne 2 hodiny vopred je potrebné na rezerváciu.',\n        'time-too-late': 'Požadovaný termín je príliš neskoro — liečba sa nezmestí do otváracích hodín (08:00–18:00).',\n        'time-closed': 'Ambulancia je v tomto čase zatvorená. Otváracie hodiny: Po–Pi 08:00–18:00.',\n        'time-invalid': 'Neplatný termín. Prosím, vyberte iný.',\n        'time-suggest-prefix': 'Voľné termíny:',\n        'time-booking-sent': 'Rezervácia odoslaná — potvrdenie čoskoro!',\n        'legal-title': 'Právne informácie',\n        'legal-tab-impressum': 'Impressum',\n        'legal-tab-privacy': 'Oznámenie o ochrane údajov',\n        'legal-close': 'Zavrieť',\n        'imp-intro': 'Táto webová stránka je portfóliová prezentácia prevádzkovaná nižšie uvedenou fyzickou osobou. Webová stránka neposkytuje skutočné zdravotnícke služby.',\n        'imp-name-label': 'Meno prevádzkovateľa:',\n        'imp-name-value': 'Peter Petor (súkromná osoba)',\n        'imp-email-label': 'E-mailová adresa:',\n        'imp-purpose-label': 'Účel stránky:',\n        'imp-purpose-value': 'Portfólio / technologická demo (nie komerčná služba)',\n        'imp-host-label': 'Hostingový poskytovateľ:',\n        'imp-host-value': 'Cloudflare, Inc. (101 Townsend St, San Francisco, CA 94107, USA)',\n        'imp-legal-basis': 'Právny základ: zákon o elektronickom obchode. Názov \"DentAi Asistent\" je výhradne fiktívny a slúži na demonštračné účely, neexistuje žiadna skutočná zdravotnícka inštitúcia pod týmto názvom.',\n        'priv-intro': 'Toto oznámenie poskytuje informácie o spracovaní údajov počas návštevy webovej stránky na základe nariadenia GDPR (EU 2016/679) a platnej vnútroštátnej legislatívy.',\n        'priv-h1': '1. Správca údajov',\n        'priv-p1': 'Peter Petor ako súkromná osoba, kontakt: info@dentai.me. Stránka je portfóliová demo, k skutočnému spracovaniu zdravotných údajov nedochádza.',\n        'priv-h2': '2. Spracovávané údaje a účely',\n        'priv-li2-1': '<strong>Technické údaje:<\u002Fstrong> IP adresa, typ prehliadača a zariadenia, čas návštevy — výhradne za účelom obsluhy webovej stránky a z bezpečnostných dôvodov (Cloudflare).',\n        'priv-li2-2': '<strong>Hlasové údaje (len pri spustení hovoru):<\u002Fstrong> Zvuk z vášho mikrofónu sa dočasne spracováva na generovanie konverzácie (ElevenLabs). Prosím, nezdieľajte skutočné osobné údaje!',\n        'priv-li2-3': '<strong>LocalStorage:<\u002Fstrong> Vo vašom prehliadači sa uloží označenie, že ste prijali právne vyhlásenie — to sa neposiela na žiadny server.',\n        'priv-h3': '3. Poskytovatelia tretích strán (prenos údajov do zahraničia)',\n        'priv-p3': 'Webová stránka načítava zdroje od nasledujúcich externých poskytovateľov. Tým môžu byť vaša IP adresa a údaje prehliadača prenesené do tretích krajín (typicky USA), kde platia príslušné pravidlá ochrany údajov poskytovateľa:',\n        'priv-li3-1': '<strong>Cloudflare<\u002Fstrong> (CDN, hosting) — <a href=\"https://www.cloudflare.com/privacypolicy/\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">privacypolicy<\u002Fa>',\n        'priv-li3-2': '<strong>Google Fonts<\u002Fstrong> (písma) — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-li3-3': '<strong>Tailwind CDN<\u002Fstrong> (CSS rámec)',\n        'priv-li3-4': '<strong>ElevenLabs<\u002Fstrong> (hlasová AI) — <a href=\"https://elevenlabs.io/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">elevenlabs.io/privacy<\u002Fa>',\n        'priv-li3-5': '<strong>Google Kalendár<\u002Fstrong> — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-h4': '4. Právny základ a trvanie spracovania údajov',\n        'priv-p4': 'Právnym základom spracovania technických údajov je článok 6 ods. 1 písm. f GDPR (oprávnený záujem — bezpečná prevádzka webovej stránky). Právnym základom hlasovej interakcie je súhlas (článok 6 ods. 1 písm. a GDPR), ktorý sa udeľuje v vyskakovacom okne pred začatím hovoru. Hlasové údaje sa dlhodobo neukladajú.',\n        'priv-h5': '5. Vaše práva',\n        'priv-p5': 'Máte právo na prístup, opravu, vymazanie a námietku voči spracovaniu vašich údajov. Žiadosť môžete poslať na info@dentai.me. Sťažnosť možno podať na Úrade na ochranu osobných údajov SR.',\n        'priv-h6': '6. Vylúčenie zodpovednosti',\n        'priv-p6': 'Toto je portfóliová demo. Odpovede generované AI sa nepovažujú za lekárske rady. Prevádzkovateľ nenesie žiadnu zodpovednosť za údaje poskytnuté používateľom ani za prípadné škody vyplývajúce z odpovedí umelej inteligencie.',\n        'priv-updated': 'Platné od: 26. apríla 2026.',\n        'modal-title': 'Vyhlásenie o súhlase',\n        'modal-text': 'Hovor je spravovaný umelou inteligenciou (AI). Počas konverzácie sú spracovávané hlasové údaje. Spustením hovoru prijímate, že AI generuje odpovede a že konverzácia nepredstavuje lekárske poradenstvo.',\n        'modal-checkbox': 'Prečítal som si a prijímam vyššie uvedené oznámenie.',\n        'modal-cancel': 'Zrušiť',\n        'modal-accept': 'Prijať',\n\n        'cap-sub': 'Schopnosti Anny',\n        'cap-title': 'Všetko, čo musí vedieť recepčná',\n        'cap-desc': 'Od rezervácie cez zrušenie až po čakaciu listinu — Anna samostatne a v reálnom čase spravuje celú komunikáciu s pacientmi telefonicky. Všetky funkcie sú dostupné vo všetkých podporovaných jazykoch.',\n        'cap1-title': 'Voľné termíny',\n        'cap1-desc': 'Anna v reálnom čase vyhľadáva voľné miesta v Google Kalendári — filtrované podľa dátumu, časti dňa alebo lekára. Pacient dostane okamžitý výber.',\n        'cap1-tag2': 'Reálny čas',\n        'cap2-title': 'Rezervácia termínu',\n        'cap2-desc': 'Po zadaní mena pacienta, e-mailovej adresy a požadovaného času Anna zaznamená rezerváciu do kalendára a okamžite odošle potvrdzujúcu SMS a e-mail.',\n        'cap2-tag1': 'Potvrdenie',\n        'cap3-title': 'Zmena termínu',\n        'cap3-desc': 'Ak pacient požaduje iný termín, Anna zruší starý termín a rezervuje nový — skontroluje aj dostupnosť nového termínu v kalendári, aby nedošlo ku konfliktom.',\n        'cap3-tag1': 'Starý → Nový',\n        'cap3-tag2': 'Overený',\n        'cap4-title': 'Zrušenie termínu',\n        'cap4-desc': 'Pacient môže potvrdiť zrušenie — Anna odstráni udalosť z kalendára a odošle potvrdenie o zrušení SMS a e-mailom v príslušnom jazyku.',\n        'cap4-tag1': 'Oznámenie',\n        'cap4-tag2': 'Aktualizácia kalendára',\n        'cap5-title': 'Vyhľadanie termínov',\n        'cap5-desc': 'Ak si pacient nepamätá svoju rezerváciu, Anna vyhľadá nadchádzajúce termíny podľa telefónneho čísla alebo e-mailu a prečíta ich nahlas, aby uľahčila zmenu alebo zrušenie.',\n        'cap5-tag1': 'Vyhľadávanie',\n        'cap5-tag2': 'Identifikácia pacienta',\n        'cap6-title': 'Čakacia listina',\n        'cap6-desc': 'Ak nie je voľný termín, Anna zapíše pacienta na prioritnú čakaciu listinu — spolu s preferovanými časovými úsekmi. Keď sa uvoľní miesto, systém ho automaticky upozorní.',\n        'cap6-tag1': 'Priorita',\n        'cap6-tag2': 'Automatické upozornenie',\n        'cap7-title': 'Zmena údajov',\n        'cap7-desc': 'Ak pacient získal nové telefónne číslo alebo e-mailovú adresu, Anna aktualizuje údaje v systéme — na základe aktuálneho e-mailového identifikátora s okamžitou platnosťou.',\n        'cap7-tag1': 'Telefón / e-mail',\n        'cap7-tag2': 'Okamžité',\n        'cap8-title': 'Prepojenie hovoru',\n        'cap8-desc': 'Ak pacient chce hovoriť s kolegom, ak dôjde k technickej chybe alebo ak Anna nedokáže odpovedať, automaticky upozorní recepciu na spätný hovor — pacient nikdy neostane bez odpovede.',\n        'cap8-tag1': 'Spätný hovor',\n        'cap8-tag2': 'Bezpečnostná sieť',\n        'cap-stat1-label': 'Zabudovaných nástrojov na komunikáciu s pacientmi',\n        'cap-stat2-label': 'Jazyky, v ktorých plynule komunikuje',\n        'cap-stat3-label': 'K dispozícii vo dne i v noci, aj počas sviatkov',\n        'cap-stat3-value': '24/7',\n        'lang-title': 'Jedenásť jazykov, jeden hlas',\n        'lang-subtitle': 'Automatická detekcia jazyka — všetky funkcie dostupné vo všetkých jazykoch',\n        'lang-auto': 'Automatická detekcia',\n        'lang-desc': 'Anna automaticky rozpozná jazyk pacienta na začiatku hovoru a pokračuje v konverzácii ointerEvents = 'auto';\n          if (chevron) chevron.style.transform = 'rotate(180deg)';\n        }\n      });\n\n      menu.querySelectorAll('.lang-option').forEach(opt => {\n        opt.addEventListener('click', function() {\n          switchLang(this.getAttribute('data-lang'));\n        });\n      });\n\n      document.addEventListener('click', function(e) {\n        if (!btn.contains(e.target) && !menu.contains(e.target)) {\n          menu.style.opacity = '0';\n          menu.style.visibility = 'hidden';\n          menu.style.transform = 'translateY(-4px)';\n          menu.style.pointerEvents = 'none';\n          if (chevron) chevron.style.transform = '';\n        }\n      });\n    })();\n\n    // --- FAQ Accordion Logic ---\n    (function(){\n      document.querySelectorAll('.faq-toggle').forEach(btn => {\n        btn.addEventListener('click', function() {\n          const item = this.closest('.faq-item');\n          const answer = item.querySelector('.faq-answer');\n          const isOpen = item.classList.contains('faq-open');\n\n          // Close all other FAQ items\n          document.querySelectorAll('.faq-item.faq-open').forEach(openItem => {\n            if (openItem !== item) {\n              openItem.classList.remove('faq-open');\n              const openAnswer = openItem.querySelector('.faq-answer');\n              openAnswer.style.maxHeight = '0';\n              openItem.querySelector('.faq-toggle').setAttribute('aria-expanded', 'false');\n            }\n          });\n\n          // Toggle current item\n          if (isOpen) {\n            item.classList.remove('faq-open');\n            answer.style.maxHeight = '0';\n            this.setAttribute('aria-expanded', 'false');\n          } else {\n            item.classList.add('faq-open');\n            answer.style.maxHeight = answer.scrollHeight + 'px';\n            this.setAttribute('aria-expanded', 'true');\n          }\n        });\n      });\n    })();\n\n    // --- Legal Modal Logic (Impresszum + Privacy) ---\n    (function(){\n      const modal = document.getElementById('legal-modal');\n      const content = document.getElementById('legal-modal-content');\n      const closeBtn = document.getElementById('legal-close-btn');\n      const okBtn = document.getElementById('legal-ok-btn');\n      const tabs = document.querySelectorAll('.legal-tab');\n      const panels = document.querySelectorAll('[data-legal-panel]');\n\n      function openLegal(tab){\n        modal.classList.remove('opacity-0','pointer-events-none');\n        content.classList.remove('sm:scale-95','sm:translate-y-4');\n        document.body.style.overflow = 'hidden';\n        switchTab(tab || 'impressum');\n      }\n      function closeLegal(){\n        modal.classList.add('opacity-0','pointer-events-none');\n        content.classList.add('sm:scale-95','sm:translate-y-4');\n        document.body.style.overflow = '';\n      }\n      function switchTab(name){\n        tabs.forEach(t => {\n          const active = t.getAttribute('data-legal-tab') === name;\n          t.classList.toggle('border-dental-600', active);\n          t.classList.toggle('text-dental-700', active);\n          t.classList.toggle('border-transparent', !active);\n          t.classList.toggle('text-slate-500', !active);\n        });\n        panels.forEach(p => {\n          p.classList.toggle('hidden', p.getAttribute('data-legal-panel') !== name);\n        });\n        const sc = content.querySelector('.overflow-y-auto');\n        if (sc) sc.scrollTop = 0;\n      }\n\n      document.querySelectorAll('[data-legal-open]').forEach(btn => {\n        btn.addEventListener('click', () => {\n          closeMenu();\n          openLegal(btn.getAttribute('data-legal-open'));\n        });\n      });\n      tabs.forEach(t => t.addEventListener('click', () => switchTab(t.getAttribute('data-legal-tab'))));\n      closeBtn.addEventListener('click', closeLegal);\n      okBtn.addEventListener('click', closeLegal);\n      modal.addEventListener('click', (e) => { if (e.target === modal) closeLegal(); });\n      document.addEventListener('keydown', (e) => {\n        if (e.key === 'Escape' && !modal.classList.contains('pointer-events-none')) closeLegal();\n      });\n    })();\n\n    document.addEventListener('keydown',(e)=>{if(e.ctrlKey&&e.shiftKey&&e.key==='D'){const existing=document.getElementById('anna-debug');if(existing){existing.remove();return}const panel=document.createElement('div');panel.id='anna-debug';panel.style.cssText='position:fixed;bottom:20px;left:20px;z-index:99999;background:#1e293b;color:#e2e8f0;padding:16px;border-radius:12px;font-size:11px;font-family:monospace;max-width:460px;max-height:350px;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.4);';const urlAge=cachedSignedUrl?Math.round((Date.now()-signedUrlTimestamp)/1000)+'s ago':'none';panel.innerHTML='<div style=\"font-weight:bold;margin-bottom:8px;color:#60a5fa\">Anna Debug v8<\u002Fdiv><div>State: '+currentCallState+'<\u002Fdiv><div>Conversation: '+(!!conversation)+'<\u002Fdiv><div>Agent: '+AGENT_ID+'<\u002Fdiv><div>SDK Pre-loaded: '+(!!sdkModule)+'<\u002Fdiv><div>Pre-warmed: '+hasPreWarmed+'<\u002Fdiv><div>SignedURL: '+urlAge+'<\u002Fdiv><div>Watchdog: '+(!!watchdogTimer)+'<\u002Fdiv><div>Speaking since: '+(speakingSince?Math.round((Date.now()-speakingSince)/1000)+'s':'N/A')+'<\u002Fdiv><hr style=\"border-color:#334155;margin:8px 0\"><div style=\"font-weight:bold;margin-bottom:4px;color:#60a5fa\">Info:<\u002Fdiv><div>Consent: '+hasConsented+'<\u002Fdiv><div>UA: '+(navigator.userAgent||'').substring(0,60)+'<\u002Fdiv>';document.body.appendChild(panel)}});\n  \n\n    // ========================================\n    // SMART TIME VALIDATOR v1\n    // Okos idő-logika: Anna nem foglal múltbeli, túl közeli vagy túl késői időpontra\n    // ========================================\n    \n    const BUSINESS_OPEN = 8;\n    const BUSINESS_CLOSE = 18;\n    const MIN_ADVANCE_HOURS = 2;\n    const TREATMENT_DURATION = 60;\n\n    function validateAppointmentTime(idopont) {\n      const lang = currentLang || 'en';\n      const t = translations[lang] || translations['hu'];\n      \n      if (!idopont) {\n        return { valid: false, reason: 'missing', message: t['time-invalid'] || 'Invalid time' };\n      }\n\n      const now = new Date();\n      const appointment = new Date(idopont);\n      \n      if (isNaN(appointment.getTime())) {\n        return { valid: false, reason: 'invalid_date', message: t['time-invalid'] };\n      }\n\n      // 1. Múltbeli időpont?\n      if (appointment <= now) {\n        return { valid: false, reason: 'past_time', message: t['time-past'] };\n      }\n\n      // 2. Túl közeli (minimum 2 óra előre)?\n      const minAdvance = new Date(now.getTime() + MIN_ADVANCE_HOURS * 60 * 60 * 1000);\n      if (appointment <= minAdvance) {\n        return { valid: false, reason: 'too_close', message: t['time-too-close'] };\n      }\n\n      // 3. Hétvége?\n      const day = appointment.getDay();\n      if (day === 0 || day === 6) {\n        return { valid: false, reason: 'closed', message: t['time-closed'] };\n      }\n\n      // 4. Nyitvatartáson kívül?\n      const hour = appointment.getHours();\n      if (hour < BUSINESS_OPEN || hour >= BUSINESS_CLOSE) {\n        return { valid: false, reason: 'closed', message: t['time-closed'] };\n      }\n\n      // 5. Kezelés belefér a nyitvatartásba?\n      const treatmentEnd = new Date(appointment.getTime() + TREATMENT_DURATION * 60 * 1000);\n      if (treatmentEnd.getHours() > BUSINESS_CLOSE || \n          (treatmentEnd.getHours() === BUSINESS_CLOSE && treatmentEnd.getMinutes() > 0)) {\n        return { valid: false, reason: 'too_close_to_closing', message: t['time-too-late'] };\n      }\n\n      return { valid: true, reason: null, message: null };\n    }\n\n    function getNextAvailableSlots(count) {\n      count = count || 5;\n      const now = new Date();\n      const minAdvance = new Date(now.getTime() + MIN_ADVANCE_HOURS * 60 * 60 * 1000);\n      const slots = [];\n      \n      let checkDate = new Date(minAdvance);\n      if (checkDate.getMinutes() > 0) {\n        checkDate.setHours(checkDate.getHours() + 1, 0, 0, 0);\n      }\n\n      let attempts = 0;\n      while (slots.length < count && attempts < 100) {\n        attempts++;\n        const day = checkDate.getDay();\n        const hour = checkDate.getHours();\n\n        if (day >= 1 && day <= 5 && hour >= BUSINESS_OPEN && hour < BUSINESS_CLOSE - 1) {\n          const treatmentEnd = new Date(checkDate.getTime() + TREATMENT_DURATION * 60 * 1000);\n          if (treatmentEnd.getHours() <= BUSINESS_CLOSE) {\n            slots.push(checkDate.toLocaleDateString('hu-HU', {\n              weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'\n            }));\n          }\n        }\n\n        checkDate = new Date(checkDate.getTime() + 60 * 60 * 1000);\n        if (checkDate.getHours() >= BUSINESS_CLOSE - 1) {\n          checkDate.setDate(checkDate.getDate() + 1);\n          checkDate.setHours(BUSINESS_OPEN, 0, 0, 0);\n        }\n        if (checkDate.getDay() === 0) checkDate.setDate(checkDate.getDate() + 1);\n        if (checkDate.getDay() === 6) checkDate.setDate(checkDate.getDate() + 2);\n      }\n\n      return slots;\n    }\n\n    function handleTimeValidation(data) {\n      const lang = currentLang || 'en';\n      const t = translations[lang] || translations['hu'];\n\n      if (data.status === 'time_invalid' || data.reason === 'past_time' || \n          data.reason === 'too_close' || data.reason === 'too_close_to_closing') {\n        \n        let message = '';\n        switch (data.reason) {\n          case 'past_time': message = t['time-past']; break;\n          case 'too_close': message = t['time-too-close']; break;\n          case 'too_close_to_closing': message = t['time-too-late']; break;\n          default: message = data['message_' + lang] || data.message_hu || t['time-invalid'];\n        }\n\n        const suggestions = getNextAvailableSlots(3);\n        if (suggestions.length > 0) {\n          message += '\\n\\n' + (t['time-suggest-prefix'] || 'Available:') + '\\n' + suggestions.join('\\n');\n        }\n\n        if (typeof showToast === 'function') {\n          showToast(message, 'warn');\n        } else {\n          alert(message);\n        }\n        return false;\n      }\n\n      if (data.status === 'closed') {\n        if (typeof showToast === 'function') showToast(t['time-closed'], 'warn');\n        else alert(t['time-closed']);\n        return false;\n      }\n\n      return true;\n    }\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
