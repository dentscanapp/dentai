Időt takarít meg',\n        'social-benefit1-text': 'Nem kell tartalmat írni, képet keresni vagy posztolni — Anna mindent elvégez Ön helyett',\n        'social-benefit2-title': 'Következetes jelenlét',\n        'social-benefit2-text': 'Naponta friss tartalom biztosítja, hogy a praxis soha ne tűnjön inaktívnak',\n        'social-benefit3-title': 'Növekvő elérés',\n        'social-benefit3-text': 'A rendszeres posztok növelik az organikus láthatóságot és új pácienseket vonzanak',\n        'social-benefit4-title': 'Szakmai hitelesség',\n        'social-benefit4-text': 'Minőségi, informatív posztok erősítik a rendelő szakmai megítélését és bizalmat építenek',\n        'social-follow-fb': 'Kövesse Facebookon',\n        'social-follow-li': 'Kövesse LinkedInen',\n        'footer-contact': 'Kapcsolat',\n        'faq-title': 'Minden, amit tudni szeretne',\n        'faq-desc': 'A leggyakoribb kérdések és válaszok Annáról — ha nem találja amit keres, vegye fel velem a kapcsolatot!',\n        'faq1-q': 'Működik a meglévő telefonszámomon?',\n        'faq1-a': 'Igen! Anna a meglévő telefonszámára érkező hívásokat veszi fel — nincs szükség új számra, szolgáltatóváltásra vagy extra eszközre. A rendszer zökkenőmentesen integrálható a jelenlegi telefonvonalával, így a páciensek ugyanazon a számon hívhatják Önt, amit eddig is ismertek. A beállítás mindössze néhány percet vesz igénybe.',\n        'faq2-q': 'Mi van, ha az AI nem tud válaszolni?',\n        'faq2-a': 'Ha Anna olyan kérdést kap, amelyre nincs felkészítve (pl. egyedi orvosi kérdés, panaszkezelés, komplex árajánlat), automatikusan értesíti a rendelő recepcióját a visszahívásról — feljegyzi a páciens adatait és a kérés részleteit, hogy a recepciós a lehető leghamarabb visszakeresi a pácienst. Ha a rendelő zárva van, Anna jegyzetet készít a kérésről, és a következő munkanapon a recepciós felkeresi a pácienst. A páciens sosem marad válasz nélkül.',\n        'faq3-q': 'Hogyan érhető el a rendszer?',\n        'faq3-a': 'Anna jelenleg portfólió-demóként érhető el — természetes személyként, Petor Péter által fejlesztve; kereskedelmi forgalomban még nem érhető el. Az oldal és a beszélgetés-demo bárki számára kipróbálható, így rendelőként, fejlesztőként vagy üzleti érdeklődőként is áttekintést kaphat a működésről. Ha élesítésre vagy egyedi együttműködésre gondolna (pilot program, integráció), kérem, vegye fel velem a kapcsolatot a info@dentai.me címen.',\n        'faq4-q': 'Milyen nyelveken beszél?',\n        'faq4-a': 'Jelenleg tizenegy nyelven kommunikál folyékonyan: magyarul, angolul, németül, hollandul, franciául, olaszul, dánul, norvégul, svédül, finnül és szlovákul. A nyelvválasztás automatikus — Anna felismeri a páciens nyelvét, és azon válaszol. Ez különösen értékes a turisztikailag frekventált régiókban, ahol külföldi páciensek is gyakran hívják a rendelőt.',\n        'faq5-q': 'Hogyan kezeli a sürgős eseteket?',\n        'faq5-a': 'Sürgős helyzetben — például erős fogfájás, trauma vagy vérzés esetén — Anna azonnal prioritást ad a hívásnak. Felismeri a sürgősségi kulcsszavakat, és a lehető leggyorsabban aznapi időpontot keres a páciensnek. Valódi vészhelyzet esetén (pl. állcsonttörés, kontrollálhatatlan vérzés) a legközelebbi sürgősségi ellátásra irányítja a pácienst. A sürgős hívások sosem kerülnek véletlenül rutinfoglalásnak.',\n        'faq6-q': 'Hogyan kezeli az adatvédelmet (GDPR)?',\n        'faq6-a': 'Anna a GDPR követelményeit szem előtt tartva készült, de fontos átláthatóan tájékoztatni a használt szolgáltatókról. A weboldal és az API-forgalom a Cloudflare CDN-en keresztül megy, a hangfeldolgozást pedig az ElevenLabs biztosítja — mindkettő USA-beli szolgáltató, amelyek Standard Szerződési Klauzulákkal (SCC) és adatfeldolgozási megállapodással (DPA) működnek, ennek ellenére az adatok EGT-n kívüli harmadik országba (USA) is továbbításra kerülhetnek. Élesítés előtt minden rendelőnek saját DPA-t kell kötnie a szolgáltatókkal, az adatkezelési tájékoztatójában fel kell tüntetnie az adattovábbítás tényét és jogalapját, valamint javasolt adatvédelmi hatásvizsgálat (DPIA) készítése. Egészségügyi panaszok részletezéséhez (különleges adat, GDPR 9. cikk (2) a) pont) külön kifejezett hozzájárulás szükséges. Éles bevezetés előtt minden esetben javasolt adatvédelmi szakértővel/jogásszal egyeztetni.',\n        'faq7-q': 'Hogyan kerül Anna egy telefonszámra?',\n        'faq7-a': 'Két fő megközelítés használható. Új szám kiosztása: Twilio-tól vagy más VoIP-szolgáltatótól (pl. magyar SIP-trunk: Hipernet, Voipgate) vásárolható egy telefonszám, amely közvetlenül az ElevenLabs Conversational AI Agentre van irányítva — Twilio integrációval ez néhány óra alatt beüzemelhető. Meglévő szám átirányítása: a rendelő mostani számán beállítható időszakos átirányítás (pl. csak munkaidőn kívül vagy foglalt vonal esetén), így Anna csak akkor fogadja a hívást, amikor a recepció nem elérhető. A pontos beállítás minden rendelő infrastruktúrájához egyedileg igazítható.',\n        'faq8-q': 'Hogyan történik a beleegyezés a telefonhívásnál?',\n        'faq8-a': 'A hívás fogadásakor Anna első mondatában tájékoztatja a hívót: AI-asszisztens beszél, a hívás minőségbiztosítás céljából rögzíthető, és bármikor kérheti egy élő munkatárs visszahívását (kérésre Anna visszahívást szervez). Ha a páciens folytatja a beszélgetést, az ráutaló magatartással történő hozzájárulásnak minősül (GDPR 6. cikk (1) a) és b) pontok). Egészségügyi panaszok részletezésénél (pl. fájdalom, gyógyszer) további kifejezett megerősítés szükséges. A hozzájárulás tényét és időpontját a rendszer naplózza.',\n        'faq10-q': 'Mennyibe kerülnek az éves fenntartási költségek?',\n        'faq10-a': '<p>Ezeket a rendelő közvetlenül a szolgáltatóknak fizeti. Az összegek a forgalom (hívások száma és hossza) függvényében változhatnak. Anna emellett napi szinten tartalmat generál a Facebook- és LinkedIn-oldalakra.<\u002Fp><ul class=\"space-y-1.5 list-disc pl-5\"><li><strong class=\"text-slate-700\">Domain név:<\u002Fstrong> 3.000 – 8.000 Ft / év<\u002Fli><li><strong class=\"text-slate-700\">Make.com (Agy):<\u002Fstrong> ~44.000 Ft / év<\u002Fli><li><strong class=\"text-slate-700\">ElevenLabs (Hang):<\u002Fstrong> 50.000 – 100.000 Ft / év<\u002Fli><li><strong class=\"text-slate-700\">Twilio (SMS):<\u002Fstrong> 20.000 – 60.000 Ft / év<\u002Fli><li><strong class=\"text-slate-700\">Cloudflare (Kód):<\u002Fstrong> 0 Ft<\u002Fli><li><strong class=\"text-slate-700\">Webtárhely:<\u002Fstrong> 0 – 15.000 Ft / év<\u002Fli><li><strong class=\"text-slate-700\">Claude AI (Szöveg generálás):<\u002Fstrong> ~2.000 Ft / év<\u002Fli><li><strong class=\"text-slate-700\">Pollinations AI (Kép generálás):<\u002Fstrong> 0 Ft (ingyenes)<\u002Fli><\u002Ful><div class=\"bg-slate-50 rounded-xl px-4 py-2.5 border border-slate-200/60 -ml-1\"><p class=\"text-sm font-semibold text-slate-800\">Összesen: <span class=\"text-dental-700\">~119.000 – 229.000 Ft / év<\u002Fspan><\u002Fp><\u002Fdiv><p class=\"text-xs text-slate-400 italic\">Fontos tudnivalók a rendelő számára: A hosszabb beszélgetés több felhasznált karaktert, a több hívás és SMS pedig magasabb költséget jelent. Ezek becsült értékek.<\u002Fp>',\n\n        'demo-sub': 'Élő demo',\n        'demo-title': 'Próbálja ki Annát!',\n        'demo-desc': 'Beszéljen vele telefonon, vagy nézze meg a szabad időpontokat valós időben — és tapasztalja meg, milyen, ha semmi sem csúszik ki a kezek közül.',\n        'demo-what': 'Mit kérdezzen Annától',\n        'demo-what-sub': 'Csak beszéljen természetesen — Anna ért!',\n        'prompt1-title': 'Időpontfoglalás',\n        'prompt1-text': '„Szeretnék egy tisztítást jövő kedden 14 órára\"',\n        'prompt2-title': 'Időpont módosítása',\n        'prompt2-text': '„A holnapi időpontomat szeretném áttenni csütörtökre\"',\n        'prompt3-title': 'Sürgős fogfájás',\n        'prompt3-text': '„Fáj a fogam és egyre rosszabb lesz — tudnak mára fogadni?\"',\n        'prompt4-title': 'Szakmai tájékoztatás',\n        'prompt4-text': 'Anna válaszol a kezelésekkel és a rendelő működésével kapcsolatos kérdésekre, így a páciens minden információt megkap a döntéshez.',\n        'demo-available': 'Anna elérhető',\n        'demo-response': 'Válasz <2 mp',\n        'demo-voice': 'Hangalapú beszélgetés Annával',\n        'cal-title': 'Anna élő naptára',\n        'cal-sub': 'Szabad időpontok valós időben',\n        'cal-sync': 'Szinkron:',\n        'cal-auto': 'Automatikus frissítés 30 másodpercenként',\n        'cal-refresh': 'Frissítés most',\n        'cal-loading': 'Anna naptárának betöltése...',\n        'cal-err-title': 'A naptár jelenleg nem elérhető',\n        'cal-err-desc': 'Kérjük, próbálja újra később, vagy hívja Annát közvetlenül.',\n        'cal-err-retry': 'Újrapróbálkozás',\n        'footer-desc': 'Anna — a DentAi Senior Asszisztense. 0–24 híváskezelés, online foglalás és automatikus visszaigazolás, hogy a praxisa mindig nyugodtan működjön.',\n        'footer-langs': 'Nyelvek',\n        'footer-info-title': 'Információk',\n        'footer-portfolio': 'Portfólió demo Készítette: Petor Péter',\n        'footer-impressum': 'Impresszum',\n        'footer-privacy': 'Adatkezelési Tájékoztató',\n        'footer-gdpr': 'Jogi nyilatkozat: Ez egy portfolió demo. Kérem, ne adjon meg valós adatokat! Az AI válaszaiért felelősséget nem vállalok.',\n        'footer-copy': '© 2026 DentAi asszisztens. Minden jog fenntartva. Anna AI által működtetve.',\n        'time-past': 'A kért időpont már elmúlt. Kérem válasszon egy jövőbeli időpontot.',\n        'time-too-close': 'Túl közeli időpont — minimum 2 órával előre lehet foglalni.',\n        'time-too-late': 'A kért időpont túl késői — a kezelés nem fér bele a nyitvatartásba (08:00–18:00).',\n        'time-closed': 'A rendelő ilyenkor zárva van. Nyitvatartás: H–P 08:00–18:00.',\n        'time-invalid': 'Érvénytelen időpont. Kérem válasszon másikat.',\n        'time-suggest-prefix': 'Elérhető időpontok:',\n        'time-booking-sent': 'Foglalás elküldve — visszaigazolás hamarosan!',\n        'legal-title': 'Jogi információk',\n        'legal-tab-impressum': 'Impresszum',\n        'legal-tab-privacy': 'Adatkezelési Tájékoztató',\n        'legal-close': 'Bezárás',\n        'imp-intro': 'Jelen weboldal egy portfolió bemutató, melyet az alábbi természetes személy üzemeltet. A weboldal nem nyújt valós egészségügyi szolgáltatást.',\n        'imp-name-label': 'Üzemeltető neve:',\n        'imp-name-value': 'Petor Péter (természetes személy)',\n        'imp-email-label': 'E-mail cím:',\n        'imp-purpose-label': 'Oldal célja:',\n        'imp-purpose-value': 'Portfolió / technológiai demó (nem kereskedelmi szolgáltatás)',\n        'imp-host-label': 'Tárhelyszolgáltató:',\n        'imp-host-value': 'Cloudflare, Inc. (101 Townsend St, San Francisco, CA 94107, USA)',\n        'imp-legal-basis': 'Jogszabályi alap: 2001. évi CVIII. törvény (Ektv.) az elektronikus kereskedelmi szolgáltatásokról. A „DentAi asszisztens\" elnevezés kizárólag fiktív, demonstrációs célt szolgál, valós egészségügyi intézmény nem létezik ezen a néven.',\n        'priv-intro': 'Jelen tájékoztató a weboldal látogatása során történő adatkezelésről nyújt információt a GDPR (EU 2016/679 rendelet) és a 2011. évi CXII. törvény (Infotv.) alapján.',\n        'priv-h1': '1. Adatkezelő',\n        'priv-p1': 'Petor Péter természetes személy, kapcsolat: info@dentai.me. Az oldal portfolió demó, valós egészségügyi adatkezelés nem történik.',\n        'priv-h2': '2. Kezelt adatok és célok',\n        'priv-li2-1': '<strong>Technikai adatok:<\u002Fstrong> IP-cím, böngésző és eszköz típusa, látogatás ideje — kizárólag a weboldal technikai üzemeltetése és biztonsági okokból (Cloudflare).',\n        'priv-li2-2': '<strong>Hangadatok (csak ha indítja a hívást):<\u002Fstrong> Az Ön mikrofonjából érkező hang ideiglenesen feldolgozásra kerül a beszélgetés generálása érdekében (ElevenLabs). Kérjük, ne osszon meg valós személyes adatot!',\n        'priv-li2-3': '<strong>LocalStorage:<\u002Fstrong> Az Ön böngészőjében tárolódik egy jelölés arról, hogy elfogadta a jogi nyilatkozatot — ezt nem továbbítjuk szervernek.',\n        'priv-h3': '3. Harmadik fél szolgáltatók (külföldi adattovábbítás)',\n        'priv-p3': 'Az oldal az alábbi külső szolgáltatók erőforrásait tölti be. Ezáltal az Ön IP-címe és böngésző-adatai továbbításra kerülhetnek EGT-n kívüli harmadik országokba (jellemzően USA), ahol az érintett szolgáltatók saját adatvédelmi szabályzata vonatkozik az adatkezelésre:',\n        'priv-li3-1': '<strong>Cloudflare<\u002Fstrong> (CDN, tárhely) — <a href=\"https://www.cloudflare.com/privacypolicy/\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">privacypolicy<\u002Fa>',\n        'priv-li3-2': '<strong>Google Fonts<\u002Fstrong> (betűtípusok) — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-li3-3': '<strong>Tailwind CDN<\u002Fstrong> (CSS keretrendszer)',\n        'priv-li3-4': '<strong>ElevenLabs<\u002Fstrong> (hangalapú AI) — <a href=\"https://elevenlabs.io/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">elevenlabs.io/privacy<\u002Fa>',\n        'priv-li3-5': '<strong>Google Naptár<\u002Fstrong> — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-h4': '4. Adatkezelés jogalapja és időtartama',\n        'priv-p4': 'A technikai adatok kezelésének jogalapja a GDPR 6. cikk (1) f) pontja (jogos érdek — a weboldal technikai üzemeltetése). A hangalapú interakció jogalapja a hozzájárulás (GDPR 6. cikk (1) a)), melyet a hívás indítása előtti felugró ablakban ad meg. Valós idejű hangfeldolgozás történik, a hangadatokat nem tároljuk hosszú távon.',\n        'priv-h5': '5. Az Ön jogai',\n        'priv-p5': 'Ön jogosult tájékoztatást kérni, helyesbítést, törlést és tiltakozást kezdeményezni adatai kezelésével kapcsolatban. Kérelmét a info@dentai.me e-mail címre küldheti. Panaszt a Nemzeti Adatvédelmi és Információszabadság Hatóságnál (NAIH, www.naih.hu) tehet.',\n        'priv-h6': '6. Felelősségkizárás',\n        'priv-p6': 'Ez egy portfolió demó. Az AI által generált válaszok nem minősülnek egészségügyi tanácsnak. Az üzemeltető semmilyen felelősséget nem vállal a felhasználó által megadott adatokért, illetve a mesterséges intelligencia válaszaiból eredő esetleges károkért.',\n        'priv-updated': 'Hatályos: 2026. április 26.',\n        'modal-title': 'Beleegyező nyilatkozat',\n        'modal-text': 'A hívást mesterséges intelligencia (AI) kezeli. A beszélgetés során hangadatok feldolgozásra kerülnek. A hívás indításával elfogadja, hogy az AI válaszokat generál, és a beszélgetés nem minősül orvosi tanácsadásnak.',\n        'modal-checkbox': 'Megértettem és elfogadom a fenti tájékoztatást.',\n        'modal-cancel': 'Mégse',\n        'modal-accept': 'Elfogadom',\n\n        'cap-sub': 'Anna képességei',\n        'cap-title': 'Mindent tud, amit egy recepciósnak tudnia kell',\n        'cap-desc': 'A foglalástól a lemondáson át a várólistáig — Anna önállóan, valós időben kezeli a teljes pácienskommunikációt telefonon. Minden funkció az összes támogatott nyelven elérhető.',\n        'cap1-title': 'Szabad időpontok',\n        'cap1-desc': 'Anna valós időben keresi a szabad helyeket a Google Naptárban — megadott napra, napszakra vagy orvosra szűrve. A páciens azonnal választ kaphat.',\n        'cap1-tag2': 'Valós idejű',\n        'cap2-title': 'Időpontfoglalás',\n        'cap2-desc': 'A páciens nevének, e-mail-címének és a kívánt időpont megadásával Anna rögzíti a foglalást a naptárban, és azonnal küld egy visszaigazoló SMS-t és e-mailt.',\n        'cap2-tag1': 'Visszaigazolás',\n        'cap3-title': 'Időpontmódosítás',\n        'cap3-desc': 'Ha a páciens másik időpontot kér, Anna törli a régit és lefoglalja az újat — ellenőrzi a naptárban az új időpont elérhetőségét is, hogy ne ütközzön semmivel.',\n        'cap3-tag1': 'Régi → Új',\n        'cap3-tag2': 'Ellenőrzött',\n        'cap4-title': 'Időpontlemondás',\n        'cap4-desc': 'A páciens megerősítheti a lemondást — Anna eltávolítja az eseményt a naptárból, és lemondást visszaigazoló SMS-t és e-mailt küld a megfelelő nyelven.',\n        'cap4-tag1': 'Értesítés',\n        'cap4-tag2': 'Naptárfrissítés',\n        'cap5-title': 'Időpontok lekérdezése',\n        'cap5-desc': 'Ha a páciens nem emlékszik a foglalására, Anna telefon vagy e-mail alapján lekéri a jövőbeli időpontokat, és felolvassa őket a módosítás vagy lemondás megkönnyítéséhez.',\n        'cap5-tag1': 'Keresés',\n        'cap5-tag2': 'Páciensazonosítás',\n        'cap6-title': 'Várólista',\n        'cap6-desc': 'Ha nincs szabad időpont, Anna felírja a pácienst az elsőbbségi várólistára — a preferált időszakkal együtt. Amikor felszabadul egy hely, a rendszer automatikusan értesíti őt.',\n        'cap6-tag1': 'Elsőbbségi',\n        'cap6-tag2': 'Automatikus értesítés',\n        'cap7-title': 'Adatmódosítás',\n        'cap7-desc': 'Ha a páciens új telefonszámot vagy e-mail-címet kapott, Anna frissíti az adatokat a rendszerben — a jelenlegi e-mail-alapú azonosító alapján, azonnali érvénnyel.',\n        'cap7-tag1': 'Telefon / e-mail',\n        'cap7-tag2': 'Azonnali',\n        'cap8-title': 'Hívásátadás',\n        'cap8-desc': 'Ha a páciens munkatárssal szeretne beszélni, technikai hiba történik, vagy Anna nem tud válaszolni, automatikusan értesíti a recepciót a visszahívásról — a páciens sosem marad válasz nélkül.',\n        'cap8-tag1': 'Visszahívás',\n        'cap8-tag2': 'Biztonsági háló',\n        'cap-stat1-label': 'Beépített eszköz a pácienskommunikációhoz',\n        'cap-stat2-label': 'Nyelven folyékonyan kommunikál',\n        'cap-stat3-label': 'Éjjel-nappal, ünnepnapokon is elérhető',\n        'cap-stat3-value': '24/7',\n        'lang-title': 'Tizenegy nyelven, egy hangon',\n        'lang-subtitle': 'Automatikus nyelvfelismerés — minden funkció elérhető minden nyelven',\n        'lang-auto': 'Automatikus felismerés',\n        'lang-desc': 'Anna automatikusan felismeri a páciens nyelvét a hívás elején, és azon a nyelven folytatja a beszélgetést. Az SMS-ek, e-mailek és naptárbejegyzések is a páciens anyanyelvén készülnek — így a külföldi páciensek is otthon érzik magukat a praxisban, és sosem maradnak kommunikációs hátrányban.',\n        'lang-feat1-title': 'Beszélt kommunikáció',\n        'lang-feat1-desc': 'Élő hangon, természetes beszéddel',\n        'lang-feat2-title': 'Nyelvspecifikus SMS',\n        'lang-feat2-desc': 'Visszaigazolás a páciens nyelvén',\n        'lang-feat3-title': 'Többnyelvű e-mail',\n        'lang-feat3-desc': 'Naptárleírás 11 nyelven, automatikusan generált',\n        'roi-email-btn': 'Megosztom email-ben',\n        'roi-email-prompt': 'Küldje el magának az eredményt!',\n        'roi-email-send': 'Küldés',\n        'roi-email-success': 'Elküldve! Ellenőrizze a postafiókját.'\n      ,\n        'roi-email-error': 'Hiba történt a küldés során. Próbálja újra!'\n      ,\n        'roi-email-subject': 'Az Ön ROI kalkulátor eredménye'\n      ,\n        'roi-email-greeting': 'Tisztelt'\n      ,\n        'roi-email-closing': 'Üdvözlettel, A DentAi csapata'\n      ,\n        'roi-name-placeholder': 'Név'\n      ,\n        'roi-email-placeholder': 'email@pelda.hu'\n      ,\n        'roi-sub': 'Mennyit hoz Anna?',\n        'roi-title': 'ROI kalkulátor — 30 másodperc alatt',\n        'roi-desc': 'Állítsa be a praxisa napi hívásszámát — kiszámoljuk, mennyi bevétel csúszik el az elszalasztott hívásokkal, és mennyit hoz vissza Anna.',\n        'roi-inputs-title': 'Az ön praxisa',\n        'roi-inputs-desc': 'Húzza a csúszkákat — az eredmény azonnal frissül.',\n        'roi-calls-label': 'Hány hívást fogad naponta?',\n        'roi-calls-unit': 'hívás/nap',\n        'roi-missed-label': 'Elszalasztott hívások aránya',\n        'roi-missed-hint': 'Hétvége, ebédidő, párhuzamos hívások, nyelvi akadályok.',\n        'roi-value-label': 'Átlagos kezelés értéke',\n        'roi-result-label': 'Becsült megtérülés',\n        'roi-monthly-label': 'Havi visszanyert bevétel',\n        'roi-yearly-label': 'Évente',\n        'roi-bookings-label': 'Plusz foglalás/hó',\n        'roi-monthly-sub': '',\n        'roi-cta': 'Demót kérek →',\n        'roi-disclaimer': 'Becslés. Tényleges eredmény a praxis profiljától és kezelési arányaitól függ.',\n        'roi-value-currency': 'Ft'},\n      en: {\n        'page-title': 'Anna — DentAi Senior Assistant | 24/7 Call Handling & Booking',\n        'brand-suffix': '-AI',\n        'senior-badge': 'Senior AI Assistant',\n        'hero-h1-1': 'Never miss',\n        'hero-h1-2': 'another call.',\n        'hero-desc': 'Meet <strong class=\"text-slate-800\">Anna<\u002Fstrong> — the DentAi Senior Assistant, who handles calls <strong class=\"text-slate-800\">24/7<\u002Fstrong>, books appointments, and sends instant confirmations — so your reception can focus on patients.',\n        'hero-call': 'Talk to Anna',\n        'hero-hangup': 'End Call',\n        'hero-calendar': 'View Calendar',\n        'feat-1': '24/7 call handling',\n        'feat-2': 'Automatic confirmation',\n        'feat-3': '11 languages',\n        'status-ready': 'Anna is ready — call her!',\n        'status-connecting': 'Connecting to Anna...',\n        'status-listening': 'Anna is listening — tell her how she can help',\n        'status-speaking': 'Anna is responding',\n        'error-server': 'Failed to start the call. The server is unavailable.',\n        'error-mic': 'Microphone permission is required to start a call. Please enable microphone access in your browser settings and try again.',\n        'error-no-url': 'Failed to connect to Anna (signed URL missing). Please try again later!',\n\n        'header-available': 'Anna available',\n        'header-connecting': 'Connecting...',\n        'header-listening': 'Anna is listening...',\n        'header-speaking': 'Anna is speaking...',\n        'mobile-available': 'Anna available',\n        'menu-label': 'Menu',\n        'menu-close': 'Close',\n        'float-1': 'Incoming call',\n        'float-2': 'Appointment booked',\n        'float-3': 'Confirmation sent',\n        'phone-anna-name': 'Anna',\n        'phone-anna-role': 'Senior Assistant · Online',\n        'chat-1': 'Good evening! I\\'d like to schedule a teeth cleaning for tomorrow morning.',\n        'chat-2': 'Good evening! Let me check our availability. We have openings tomorrow at 9:00 AM and 11:30 AM. Which one works better for you?',\n        'chat-3': '9:00 AM would be perfect!',\n        'chat-4': 'All set! You\\'re booked for tomorrow at 9:00 AM. I\\'ll send you a confirmation via SMS and email.',\n        'chat-input': 'Write a message to Anna...',\n        'how-title-sub': 'How it works',\n        'how-title': 'A smoothly running practice in four steps',\n        'how-desc': 'Full automation from the call to the visit. The patient simply books — Anna handles everything behind the scenes.',\n        'step1-title': 'Incoming request',\n        'step1-desc': 'The patient calls or books online — Anna picks up immediately, day and night. No waiting, no busy signals.',\n        'step1-tag1': 'Phone',\n        'step1-tag2': 'Web booking',\n        'step2-title': 'Intelligent assessment',\n        'step2-desc': 'Anna analyzes the patient\\'s request — urgent toothache, routine cleaning, or consultation — and routes them to the right specialist immediately.',\n        'step2-tag1': 'Triage',\n        'step2-tag2': 'Multilingual',\n        'step3-title': 'Calendar sync',\n        'step3-desc': 'Anna sees available slots in real time and books the appointment instantly — or reschedules if the patient requests a different time.',\n        'step3-tag1': 'Real-time',\n        'step3-tag2': 'Book/Reschedule',\n        'step4-title': 'Treatment Information',\n        'step4-desc': 'Anna answers questions about treatments and practice procedures, providing patients with all the information they need.',\n        'step4-tag1': 'Email',\n        'step4-tag2': 'SMS',\n        'step4-tag3': 'Calendar',\n        'care-sub': 'Automated Follow-up',\n        'care-title': 'Before and after the appointment',\n        'care-desc': 'Anna doesn\\'t just book — she cares. On the morning before the treatment she reminds, on the day after she follows up. The patient never feels forgotten, and the practice receives real feedback on quality.',\n        'care1-title': 'Pre-Appointment Reminder SMS',\n        'care1-subtitle': 'Automatic — Without human intervention',\n        'care1-desc': 'On the morning before the treatment, Anna automatically sends an SMS to the patient about their next-day appointment to prevent forgetting. This process drastically reduces no-shows and fully frees the reception from manual reminder work.',\n        'care1-tag1': 'Twilio SMS',\n        'care1-tag2': 'Google Calendar',\n        'care1-tag3': 'Scheduled',\n        'care1-step1-title': 'Timing: every morning',\n        'care1-step1-desc': 'The system sends out reminder SMS messages every morning for the next-day appointments',\n        'care1-step2-title': 'Calendar lookup',\n        'care1-step2-desc': 'Anna retrieves the event from Google Calendar and verifies the details',\n        'care1-step3-title': 'SMS delivery (Twilio)',\n        'care1-step3-desc': 'Personalized reminder SMS — includes name, time, and location',\n        'care1-sms-header': 'Reminder · next-day appointment',\n        'care1-sms-body': 'Reminder: your dental appointment tomorrow',\n        'care1-sms-arrival': 'Please arrive 10 minutes early.',\n        'care1-sms-date': '📅 April 29, 2026 · 10:00',\n        'care1-sms-footer': '— DentAi Assistant',\n        'care1-sms-preview': 'Dear John Smith, 👋',\n        'care2-title': 'Post-Visit Follow-up / Survey',\n        'care2-subtitle': 'Automatic — Without human intervention',\n        'care2-desc': 'On the day after the treatment, Anna sends a short survey email where the patient can rate the service. Feedback is automatically logged, so the practice can continuously improve quality without manual data entry.',\n        'care2-tag1': 'Gmail',\n        'care2-tag2': 'Statistics',\n        'care2-tag3': 'Scheduled',\n        'care2-step1-title': 'Timing: day after treatment',\n        'care2-step1-desc': 'On the day after the treatment, the system sends out feedback emails to the patients',\n        'care2-step2-title': 'Survey email (Gmail)',\n        'care2-step2-desc': 'Personalized email with survey link — satisfaction, experience, suggestions',\n        'care2-step3-title': 'Statistics logging',\n        'care2-step3-desc': 'Responses are automatically added to the Google Sheets statistics tab',\n        'care2-email-from': 'DentAi Assistant',\n        'care2-email-to': '→ john.smith@email.com',\n        'care2-email-subject': 'Feedback on your visit – DentAi',\n        'care2-email-body': 'Dear John Smith, We trust your visit went smoothly. Your opinion matters to us: please share your experience in a brief survey so we can further improve our care.',\n        'care2-email-cta': '→ Fill out the survey',\n        'care-stat1-value': '~40%',\n        'care-stat1-label': 'No-show reduction with reminders',\n        'care-stat2-value': '0',\n        'care-stat2-label': 'Manual work and fully automated process',\n        'care-stat3-value': '24h',\n        'care-stat3-label': 'Post-treatment feedback',\n        'flow-1': 'Incoming call/Web',\n        'flow-2': 'Assessment',\n        'flow-3': 'Calendar sync',\n        'flow-4': 'Confirmation',\n        'flow-done': 'Done!',\n        'why-sub': 'Why Anna?',\n        'why-title': 'Free up your front desk — instantly',\n        'why-desc': 'Anna doesn\\'t replace your receptionist — she takes over repetitive tasks so your team can focus on what truly matters.',\n        'ben1-title': 'No more missed calls',\n        'ben1-desc': 'Anna answers calls around the clock — during lunch breaks, weekends, and holidays. Every patient can speak to someone who helps immediately.',\n        'ben2-title': 'Reduce reception workload',\n        'ben2-desc': 'Your front desk can focus on in-person patients and practice management, while Anna handles the routine calls in the background.',\n        'ben3-title': 'Eleven languages, one voice',\n        'ben3-desc': 'Communicates fluently in Hungarian, English, German, Dutch, French, Italian, Danish, Norwegian, Swedish, Finnish and Slovak — international patients feel at home in your practice.',\n        'clinic-sub': 'Clinic Information',\n        'clinic-title': 'Clinic Details',\n        'clinic-desc': 'Anna knows every important detail about the clinic — from opening hours to treatment durations.',\n        'clinic-details-title': 'Clinic Details',\n        'clinic-location-label': 'Location',\n        'clinic-location-value': 'Budapest, District V, City Center',\n        'clinic-hours-label': 'Opening Hours',\n        'clinic-hours-value': 'Monday–Friday 08:00–18:00',\n        'clinic-closed-label': 'Closed',\n        'clinic-closed-value': 'Saturday, Sunday and public holidays',\n        'clinic-doctors-label': 'Doctors',\n        'clinic-doctors-value': 'Dr. Kovács and Dr. Nagy',\n        'clinic-treatments-title': 'Treatments & Duration',\n        'clinic-treatments-note': '30-minute time slots',\n        'treat1-name': 'Examination / Consultation',\n        'treat1-dur': '30 min',\n        'treat2-name': 'Tartar Removal',\n        'treat2-dur': '30 min',\n        'treat4-name': 'Filling Replacement',\n        'treat4-dur': '45 min',\n        'treat5-name': 'Root Canal Treatment',\n        'treat5-dur': '90 min',\n        'treat6-name': 'Emergency Care',\n        'treat6-dur': '60 min',\n\n        'faq-sub': 'Frequently Asked Questions',\n        'social-sub': 'Social AutoPilot',\n        'social-title': 'Anna posts for you',\n        'social-desc': 'Fresh AI-generated content every day on Facebook and LinkedIn — both text and images, fully automated.',\n        'social-card1-title': 'Automated content creation',\n        'social-card1-text': 'Every day Anna writes a new professional post covering a wide range of dental topics — from teeth whitening to implants, pediatric dentistry to emergency care. The AI randomly selects a topic, then crafts a formal, well-structured post: headline, question, 3–5 practical tips and a call-to-action. No repetition, no generic tone — every post is unique and fresh.',\n        'social-card2-title': 'AI generates the images',\n        'social-card2-text': 'For each post, Anna generates a professional dental-themed image — clean, modern clinic environments, bright smiles, aesthetic treatment results. The images automatically match the post topic, keeping your Facebook and LinkedIn content visually appealing and consistent, without needing a photographer.',\n        'social-card2-tag2': 'Watermark-free',\n        'social-card3-title': 'Facebook and LinkedIn',\n        'social-card3-text': 'Anna posts to both platforms simultaneously: with photos on the Facebook page and visual content on the LinkedIn company profile. Posts appear instantly — no waiting for approval. The entire process runs through the Make.com automation engine, with Claude AI handling the writing and Pollinations generating the images.',\n        'social-benefit1-title': 'Saves time',\n        'social-benefit1-text': 'No need to write content, find images or post — Anna handles everything for you',\n        'social-benefit2-title': 'Consistent presence',\n        'social-benefit2-text': 'Daily fresh content ensures your practice never appears inactive',\n        'social-benefit3-title': 'Growing reach',\n        'social-benefit3-text': 'Regular posts increase organic visibility and attract new patients',\n        'social-benefit4-title': 'Professional credibility',\n        'social-benefit4-text': 'High-quality, informative posts strengthen your practice\\'s reputation and build trust',\n        'social-follow-fb': 'Follow on Facebook',\n        'social-follow-li': 'Follow on LinkedIn',\n        'footer-contact': 'Contact',\n        'faq-title': 'Everything you want to know',\n        'faq-desc': 'The most common questions and answers about Anna — if you can\\'t find what you\\'re looking for, feel free to contact me!',\n        'faq1-q': 'Does it work with my existing phone number?',\n        'faq1-a': 'Yes! Anna handles calls using your existing phone number — no need for a new number, carrier change, or extra equipment. The system integrates seamlessly with your current infrastructure, so patients can call the same number they already know. Setup takes just a few minutes.',\n        'faq2-q': 'What happens if the AI can\\'t answer?',\n        'faq2-a': 'If Anna receives a question she isn\\'t prepared for (e.g. specific medical questions, complaint handling, complex quotes), she automatically notifies the practice reception for a callback — she records the patient\\'s details and the request so the receptionist can get back to the patient as soon as possible. If the practice is closed, Anna takes a note of the request, and the receptionist will call the patient back on the next working day. The patient is never left without a response.',\n        'faq3-q': 'How is the system available?',\n        'faq3-a': 'Anna is currently available as a proof-of-concept — developed by Peter Petor as a private individual, not yet commercially available. The website and the conversation demo are open to anyone, so practices, developers, or business prospects can all get an overview of how it works. If you\\'re interested in production deployment or a custom collaboration (pilot program, integration), please contact me at info@dentai.me.',\n        'faq4-q': 'What languages does she speak?',\n        'faq4-a': 'She currently communicates fluently in eleven languages: Hungarian, English, German, Dutch, French, Italian, Danish, Norwegian, Swedish, Finnish and Slovak. Language selection is automatic — Anna recognizes the patient\\'s language and responds in it. This is especially valuable in tourist-frequented regions where international patients often call the practice.',\n        'faq5-q': 'How does she handle emergencies?',\n        'faq5-a': 'In urgent situations — such as severe toothache, trauma, or bleeding — Anna immediately prioritizes the call. She recognizes urgency keywords and finds the earliest same-day appointment possible. In true emergencies (e.g. jaw fracture, uncontrollable bleeding), she directs the patient to the nearest emergency care. Emergency calls are never accidentally routed as routine bookings.',\n        'faq6-q': 'How does it handle data protection (GDPR)?',\n        'faq6-a': 'Anna was built with GDPR requirements in mind, but it\\'s important to be transparent about the service providers used. Web traffic and API calls go through Cloudflare CDN, and voice processing is handled by ElevenLabs — both are US-based providers operating with EU Standard Contractual Clauses (SCC) and a Data Processing Agreement (DPA), but data may still be transferred to a third country (USA). Before going live, every practice must sign its own DPA with these providers, must disclose the data transfer and its legal basis in its privacy notice, and a Data Protection Impact Assessment (DPIA) is recommended. Detailed health complaints (special category data, GDPR Article 9) require separate explicit consent. Consultation with a data protection expert/lawyer is recommended before any production deployment.',\n        'faq7-q': 'How does Anna get onto a phone number?',\n        'faq7-a': 'There are two main approaches. New number assignment: a phone number can be purchased from Twilio or another VoIP provider (e.g. a Hungarian SIP trunk: Hipernet, Voipgate) and routed directly to the ElevenLabs Conversational AI Agent — with Twilio integration this can be set up in a few hours. Existing number forwarding: time-based forwarding can be configured on the practice\\'s current number (e.g. only outside business hours or when the line is busy), so Anna only manages the call when reception isn\\'t available. The exact setup is tailored to each practice\\'s infrastructure.',\n        'faq8-q': 'How does consent work on the phone call?',\n        'faq8-a': 'When the call is answered, Anna\\'s opening sentence informs the caller: an AI assistant is speaking, the call may be recorded for quality assurance purposes, and a callback from a live agent can be requested at any time (Anna arranges a callback upon request). If the patient continues the conversation, this counts as consent through unambiguous affirmative action (GDPR Article 6(1)(a) and (b)). Detailing health complaints (e.g. pain, medication) requires additional explicit confirmation. The fact and time of consent are logged by the system.',\n        'faq10-q': 'How much do the annual maintenance costs come to?',\n        'faq10-a': '<p>These are pass-through costs paid directly to the service providers. Amounts may vary depending on call volume (number and length of calls). Anna also generates social media content daily for Facebook and LinkedIn.<\u002Fp><ul class=\"space-y-1.5 list-disc pl-5\"><li><strong class=\"text-slate-700\">Domain name:<\u002Fstrong> $8 – $22 / year<\u002Fli><li><strong class=\"text-slate-700\">Make.com (Logic & Integration):<\u002Fstrong> ~$119 / year<\u002Fli><li><strong class=\"text-slate-700\">ElevenLabs (Voice):<\u002Fstrong> $135 – $270 / year<\u002Fli><li><strong class=\"text-slate-700\">Twilio (SMS):<\u002Fstrong> $54 – $162 / year<\u002Fli><li><strong class=\"text-slate-700\">Cloudflare (Code):<\u002Fstrong> $0<\u002Fli><li><strong class=\"text-slate-700\">Web hosting:<\u002Fstrong> $0 – $41 / year<\u002Fli><li><strong class=\"text-slate-700\">Claude AI (Text generation):<\u002Fstrong> ~$5 / year<\u002Fli><li><strong class=\"text-slate-700\">Pollinations AI (Image generation):<\u002Fstrong> $0 (free)<\u002Fli><\u002Ful><div class=\"bg-slate-50 rounded-xl px-4 py-2.5 border border-slate-200/60 -ml-1\"><p class=\"text-sm font-semibold text-slate-800\">Total: <span class=\"text-dental-700\">~$321 – $619 / year<\u002Fspan><\u002Fp><\u002Fdiv><p class=\"text-xs text-slate-400 italic\">Important information for the practice: Longer conversations consume more characters; higher call and SMS volumes result in proportionally higher costs. These are only estimated values.<\u002Fp>',\n\n        'demo-sub': 'Live demo',\n        'demo-title': 'Try Anna!',\n        'demo-desc': 'Talk to her on the phone, or check available slots in real time — and experience what it\\'s like when nothing slips through the cracks.',\n        'demo-what': 'What to ask Anna',\n        'demo-what-sub': 'Just speak naturally — Anna understands!',\n        'prompt1-title': 'Book an appointment',\n        'prompt1-text': '\"I\\'d like to schedule a teeth cleaning next Tuesday at 2 PM\"',\n        'prompt2-title': 'Reschedule',\n        'prompt2-text': '\"I need to move my tomorrow\\'s appointment to Thursday\"',\n        'prompt3-title': 'Urgent toothache',\n        'prompt3-text': '\"My tooth hurts and it\\'s getting worse — can you see me today?\"',\n        'prompt4-title': 'Treatment Information',\n        'prompt4-text': 'Anna answers questions about treatments and practice procedures, providing patients with all the information they need.',\n        'demo-available': 'Anna available',\n        'demo-response': 'Response <2 sec',\n        'demo-voice': 'Voice conversation with Anna',\n        'cal-title': 'Anna\\'s live calendar',\n        'cal-sub': 'Available slots in real time',\n        'cal-sync': 'Sync:',\n        'cal-auto': 'Auto-refresh every 30 seconds',\n        'cal-refresh': 'Refresh now', underline\">privacypolicy<\u002Fa>',\n        'priv-li3-2': '<strong>Google Fonts<\u002Fstrong> (typography) — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-li3-3': '<strong>Tailwind CDN<\u002Fstrong> (CSS framework)',\n        'priv-li3-4': '<strong>ElevenLabs<\u002Fstrong> (conversational AI / voice synthesis) — <a href=\"https://elevenlabs.io/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">elevenlabs.io/privacy<\u002Fa>',\n        'priv-li3-5': '<strong>Google Calendar<\u002Fstrong> — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-h4': '4. Legal basis and retention',\n        'priv-p4': 'Technical data is processed under GDPR Art. 6(1)(f) — legitimate interest (secure operation of the website). Voice interaction is based on consent (Art. 6(1)(a)), given via the pop-up before starting a call. Voice data is not retained long-term.',\n        'priv-h5': '5. Your rights',\n        'priv-p5': 'You have the right of access, rectification, erasure and objection regarding your data. Send requests to info@dentai.me. You may file a complaint with the Hungarian DPA (NAIH, www.naih.hu).',\n        'priv-h6': '6. Disclaimer',\n        'priv-p6': 'This is a portfolio demo. AI-generated answers do not constitute medical advice. The site owner assumes no liability for data provided by users or for any damages arising from AI responses.',\n        'priv-updated': 'Effective: 26 April 2026.',\n        'modal-title': 'Consent Statement',\n        'modal-text': 'This call is handled by artificial intelligence (AI). Voice data is processed during the conversation. By initiating the call, you accept that AI generates responses and that the conversation does not constitute medical advice.',\n        'modal-checkbox': 'I have read and accept the above notice.',\n        'modal-cancel': 'Cancel',\n        'modal-accept': 'I Accept',\n\n        'cap-sub': 'Anna\\'s capabilities',\n        'cap-title': 'Everything a receptionist needs to know',\n        'cap-desc': 'From booking to cancellations and the waitlist — Anna independently handles all patient communication by phone in real time. Every feature is available in all supported languages.',\n        'cap1-title': 'Available appointments',\n        'cap1-desc': 'Anna searches for available slots in Google Calendar in real time — filtered by date, time of day, or doctor. The patient gets an instant selection.',\n        'cap1-tag2': 'Real-time',\n        'cap2-title': 'Appointment booking',\n        'cap2-desc': 'Once the patient provides their name, email address, and desired time, Anna records the booking in the calendar and immediately sends a confirmation SMS and e-mail.',\n        'cap2-tag1': 'Confirmation',\n        'cap3-title': 'Appointment modification',\n        'cap3-desc': 'If the patient requests a different time, Anna cancels the old one and books the new one — she also checks the calendar for the new time\\'s availability to prevent any conflicts.',\n        'cap3-tag1': 'Old → New',\n        'cap3-tag2': 'Verified',\n        'cap4-title': 'Appointment cancellation',\n        'cap4-desc': 'The patient can confirm the cancellation — Anna removes the event from the calendar and sends a cancellation confirmation SMS and e-mail in the appropriate language.',\n        'cap4-tag1': 'Notification',\n        'cap4-tag2': 'Calendar update',\n        'cap5-title': 'Appointment lookup',\n        'cap5-desc': 'If the patient doesn\\'t remember their booking, Anna retrieves future appointments by phone or e-mail and reads them out to facilitate modification or cancellation.',\n        'cap5-tag1': 'Search',\n        'cap5-tag2': 'Patient identification',\n        'cap6-title': 'Waitlist',\n        'cap6-desc': 'If no appointment is available, Anna adds the patient to the priority waitlist — along with their preferred time slots. When a slot opens up, the system automatically notifies them.',\n        'cap6-tag1': 'Priority',\n        'cap6-tag2': 'Automatic notification',\n        'cap7-title': 'Data modification',\n        'cap7-desc': 'If the patient has a new phone number or e-mail address, Anna updates the data in the system — based on the current e-mail identifier, with immediate effect.',\n        'cap7-tag1': 'Phone / e-mail',\n        'cap7-tag2': 'Immediate',\n        'cap8-title': 'Call transfer',\n        'cap8-desc': 'If the patient wants to speak with a staff member, if a technical error occurs, or if Anna cannot answer, she automatically notifies the reception for a callback — the patient is never left without a response.',\n        'cap8-tag1': 'Callback',\n        'cap8-tag2': 'Safety net',\n        'cap-stat1-label': 'Built-in tools for patient communication',\n        'cap-stat2-label': 'Languages spoken fluently',\n        'cap-stat3-label': 'Available day and night, even on holidays',\n        'cap-stat3-value': '24/7',\n        'lang-title': 'Eleven languages, one voice',\n        'lang-subtitle': 'Automatic language detection — every feature available in every language',\n        'lang-auto': 'Automatic detection',\n        'lang-desc': 'Anna automatically detects the patient\\'s language at the start of the call and continues the conversation in that language. SMS messages, e-mails, and calendar entries are also created in the patient\\'s native language — so international patients feel at home in the practice and are never at a communication disadvantage.',\n        'lang-feat1-title': 'Spoken communication',\n        'lang-feat1-desc': 'Live voice, natural speech',\n        'lang-feat2-title': 'Language-specific SMS',\n        'lang-feat2-desc': 'Confirmation in the patient\\'s language',\n        'lang-feat3-title': 'Multilingual e-mail',\n        'lang-feat3-desc': 'Calendar description in 11 languages, generated automatically',\n        'roi-email-btn': 'Share by email',\n        'roi-email-prompt': 'Send the result to yourself!',\n        'roi-email-send': 'Send',\n        'roi-email-success': 'Sent! Check your inbox.'\n      ,\n        'roi-email-error': 'An error occurred while sending. Please try again!'\n      ,\n        'roi-email-subject': 'Your ROI Calculator Results'\n      ,\n        'roi-email-greeting': 'Dear'\n      ,\n        'roi-email-closing': 'Best regards, The DentAi Team'\n      ,\n        'roi-name-placeholder': 'Name'\n      ,\n        'roi-email-placeholder': 'email@example.com'\n      ,\n        'roi-sub': 'How much does Anna bring in?',\n        'roi-title': 'ROI calculator — in 30 seconds',\n        'roi-desc': 'Set your practice daily call volume — we will calculate how much revenue slips away with missed calls, and how much Anna brings back.',\n        'roi-inputs-title': 'Your practice',\n        'roi-inputs-desc': 'Drag the sliders — results update instantly.',\n        'roi-calls-label': 'How many calls do you receive daily?',\n        'roi-calls-unit': 'calls/day',\n        'roi-missed-label': 'Missed call rate',\n        'roi-missed-hint': 'Weekends, lunch hours, parallel calls, language barriers.',\n        'roi-value-label': 'Average treatment value',\n        'roi-result-label': 'Estimated return',\n        'roi-monthly-label': 'Monthly recovered revenue',\n        'roi-yearly-label': 'Per year',\n        'roi-bookings-label': 'Extra bookings/month',\n        'roi-monthly-sub': '',\n        'roi-cta': 'Request demo →',\n        'roi-disclaimer': 'Estimate. Actual results depend on practice profile and treatment ratios.',\n        'roi-value-currency': '$'},\n      de: {\n        'page-title': 'Anna — DentAi Senior Assistentin | 24/7 Anrufbearbeitung & Terminbuchung',\n        'brand-suffix': '-AI',\n        'senior-badge': 'Senior KI-Assistentin',\n        'hero-h1-1': 'Nie wieder',\n        'hero-h1-2': 'verpasste Anrufe.',\n        'hero-desc': 'Lernen Sie <strong class=\"text-slate-800\">Anna<\u002Fstrong> kennen — die DentAi Senior Assistentin, die <strong class=\"text-slate-800\">rund um die Uhr<\u002Fstrong> Anrufe entgegennimmt, Termine bucht und sofort bestätigt — damit Ihre Rezeption sich voll auf die Patienten konzentrieren kann.',\n        'hero-call': 'Mit Anna sprechen',\n        'hero-hangup': 'Anruf beenden',\n        'hero-calendar': 'Kalender ansehen',\n        'feat-1': '24/7 Anrufbearbeitung',\n        'feat-2': 'Automatische Bestätigung',\n        'feat-3': '11 Sprachen',\n        'status-ready': 'Anna ist bereit — rufen Sie an!',\n        'status-connecting': 'Verbindung zu Anna...',\n        'status-listening': 'Anna hört zu — sagen Sie ihr, wie sie helfen kann',\n        'status-speaking': 'Anna antwortet Ihnen',\n        'error-server': 'Anruf konnte nicht gestartet werden. Der Server ist nicht erreichbar.',\n        'error-mic': 'Mikrofonberechtigung ist erforderlich, um einen Anruf zu starten. Bitte aktivieren Sie den Mikrofonzugriff in Ihren Browsereinstellungen und versuchen Sie es erneut.',\n        'error-no-url': 'Verbindung zu Anna fehlgeschlagen (signed URL fehlt). Bitte versuchen Sie es später erneut!',\n\n        'header-available': 'Anna verfügbar',\n        'header-connecting': 'Verbindung...',\n        'header-listening': 'Anna hört zu...',\n        'header-speaking': 'Anna spricht...',\n        'mobile-available': 'Anna verfügbar',\n        'menu-label': 'Menü',\n        'menu-close': 'Schließen',\n        'float-1': 'Eingehender Anruf',\n        'float-2': 'Termin gebucht',\n        'float-3': 'Bestätigung gesendet',\n        'phone-anna-name': 'Anna',\n        'phone-anna-role': 'Senior Assistentin · Online',\n        'chat-1': 'Guten Abend! Ich möchte gerne eine Zahnreinigung für morgen früh buchen.',\n        'chat-2': 'Guten Abend! Ich prüfe sofort unsere freien Zeiten. Morgen früh haben wir um 9:00 Uhr und um 11:30 Uhr noch Termine frei. Was passt Ihnen besser?',\n        'chat-3': '9:00 Uhr wäre perfekt!',\n        'chat-4': 'Alles klar! Der Termin für morgen um 9:00 Uhr ist gebucht. Die Bestätigung sende ich Ihnen gleich per SMS und E-Mail.',\n        'chat-input': 'Schreiben Sie Anna eine Nachricht...',\n        'how-title-sub': 'So funktioniert es',\n        'how-title': 'In vier Schritten zum stressfreien Praxisalltag',\n        'how-desc': 'Vollautomatisierung vom Anruf bis zum Besuch. Der Patient meldet sich nur an — Anna erledigt den Rest im Hintergrund.',\n        'step1-title': 'Eingehende Anfrage',\n        'step1-desc': 'Der Patient ruft an oder bucht online — Anna nimmt sofort ab, Tag und Nacht. Kein Warten, kein Besetztzeichen.',\n        'step1-tag1': 'Telefon',\n        'step1-tag2': 'Online-Buchung',\n        'step2-title': 'Intelligente Bedarfsanalyse',\n        'step2-desc': 'Anna analysiert die Anfrage des Patienten — akute Zahnschmerzen, Routinereinigung oder Beratung — und leitet sofort an die richtige Abteilung weiter.',\n        'step2-tag1': 'Triage',\n        'step2-tag2': 'Mehrsprachig',\n        'step3-title': 'Kalender-Synchronisation',\n        'step3-desc': 'Anna sieht die freien Termine in Echtzeit und bucht den Termin sofort — oder ändert ihn, wenn der Patient einen anderen Zeitpunkt wünscht.',\n        'step3-tag1': 'Echtzeit',\n        'step3-tag2': 'Buchen/Ändern',\n        'step4-title': 'Fachliche Beratung',\n        'step4-desc': 'Anna beantwortet Fragen zu Behandlungen und zum Praxisablauf, sodass Ihre Patienten bestens informiert sind.',\n        'step4-tag1': 'E-Mail',\n        'step4-tag2': 'SMS',\n        'step4-tag3': 'Kalender',\n        'care-sub': 'Automatische Nachbetreuung',\n        'care-title': 'Vor und nach dem Termin da',\n        'care-desc': 'Anna bucht nicht nur — sie sorgt vor. Am Morgen vor der Behandlung erinnert sie, am Tag danach fragt sie nach. Der Patient fühlt sich nie vergessen, und die Praxis erhält echtes Feedback zur Qualität.',\n        'care1-title': 'SMS-Erinnerung vor dem Termin',\n        'care1-subtitle': 'Automatisch — Ohne menschliches Eingreifen',\n        'care1-desc': 'Am Morgen vor der Behandlung sendet Anna automatisch eine SMS an den Patienten über den Termin am nächsten Tag, um das Vergessen zu verhindern. Dieser Prozess reduziert die Nicht-Erschienenen-Rate drastisch und befreit die Rezeption vollständig von der manuellen Erinnerungsarbeit.',\n        'care1-tag1': 'Twilio SMS',\n        'care1-tag2': 'Google Calendar',\n        'care1-tag3': 'Zeitgesteuert',\n        'care1-step1-title': 'Zeitsteuerung: jeden Morgen',\n        'care1-step1-desc': 'Das System sendet jeden Morgen Erinnerungs-SMS für die Termine des Folgetags',\n        'care1-step2-title': 'Kalenderabfrage',\n        'care1-step2-desc': 'Anna ruft das Ereignis aus Google Calendar ab und überprüft die Details',\n        'care1-step3-title': 'SMS-Versand (Twilio)',\n        'care1-step3-desc': 'Personalisierte Erinnerungs-SMS — Name, Termin und Ort enthalten',\n        'care1-sms-header': 'Erinnerung · Termin am nächsten Tag',\n        'care1-sms-body': 'Erinnerung: Ihr zahnärztlicher Termin morgen',\n        'care1-sms-arrival': 'Bitte kommen Sie 10 Minuten früher.',\n        'care1-sms-date': '📅 29.04.2026 · 10:00',\n        'care1-sms-footer': '— DentAi Assistentin',\n        'care1-sms-preview': 'Sehr geehrter Jan Müller! 👋',\n        'care2-title': 'Nachsorge nach dem Termin / Umfrage',\n        'care2-subtitle': 'Automatisch — Ohne menschliches Eingreifen',\n        'care2-desc': 'Am Tag nach der Behandlung sendet Anna eine kurze Umfrage-E-Mail, in der der Patient die Leistung bewerten kann. Das Feedback wird automatisch protokolliert, sodass die Praxis die Qualität kontinuierlich und ohne manuelle Datenerfassung verbessern kann.',\n        'care2-tag1': 'Gmail',\n        'care2-tag2': 'Statistik',\n        'care2-tag3': 'Zeitgesteuert',\n        'care2-step1-title': 'Zeitsteuerung: am Tag nach der Behandlung',\n        'care2-step1-desc': 'Am Tag nach der Behandlung sendet das System Feedback-E-Mails an die Patienten',\n        'care2-step2-title': 'Umfrage-E-Mail (Gmail)',\n        'care2-step2-desc': 'Personalisierte E-Mail mit Umfrage-Link — Zufriedenheit, Erlebnis, Vorschläge',\n        'care2-step3-title': 'Statistik-Protokollierung',\n        'care2-step3-desc': 'Antworten werden automatisch in die Google Sheets Statistik-Registerkarte eingetragen',\n        'care2-email-from': 'DentAi Assistentin',\n        'care2-email-to': '→ jan.mueller@email.de',\n        'care2-email-subject': 'Ihr Feedback zum Besuch – DentAi',\n        'care2-email-body': 'Sehr geehrter Jan Müller! Wir vertrauen darauf, dass Ihr Besuch reibungslos verlief. Ihre Meinung ist uns wichtig: Bitte teilen Sie Ihre Erfahrungen in einer kurzen Umfrage mit uns, damit wir unsere Versorgung weiter verbessern können.',\n        'care2-email-cta': '→ Umfrage ausfüllen',\n        'care-stat1-value': '~40%',\n        'care-stat1-label': 'Nicht-Erschienenen-Reduktion durch Erinnerungen',\n        'care-stat2-value': '0',\n        'care-stat2-label': 'Handarbeit und vollständig automatisierter Prozess',\n        'care-stat3-value': '24h',\n        'care-stat3-label': 'Feedback nach der Behandlung',\n        'flow-1': 'Eingehender Anruf/Web',\n        'flow-2': 'Bedarfsanalyse',\n        'flow-3': 'Kalender-Sync',\n        'flow-4': 'Bestätigung',\n        'flow-done': 'Fertig!',\n        'why-sub': 'Warum Anna?',\n        'why-title': 'Entlasten Sie Ihre Rezeption – ab sofort',\n        'why-desc': 'Anna ersetzt nicht die Rezeptionistin — sie übernimmt repetitive Aufgaben, damit sich Ihr Team auf das Wesentliche konzentrieren kann.',\n        'ben1-title': 'Keine verpassten Anrufe mehr',\n        'ben1-desc': 'Anna nimmt Anrufe rund um die Uhr entgegen — in der Mittagspause, am Wochenende und an Feiertagen. So landet kein Patient mehr auf dem Anrufbeantworter.',\n        'ben2-title': 'Mehr Zeit für das Wesentliche',\n        'ben2-desc': 'Ihr Empfangsteam kann sich auf die Patienten vor Ort konzentrieren — Anna erledigt die telefonischen Routineaufgaben im Hintergrund.',\n        'ben3-title': 'Elf Sprachen, eine Stimme',\n        'ben3-desc': 'Kommuniziert fließend auf Ungarisch, Englisch, Deutsch, Niederländisch, Französisch, Italienisch, Dänisch, Norwegisch, Schwedisch, Finnisch und Slowakisch — internationale Patienten fühlen sich in der Praxis wohl.',\n        'clinic-sub': 'Praxisinformationen',\n        'clinic-title': 'Praxisdetails',\n        'clinic-desc': 'Anna kennt alle wichtigen Daten der Praxis — von den Öffnungszeiten bis zur Behandlungsdauer.',\n        'clinic-details-title': 'Praxisdetails',\n        'clinic-location-label': 'Standort',\n        'clinic-location-value': 'Budapest, Bezirk V, Innenstadt',\n        'clinic-hours-label': 'Öffnungszeiten',\n        'clinic-hours-value': 'Montag–Freitag 08:00–18:00',\n        'clinic-closed-label': 'Geschlossen',\n        'clinic-closed-value': 'Samstag, Sonntag und Feiertage',\n        'clinic-doctors-label': 'Ärzte',\n        'clinic-doctors-value': 'Dr. Kovács und Dr. Nagy',\n        'clinic-treatments-title': 'Behandlungen & Dauer',\n        'clinic-treatments-note': '30-Minuten-Zeitslots',\n        'treat1-name': 'Untersuchung / Beratung',\n        'treat1-dur': '30 Min.',\n        'treat2-name': 'Zahnsteinentfernung',\n        'treat2-dur': '30 Min.',\n        'treat4-name': 'Füllungswechsel',\n        'treat4-dur': '45 Min.',\n        'treat5-name': 'Wurzelbehandlung',\n        'treat5-dur': '90 Min.',\n        'treat6-name': 'Notfallversorgung',\n        'treat6-dur': '60 Min.',\n\n        'faq-sub': 'Häufig gestellte Fragen',\n        'social-sub': 'Social AutoPilot',\n        'social-title': 'Anna postet für Sie',\n        'social-desc': 'Jeden Tag neue, KI-generierte Inhalte auf Facebook und LinkedIn — Text und Bild, vollautomatisch.',\n        'social-card1-title': 'Automatische Inhaltserstellung',\n        'social-card1-text': 'Anna schreibt jeden Tag einen neuen Fachbeitrag zu den unterschiedlichsten zahnmedizinischen Themen — von der Zahnaufhellung bis zu Implantaten, von der Kinderzahnheilkunde bis zur Notfallversorgung. Die KI wählt zufällig ein Thema und erstellt einen formellen, fachlichen Text: Überschrift, Fragestellung, 3–5 praktische Tipps und einen Call-to-Action. Keine Wiederholungen, kein schablonenhafter Ton — jeder Beitrag ist einzigartig und frisch.',\n        'social-card2-title': 'KI erstellt die Bilder',\n        'social-card2-text': 'Für jeden Beitrag generiert Anna ein professionelles, zahnmedizinisches Bild — saubere, moderne Praxisumgebungen, ein strahlendes Lächeln, ästhetische Behandlungsergebnisse. Die Bilder passen automatisch zum Beitragsthema und sorgen für optisch ansprechende und einheitliche Facebook- und LinkedIn-Inhalte — ohne Fotografen.',\n        'social-card2-tag2': 'Ohne Wasserzeichen',\n        'social-card3-title': 'Facebook und LinkedIn',\n        'social-card3-text': 'Anna postet gleichzeitig auf beiden Plattformen: mit Foto auf der Facebook-Seite und mit visuellem Inhalt im LinkedIn-Unternehmensprofil. Beiträge erscheinen sofort — ohne Wartezeit auf Freigaben. Der gesamte Prozess läuft über die Make.com-Automatisierungs-Engine, wobei Claude AI die Texte erstellt und Pollinations die Bilder generiert.',\n        'social-benefit1-title': 'Zeitersparnis',\n        'social-benefit1-text': 'Kein Texten, keine Bildsuche, kein Posten nötig — Anna erledigt alles für Sie',\n        'social-benefit2-title': 'Kontinuierliche Präsenz',\n        'social-benefit2-text': 'Täglich frische Inhalte sorgen dafür, dass Ihre Praxis nie inaktiv wirkt',\n        'social-benefit3-title': 'Wachsende Reichweite',\n        'social-benefit3-text': 'Regelmäßige Beiträge erhöhen die organische Sichtbarkeit und gewinnen neue Patienten',\n        'social-benefit4-title': 'Fachliche Glaubwürdigkeit',\n        'social-benefit4-text': 'Hochwertige, informative Beiträge stärken den Ruf Ihrer Praxis und schaffen Vertrauen.',\n        'social-follow-fb': 'Folgen Sie uns auf Facebook!',\n        'social-follow-li': 'Folgen Sie uns auf LinkedIn!',\n        'footer-contact': 'Kontakt',\n        'faq-title': 'Alles, was Sie wissen möchten',\n        'faq-desc': 'Die häufigsten Fragen und Antworten zu Anna — wenn Sie nicht finden, was Sie suchen, kontaktieren Sie mich gerne!',\n        'faq1-q': 'Funktioniert es mit meiner vorhandenen Telefonnummer?',\n        'faq1-a': 'Ja! Anna nimmt Anrufe auf Ihrer vorhandenen Telefonnummer entgegen — keine neue Nummer, kein Anbieterwechsel und keine zusätzliche Ausrüstung erforderlich. Das System lässt sich nahtlos in Ihre aktuelle Telefonleitung integrieren, sodass Patienten unter der gewohnten Nummer anrufen können. Die Einrichtung dauert nur wenige Minuten.',\n        'faq2-q': 'Was passiert, wenn die KI nicht antworten kann?',\n        'faq2-a': 'Wenn Anna eine Frage erhält, auf die sie nicht vorbereitet ist (z. B. spezifische medizinische Fragen, Beschwerdemanagement, komplexe Angebote), benachrichtigt sie automatisch die Praxisrezeption für einen Rückruf — sie notiert die Patientendaten und die Anfrage, damit die Rezeption den Patienten so schnell wie möglich zurückrufen kann. Ist die Praxis geschlossen, notiert Anna das Anliegen, und die Rezeption ruft den Patienten am nächsten Werktag zurück. Der Patient bleibt niemals ohne Antwort.',\n        'faq3-q': 'Wie ist das System verfügbar?',\n        'faq3-a': 'Anna ist derzeit als Portfolio-Demo verfügbar — entwickelt von Peter Petor als Privatperson, kommerziell noch nicht im Vertrieb. Die Website und die Gesprächs-Demo können von jedem getestet werden, sodass Praxen, Entwickler oder Geschäftsinteressenten einen Überblick über die Funktionsweise erhalten. Bei Interesse an einer Produktiveinführung oder einer individuellen Zusammenarbeit (Pilotprogramm, Integration) kontaktieren Sie mich bitte unter info@dentai.me.',\n        'faq4-q': 'Welche Sprachen spricht sie?',\n        'faq4-a': 'Sie kommuniziert derzeit fließend in elf Sprachen: Ungarisch, Englisch, Deutsch, Niederländisch, Französisch, Italienisch, Dänisch, Norwegisch, Schwedisch, Finnisch und Slowakisch. Die Sprachauswahl erfolgt automatisch — Anna erkennt die Sprache des Patienten und antwortet in dieser. Dies ist besonders wertvoll in tourismusstarken Regionen, in denen internationale Patienten häufig die Praxis anrufen.',\n        'faq5-q': 'Wie geht sie mit Notfällen um?',\n        'faq5-a': 'In dringenden Situationen — wie starken Zahnschmerzen, Zahnunfall oder Blutung — priorisiert Anna den Anruf sofort. Sie erkennt Dringlichkeits-Schlüsselwörter und sucht den frühestmöglichen Termin am selben Tag. In echten Notfällen (z. B. Kieferfraktur, unkontrollierbare Blutung) verweist sie den Patienten an die nächste Notfallversorgung. Notrufe werden niemals versehentlich als Routinebuchungen eingestuft.',\n        'faq6-q': 'Wie wird der Datenschutz (DSGVO) gehandhabt?',\n        'faq6-a': 'Anna wurde unter Berücksichtigung der DSGVO-Anforderungen entwickelt, aber es ist wichtig, transparent über die genutzten Dienstleister zu informieren. Webseiten- und API-Verkehr läuft über das Cloudflare CDN, die Sprachverarbeitung erfolgt durch ElevenLabs — beides sind US-amerikanische Anbieter, die mit Standardvertragsklauseln (SCC) und einer Auftragsverarbeitungsvereinbarung (DPA) arbeiten, dennoch können Daten in ein Drittland (USA) übermittelt werden. Vor der produktiven Nutzung muss jede Praxis eine eigene DPA mit den Anbietern abschließen, die Datenübermittlung und ihre Rechtsgrundlage in der Datenschutzerklärung offenlegen, und eine Datenschutz-Folgenabschätzung (DSFA) wird empfohlen. Die Erörterung detaillierter gesundheitlicher Beschwerden (besondere Datenkategorien, DSGVO Art. 9) erfordert eine separate ausdrückliche Einwilligung. Vor jeder produktiven Einführung wird die Beratung durch einen Datenschutzexperten/Anwalt empfohlen.',\n        'faq7-q': 'Wie wird Anna mit einer Telefonnummer verknüpft?',\n        'faq7-a': 'Es gibt zwei Hauptansätze. Neue Nummer: Bei Twilio oder einem anderen VoIP-Anbieter (z. B. ungarische SIP-Trunks: Hipernet, Voipgate) kann eine Telefonnummer erworben werden, die direkt zum ElevenLabs Conversational AI Agent geleitet wird — mit der Twilio-Integration ist dies in wenigen Stunden eingerichtet. Weiterleitung der bestehenden Nummer: Auf der aktuellen Praxisnummer kann eine zeitgesteuerte Weiterleitung eingerichtet werden (z. B. nur außerhalb der Geschäftszeiten oder bei besetzter Leitung), sodass Anna nur dann antwortet, wenn die Rezeption nicht erreichbar ist. Die genaue Konfiguration wird an die Infrastruktur jeder Praxis individuell angepasst.',\n        'faq8-q': 'Wie funktioniert die Einwilligung beim Telefonanruf?',\n        'faq8-a': 'Bei Annahme des Anrufs informiert Anna in ihrem ersten Satz den Anrufer: Es spricht ein KI-Assistent, der Anruf kann zu Qualitätssicherungszwecken aufgezeichnet werden, und ein Rückruf durch einen Mitarbeiter kann jederzeit angefordert werden (Anna veranlasst auf Wunsch einen Rückruf). Setzt der Patient das Gespräch fort, gilt dies als Einwilligung durch konkludentes Verhalten (DSGVO Art. 6 Abs. 1 lit. a und b). Für die Erörterung gesundheitlicher Beschwerden (z. B. Schmerzen, Medikamente) ist eine zusätzliche ausdrückliche Bestätigung erforderlich. Die Tatsache und der Zeitpunkt der Einwilligung werden vom System protokolliert.',\n        'faq10-q': 'Wie hoch sind die laufenden Kosten?',\n        'faq10-a': '<p>Diese werden von der Praxis direkt an die Dienstleister gezahlt. Die Beträge können je nach Gesprächsaufkommen (Anzahl und Länge der Anrufe) variieren. Anna generiert außerdem täglich Inhalte für Facebook und LinkedIn.<\u002Fp><ul class=\"space-y-1.5 list-disc pl-5\"><li><strong class=\"text-slate-700\">Domainname:<\u002Fstrong> 8 – 20 € / Jahr<\u002Fli><li><strong class=\"text-slate-700\">Make.com (Logik / Steuerung):<\u002Fstrong> ~110 € / Jahr<\u002Fli><li><strong class=\"text-slate-700\">ElevenLabs (Stimme):<\u002Fstrong> 125 – 250 € / Jahr<\u002Fli><li><strong class=\"text-slate-700\">Twilio (SMS):<\u002Fstrong> 50 – 150 € / Jahr<\u002Fli><li><strong class=\"text-slate-700\">Cloudflare (Code):<\u002Fstrong> 0 €<\u002Fli><li><strong class=\"text-slate-700\">Webhosting:<\u002Fstrong> 0 – 38 € / Jahr<\u002Fli><li><strong class=\"text-slate-700\">Claude AI (Textgenerierung):<\u002Fstrong> ~5 € / Jahr<\u002Fli><li><strong class=\"text-slate-700\">Pollinations AI (Bildgenerierung):<\u002Fstrong> 0 € (kostenlos)<\u002Fli><\u002Ful><div class=\"bg-slate-50 rounded-xl px-4 py-2.5 border border-slate-200/60 -ml-1\"><p class=\"text-sm font-semibold text-slate-800\">Gesamt: <span class=\"text-dental-700\">~298 – 573 € / Jahr<\u002Fspan><\u002Fp><\u002Fdiv><p class=\"text-xs text-slate-400 italic\">Wichtige Hinweise für die Praxis: Längere Gespräche bedeuten mehr Zeichen. Mehr Anrufe bedeuten eine höhere Rechnung. Mehr SMS bedeuten eine höhere Rechnung. Dies sind nur Schätzwerte.<\u002Fp>',\n\n        'demo-sub': 'Live-Demo',\n        'demo-title': 'Testen Sie Anna!',\n        'demo-desc': 'Sprechen Sie mit ihr am Telefon, oder sehen Sie die freien Termine in Echtzeit — und erleben Sie, wie es ist, wenn nichts mehr durchrutscht.',\n        'demo-what': 'Was Sie Anna fragen können',\n        'demo-what-sub': 'Sprechen Sie einfach natürlich — Anna versteht!',\n        'prompt1-title': 'Termin buchen',\n        'prompt1-text': '„Ich möchte nächsten Dienstag um 14 Uhr einen Termin zur Zahnreinigung\"',\n        'prompt2-title': 'Termin ändern',\n        'prompt2-text': '„Ich muss meinen Termin von morgen auf Donnerstag verschieben“',\n        'prompt3-title': 'Akute Zahnschmerzen',\n        'prompt3-text': '„Mein Zahn tut weh und wird schlimmer — können Sie mich heute noch behandeln?\"',\n        'prompt4-title': 'F rübergehend zur Erzeugung der Konversation verarbeitet (ElevenLabs). Bitte teilen Sie keine echten persönlichen Daten mit!',\n        'priv-li2-3': '<strong>LocalStorage:<\u002Fstrong> In Ihrem Browser wird eine Markierung gespeichert, dass Sie die rechtlichen Hinweise akzeptiert haben — diese wird an keinen Server übertragen.',\n        'priv-h3': '3. Drittanbieter (Drittstaatenübermittlung)',\n        'priv-p3': 'Die Seite lädt Ressourcen von folgenden Drittanbietern. Dadurch können Ihre IP-Adresse und Browserdaten in Nicht-EU/EWR-Länder (Drittstaaten, typischerweise die USA) übermittelt werden, wo die jeweiligen Datenschutzrichtlinien der Anbieter gelten:',\n        'priv-li3-1': '<strong>Cloudflare<\u002Fstrong> (CDN, Hosting) — <a href=\"https://www.cloudflare.com/privacypolicy/\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">privacypolicy<\u002Fa>',\n        'priv-li3-2': '<strong>Google Fonts<\u002Fstrong> (Schriftarten) — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-li3-3': '<strong>Tailwind CDN<\u002Fstrong> (CSS-Framework)',\n        'priv-li3-4': '<strong>ElevenLabs<\u002Fstrong> (Voice-KI) — <a href=\"https://elevenlabs.io/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">elevenlabs.io/privacy<\u002Fa>',\n        'priv-li3-5': '<strong>Google Kalender<\u002Fstrong> — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-h4': '4. Rechtsgrundlage und Speicherdauer',\n        'priv-p4': 'Technische Daten werden gemäß Art. 6 Abs. 1 lit. f DSGVO (berechtigtes Interesse — sicherer Betrieb der Website) verarbeitet. Sprachinteraktion erfolgt auf Grundlage der Einwilligung (Art. 6 Abs. 1 lit. a), die vor Anrufstart im Pop-up erteilt wird. Spr ikbaarheid controleren',\n        'care1-step2-desc': 'Anna haalt de afspraak op uit Google Agenda en controleert de details',\n        'care1-step3-title': 'SMS-verzending (Twilio)',\n        'care1-step3-desc': 'Gepersonaliseerde herinnerings-SMS — naam, tijd en locatie inbegrepen',\n        'care1-sms-header': 'Herinnering · afspraak morgen',\n        'care1-sms-body': 'Herinnering: uw tandartsafspraak morgen',\n        'care1-sms-arrival': 'Kom alstublieft 10 minuten eerder.',\n        'care1-sms-date': '📅 29-04-2026 · 10:00',\n        'care1-sms-footer': '— DentAi Assistente',\n        'care1-sms-preview': 'Beste heer De Vries, 👋',\n        'care2-title': 'Nazorg na de afspraak / Enquête',\n        'care2-subtitle': 'Automatisch — Zonder menselijke tussenkomst',\n        'care2-desc': 'De dag na de behandeling stuurt Anna een korte enquête via e-mail waarin de patiënt de dienst kan beoordelen. De feedback wordt automatisch geregistreerd, zodat de praktijk de kwaliteit continu kan verbeteren zonder handmatige gegevensinvoer.',\n        'care2-tag1': 'Gmail',\n        'care2-tag2': 'Statistiek',\n        'care2-tag3': 'Tijdsturing',\n        'care2-step1-title': 'Tijdsturing: de dag na de behandeling',\n        'care2-step1-desc': 'De dag na de behandeling stuurt het systeem feedback-e-mails naar de patiënten',\n        'care2-step2-title': 'Enquête-e-mail (Gmail)',\n        'care2-step2-desc': 'Gepersonaliseerde e-mail met enquêtelink — tevredenheid, ervaring, suggesties',\n        'care2-step3-title': 'Statistische registratie',\n        'care2-step3-desc': 'Antwoorden worden automatisch toegevoegd aan het Google Sheets-statistiektabblad',\n        'care2-email-from': 'DentAi Assistente',\n        'care2-email-to': '→ jan.devries@email.nl',\n        'care2-email-subject': 'Uw feedback over het bezoek – DentAi',\n        'care2-email-body': 'Beste heer De Vries, Wij hopen dat uw bezoek vlot is verlopen. Uw mening is voor ons belangrijk: deel uw ervaring in een korte enquête, zodat wij onze zorg verder kunnen verbeteren.',\n        'care2-email-cta': '→ Enquête invullen',\n        'care-stat1-value': '~40%',\n        'care-stat1-label': 'Minder no-shows dankzij herinneringen',\n        'care-stat2-value': '0',\n        'care-stat2-label': 'Handmatig werk en volledig geautomatiseerd proces',\n        'care-stat3-value': '24u',\n        'care-stat3-label': 'Feedback na de behandeling',\n        'flow-1': 'Inkomende oproep/Web',\n        'flow-2': 'Behoeftenanalyse',\n        'flow-3': 'Agenda-sync',\n        'flow-4': 'Bevestiging',\n        'flow-done': 'Klaar!',\n        'why-sub': 'Waarom Anna?',\n        'why-title': 'Ontlast uw receptie — vanaf nu',\n        'why-desc': 'Anna vervangt de receptioniste niet — zij neemt repetitieve taken over, zodat uw team zich op de essentie kan concentreren.',\n        'ben1-title': 'Nooit meer een onbeantwoorde oproep',\n        'ben1-desc': 'Anna neemt oproepen 24/7 aan — in de lunchpauze, in het weekend en op feestdagen. Zo belandt geen patiënt meer op de voicemail.',\n        'ben2-title': 'Meer tijd voor de essentie',\n        'ben2-desc': 'Uw receptie kan zich op de patiënten ter plaatse concentreren — Anna handelt de telefonische routinetaken op de achtergrond af.',\n        'ben3-title': 'Elf talen, één stem',\n        'ben3-desc': 'Communiceert vloeiend in het Nederlands, Hongaars, Engels, Duits, Frans, Italiaans, Deens, Noors, Zweeds, Fins en Slowaaks — internationale patiënten voelen zich welkom in de praktijk.',\n        'clinic-sub': 'Praktijk informatie',\n        'clinic-title': 'Praktijkdetails',\n        'clinic-desc': 'Anna kent alle belangrijke gegevens van de praktijk — van openingstijden tot behandelingsduur.',\n        'clinic-details-title': 'Praktijkdetails',\n        'clinic-location-label': 'Locatie',\n        'clinic-location-value': 'Boedapest, District V, Binnenstad',\n        'clinic-hours-label': 'Openingstijden',\n        'clinic-hours-value': 'Maandag–Vrijdag 08:00–18:00',\n        'clinic-closed-label': 'Gesloten',\n        'clinic-closed-value': 'Zaterdag, zondag en feestdagen',\n        'clinic-doctors-label': 'Artsen',\n        'clinic-doctors-value': 'Dr. Kovács en Dr. Nagy',\n        'clinic-treatments-title': 'Behandelingen & Duur',\n        'clinic-treatments-note': 'Tijdblokken van 30 minuten',\n        'treat1-name': 'Onderzoek / Consult',\n        'treat1-dur': '30 min',\n        'treat2-name': 'Tartaarverwijdering',\n        'treat2-dur': '30 min',\n        'treat4-name': 'Vulling vervangen',\n        'treat4-dur': '45 min',\n        'treat5-name': 'Wortelkanaalbehandeling',\n        'treat5-dur': '90 min',\n        'treat6-name': 'Spoedzorg',\n        'treat6-dur': '60 min',\n\n        'social-sub': 'Social AutoPilot',\n        'social-title': 'Anna post voor u',\n        'social-desc': 'Elke dag nieuwe, AI-gegenereerde content op Facebook en LinkedIn — zowel tekst als afbeeldingen, volledig automatisch.',\n        'social-card1-title': 'Geautomatiseerde contentcreatie',\n        'social-card1-text': 'Anna schrijft elke dag een nieuw vakinhoudelijk bericht over de meest uiteenlopende tandheelkundige onderwerpen — van tanden bleken tot implantaten, van kindertandheelkunde tot spoedzorg. De AI kiest willekeurig een onderwerp en stelt vervolgens een professionele tekst op: kop, vraag, 3–5 praktische tips en een call-to-action. Geen herhaling, geen generieke toon — elk bericht is uniek en fris.',\n        'social-card2-title': 'AI maakt de afbeeldingen',\n        'social-card2-text': 'Voor elk bericht genereert Anna een professionele, tandheelkundige afbeelding — schone, moderne praktijkomgevingen, stralende glimlachen, esthetische behandelresultaten. De afbeeldingen passen automatisch bij het onderwerp, zodat uw Facebook- en LinkedIn-content visueel aantrekkelijk en consistent blijft, zonder fotograaf.',\n        'social-card2-tag2': 'Zonder watermerk',\n        'social-card3-title': 'Facebook en LinkedIn',\n        'social-card3-text': 'Anna plaatst tegelijkertijd op beide platforms: met een foto op de Facebook-pagina en met visuele content op het LinkedIn-bedrijfsprofiel. Berichten verschijnen direct — geen wachttijd voor goedkeuring. Het hele proces draait via de Make.com-automatiseringsengine, waarbij Claude AI de teksten schrijft en Pollinations de afbeeldingen genereert.',\n        'social-benefit1-title': 'Tijdbesparing',\n        'social-benefit1-text': 'Zelf content schrijven, afbeeldingen zoeken of posten is niet meer nodig — Anna regelt alles voor u',\n        'social-benefit2-title': 'Consistente aanwezigheid',\n        'social-benefit2-text': 'Dagelijkse verse content zorgt ervoor dat uw praktijk nooit inactief lijkt',\n        'social-benefit3-title': 'Groeiend bereik',\n        'social-benefit3-text': 'Regelmatige berichten vergroten de organische zichtbaarheid en trekken nieuwe patiënten aan',\n        'social-benefit4-title': 'Professionele geloofwaardigheid',\n        'social-benefit4-text': 'Kwalitatieve, informatieve berichten versterken de reputatie van uw praktijk en bouwen vertrouwen op',\n        'social-follow-fb': 'Volg op Facebook',\n        'social-follow-li': 'Volg op LinkedIn',\n        'footer-contact': 'Contact',\n        'faq-sub': 'Veelgestelde vragen',\n        'faq-title': 'Alles wat u wilt weten',\n        'faq-desc': 'De meest gestelde vragen en antwoorden over Anna — vindt u niet wat u zoekt, neem dan gerust contact met mij op!',\n        'faq1-q': 'Werkt het met mijn bestaande telefoonnummer?',\n        'faq1-a': 'Ja! Anna neemt oproepen aan op uw bestaande telefoonnummer — geen nieuw nummer, geen overstap en geen extra apparatuur nodig. Het systeem integreert naadloos met uw huidige telefoonlijn, zodat patiënten op het vertrouwde nummer kunnen bellen. De installatie duurt slechts enkele minuten.',\n        'faq2-q': 'Wat als de AI niet kan antwoorden?',\n        'faq2-a': 'Als Anna een vraag krijgt waarop ze niet voorbereid is (bijv. specifieke medische vragen, klachtenbeheer, complexe offertes), stelt ze automatisch de receptie van de praktijk op de hoogte voor een terugbelverzoek — ze noteert de patiëntgegevens en het verzoek, zodat de receptie de patiënt zo snel mogelijk kan terugbellen. Is de praktijk gesloten, dan noteert Anna het verzoek en belt de receptie de patiënt terug op de volgende werkdag. De patiënt blijft nooit zonder antwoord.',\n        'faq3-q': 'Hoe is het systeem beschikbaar?',\n        'faq3-a': 'Anna is momenteel beschikbaar als portfoliodemo — ontwikkeld door Peter Petor als particulier, commercieel nog niet in de verkoop. De website en de gespreksdemo kunnen door iedereen worden getest, zodat praktijken, ontwikkelaars of geïnteresseerden een overzicht krijgen van de werking. Bij interesse in een productielancering of een individuele samenwerking (pilotprogramma, integratie) kunt u contact opnemen via info@dentai.me.',\n        'faq4-q': 'Welke talen spreekt ze?',\n        'faq4-a': 'Ze communiceert momenteel vloeiend in elf talen: Nederlands, Hongaars, Engels, Duits, Frans, Italiaans, Deens, Noors, Zweeds, Fins en Slowaaks. De taalkeuze gebeurt automatisch — Anna herkent de taal van de patiënt en antwoordt in die taal. Dit is vooral waardevol in toeristische regio\\'s waar internationale patiënten vaak de praktijk bellen.',\n        'faq5-q': 'Hoe gaat ze om met noodgevallen?',\n        'faq5-a': 'In urgente situaties — zoals hevige kiespijn, tandletsel of bloeding — prioriteert Anna de oproep onmiddellijk. Ze herkent urgentie-sleutelwoorden en zoekt de eerst mogelijke afspraak op dezelfde dag. Bij echte noodgevallen (bijv. kaakbreuk, oncontroleerbare bloeding) verwijst ze de patiënt naar de dichtstbijzijnde spoedeisende hulp. Noodoproepen worden nooit per ongeluk als routineboekingen geclassificeerd.',\n        'faq6-q': 'Hoe wordt de privacy (AVG/GDPR) geregeld?',\n        'faq6-a': 'Anna is ontwikkeld met de AVG/GDPR-vereisten in gedachten, maar het is belang
