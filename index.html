document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-middle { opacity: 0; transform: translateX(10px); }\n    body.menu-open .hamburger-bottom { transform: translateY(-8px) rotate(-45deg); }\n    \n    #mobile-nav {\n      position: fixed;\n      inset: 0;\n      width: 100%;\n      height: 100vh;\n      height: 100dvh;\n      background: #ffffff;\n      z-index: 40; /* A header (50) alatt marad, de a tartalom is fehér, így egybeforr */\n      opacity: 0;\n      visibility: hidden;\n      transform: translateY(-20px) scale(0.98);\n      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);\n      display: flex;\n      flex-direction: column;\n      padding-top: 5rem;\n      padding-bottom: 2rem;\n      padding-left: 1.5rem;\n      padding-right: 1.5rem;\n    }\n    #mobile-nav.open {\n      opacity: 1;\n      visibility: visible;\n      transform: translateY(0) scale(1);\n    }\n\n    .phone-frame{position:relative;width:min(280px,70vw);max-width:280px;aspect-ratio:280/580;border-radius:clamp(28px,7vw,40px);background:#0f172a;padding:clamp(8px,2.2vw,12px);box-shadow:0 0 0 2px #334155,0 25px 60px -12px rgba(0,0,0,.4),0 0 80px rgba(59,130,246,.15)}\n    .phone-screen{width:100%;height:100%;border-radius:clamp(20px,5.5vw,30px);background:#fff;overflow:hidden;position:relative}\n\n    /* === Toast notifications === */\n    #toast-container{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100000;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:calc(100vw - 32px);width:max-content}\n    .toast{pointer-events:auto;display:flex;align-items:flex-start;gap:12px;min-width:280px;max-width:480px;padding:14px 16px;border-radius:12px;background:#1e293b;color:#f1f5f9;font-size:14px;line-height:1.4;box-shadow:0 12px 32px -8px rgba(0,0,0,.35),0 4px 12px rgba(0,0,0,.15);border-left:4px solid #3b82f6;opacity:0;transform:translateY(16px);transition:opacity .25s ease,transform .25s ease}\n    .toast.show{opacity:1;transform:translateY(0)}\n    .toast.toast-error{border-left-color:#ef4444}\n    . ft-20 w-96 h-96 bg-dental-100/40 rounded-full blur-3xl\"><\u002Fdiv>\n      <div class=\"absolute -bottom-20 -right-20 w-96 h-96 bg-blue-100/40 rounded-full blur-3xl\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 relative\">\n      <div class=\"text-center max-w-2xl mx-auto mb-12\">\n        <span class=\"text-xs font-semibold tracking-widest uppercase text-dental-500\" data-i18n=\"roi-sub\">Mennyit hoz Anna?<\u002Fspan>\n        <h2 class=\"mt-3 text-3xl sm:text-4xl font-bold text-slate-900 tracking-tight\" data-i18n=\"roi-title\">ROI kalkulátor — 30 másodperc alatt<\u002Fh2>\n        <p class=\"mt-4 text-base text-slate-500 leading-relaxed\" data-i18n=\"roi-desc\">Állítsa be a praxisa napi hívásszámát — kiszámoljuk, mennyi bevétel csúszik el az elszalasztott hívásokkal, és mennyit hoz vissza Anna.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"bg-white rounded-3xl border border-slate-200/70 shadow-xl shadow-slate-900/5 overflow-hidden\">\n        <div class=\"grid lg:grid-cols-5 gap-0\">\n          <!-- Inputs -->\n          <div class=\"lg:col-span-3 p-8 lg:p-10 border-b lg:border-b-0 lg:border-r border-slate-100\">\n            <h3 class=\"text-lg font-bold text-slate-900 mb-1\" data-i18n=\"roi-inputs-title\">Az ön praxisa<\u002Fh3>\n            <p class=\"text-sm text-slate-500 mb-8\" data-i18n=\"roi-inputs-desc\">Húzza a csúszkákat — az eredmény azonnal frissül.<\u002Fp>\n\n            <div class=\"mb-8\">\n              <div class=\"flex items-baseline justify-between mb-3\">\n                <label for=\"roi-calls\" class=\"text-sm font-semibold text-slate-700\" data-i18n=\"roi-calls-label\">Hány hívást fogad naponta?<\u002Flabel>\n                <div class=\"flex items-baseline gap-1\">\n                  <span id=\"roi-calls-value\" class=\"text-2xl font-bold text-slate-900 tabular-nums\">40<\u002Fspan>\n                  <span class=\"text-sm text-slate-500\" data-i18n=\"roi-calls-unit\">hívás/nap<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <input id=\"roi-calls\" type=\"range\" min=\"5\" max=\"200\" step=\"1\" value=\"40\" class=\"roi-slider w-full\">\n              <div class=\"flex justify-between mt-1 text-[11px] text-slate-400 font-medium\">\n                <span>5<\u002Fspan><span>50<\u002Fspan><span>100<\u002Fspan><span>150<\u002Fspan><span>200<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"mb-8\">\n              <div class=\"flex items-baseline justify-between mb-3\">\n                <label for=\"roi-missed\" class=\"text-sm font-semibold text-slate-700\" data-i18n=\"roi-missed-label\">Elszalasztott hívások aránya<\u002Flabel>\n                <div class=\"flex items-baseline gap-1\">\n                  <span id=\"roi-missed-value\" class=\"text-2xl font-bold text-slate-900 tabular-nums\">25<\u002Fspan>\n                  <span class=\"text-sm text-slate-500\">%<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <input id=\"roi-missed\" type=\"range\" min=\"5\" max=\"60\" step=\"1\" value=\"25\" class=\"roi-slider w-full\">\n              <p class=\"mt-2 text-xs text-slate-400\" data-i18n=\"roi-missed-hint\">Hétvége, ebédidő, párhuzamos hívások, nyelvi akadályok.<\u002Fp>\n            <\u002Fdiv>\n\n            <div>\n              <div class=\"flex items-baseline justify-between mb-3\">\n                <label for=\"roi-value\" class=\"text-sm font-semibold text-slate-700\" data-i18n=\"roi-value-label\">Átlagos kezelés értéke<\u002Flabel>\n                <div class=\"flex items-baseline gap-1\">\n                  <span id=\"roi-value-value\" class=\"text-2xl font-bold text-slate-900 tabular-nums\">25 000<\u002Fspan>\n                  <span class=\"text-sm text-slate-500\" data-i18n=\"roi-value-currency\">Ft<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <input id=\"roi-value\" type=\"range\" min=\"5000\" max=\"150000\" step=\"1000\" value=\"25000\" class=\"roi-slider w-full\">\n              <div class=\"flex justify-between mt-1 text-[11px] text-slate-400 font-medium\">\n                <span id=\"roi-value-lbl-0\">5k<\u002Fspan><span id=\"roi-value-lbl-1\">50k<\u002Fspan><span id=\"roi-value-lbl-2\">100k<\u002Fspan><span id=\"roi-value-lbl-3\">150k<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Output (light, on-brand) -->\n          <div class=\"lg:col-span-2 p-8 lg:p-10 bg-gradient-to-br from-dental-50 via-blue-50/60 to-white relative overflow-hidden\">\n            <div class=\"absolute -top-12 -right-12 w-48 h-48 bg-dental-200/40 rounded-full blur-3xl\"><\u002Fdiv>\n            <div class=\"relative\">\n              <span class=\"inline-flex items-center gap-2 text-[11px] font-bold tracking-widest uppercase text-dental-700 mb-4\">\n                <span class=\"w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse\"><\u002Fspan>\n                <span data-i18n=\"roi-result-label\">Becsült megtérülés<\u002Fspan>\n              <\u002Fspan>\n\n              <div class=\"mb-8\">\n                <p class=\"text-xs uppercase tracking-wide text-slate-500 font-semibold mb-2\" data-i18n=\"roi-monthly-label\">Havi visszanyert bevétel<\u002Fp>\n                <div class=\"flex items-baseline gap-2\">\n                  <span id=\"roi-monthly\" class=\"text-5xl lg:text-6xl font-extrabold tracking-tight tabular-nums text-slate-900\">750 000<\u002Fspan>\n                  <span id=\"roi-monthly-currency\" class=\"text-2xl font-bold text-slate-900\">Ft<\u002Fspan>\n                <\u002Fdiv>\n                <p class=\"mt-2 text-sm text-emerald-700 font-semibold\" data-i18n=\"roi-monthly-sub\"><\u002Fp>\n              <\u002Fdiv>\n\n              <div class=\"grid grid-cols-2 gap-3 mb-8\">\n                <div class=\"bg-white rounded-xl p-4 border border-slate-200/70 shadow-sm\">\n                  <p class=\"text-[10px] uppercase tracking-wide text-slate-500 font-semibold mb-1\" data-i18n=\"roi-yearly-label\">Évente<\u002Fp>\n                  <p class=\"text-lg font-bold tabular-nums text-slate-900\" id=\"roi-yearly\">9 000 000 Ft<\u002Fp>\n                <\u002Fdiv>\n                <div class=\"bg-white rounded-xl p-4 border border-slate-200/70 shadow-sm\">\n                  <p class=\"text-[10px] uppercase tracking-wide text-slate-500 font-semibold mb-1\" data-i18n=\"roi-bookings-label\">Plusz foglalás/hó<\u002Fp>\n                  <p class=\"text-lg font-bold tabular-nums text-slate-900\" id=\"roi-bookings\">30<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <a href=\"#calendar\" class=\"block w-full text-center bg-gradient-to-r from-dental-600 to-blue-600 hover:from-dental-700 hover:to-blue-700 text-white font-bold px-6 py-3.5 rounded-xl shadow-lg shadow-dental-600/25 transition-all hover:shadow-xl hover:-translate-y-0.5\">\n                <span data-i18n=\"roi-cta\">Demót kérek →<\u002Fspan>\n              <\u002Fa>\n              <div id=\"roi-email-section\" class=\"mt-5\">\n                <button id=\"roi-email-toggle\" type=\"button\" class=\"w-full text-center bg-white hover:bg-slate-50 text-dental-600 hover:text-dental-700 border border-dental-200/60 font-semibold px-5 py-3 rounded-xl transition-all flex items-center justify-center gap-2 text-sm\">\n                  <svg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75\"><\u002Fpath><\u002Fsvg>\n                  <span data-i18n=\"roi-email-btn\">Megosztom email-ben<\u002Fspan>\n                <\u002Fbutton>\n                <div id=\"roi-email-form\" class=\"hidden mt-3 bg-white rounded-xl border border-dental-200/60 p-4 shadow-sm\">\n                  <p class=\"text-sm font-semibold text-slate-700 mb-3\" data-i18n=\"roi-email-prompt\">Küldje el magának az eredményt!<\u002Fp>\n                  <div class=\"flex gap-2\">\n                    <input id=\"roi-name-input\" type=\"text\" placeholder=\"Név\" class=\"w-full bg-slate-50 border border-slate-200/60 rounded-lg px-3 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-dental-400 focus:border-dental-400 transition-all mb-2\" data-i18n-placeholder=\"roi-name-placeholder\"><input id=\"roi-email-input\" type=\"email\" placeholder=\"email@pelda.hu\" data-i18n-placeholder=\"roi-email-placeholder\" class=\"flex-1 min-w-0 bg-slate-50 border border-slate-200/60 rounded-lg px-3 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-dental-400 focus:border-dental-400 transition-all\">\n                    <button id=\"roi-email-submit\" type=\"button\" class=\"bg-gradient-to-r from-dental-600 to-blue-600 hover:from-dental-700 hover:to-blue-700 text-white font-semibold px-5 py-2.5 rounded-lg shadow-sm transition-all text-sm whitespace-nowrap\" data-i18n=\"roi-email-send\">Küldés<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div id=\"roi-email-success\" class=\"hidden mt-3 flex items-center gap-2 text-sm text-emerald-700 font-semibold bg-emerald-50 border border-emerald-200/60 rounded-lg px-3 py-2.5\">\n                    <svg class=\"w-4 h-4 flex-shrink-0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z\"><\u002Fpath><\u002Fsvg>\n                    <span data-i18n=\"roi-email-success\">Elküldve! Ellenőrizze a postafókját.<\u002Fspan>\n                  <\u002Fdiv>\n                  <div id=\"roi-email-error\" class=\"hidden mt-3 flex items-center gap-2 text-sm text-red-700 font-semibold bg-red-50 border border-red-200/60 rounded-lg px-3 py-2.5\">\n                    <svg class=\"w-4 h-4 flex-shrink-0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z\"><\u002Fpath><\u002Fsvg>\n                    <span data-i18n=\"roi-email-error\">Hiba történt a küldés során. Próbálja újra!<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p class=\"mt-3 text-[11px] text-slate-500 text-center leading-relaxed\" data-i18n=\"roi-disclaimer\">Becslés. Tényleges eredmény a praxis profiljától és kezelési arányaitól függ.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <style>\n      .roi-slider{appearance:none;-webkit-appearance:none;height:8px;border-radius:9999px;background:linear-gradient(90deg,#2563eb var(--roi-fill,30%),#e2e8f0 var(--roi-fill,30%));outline:none;cursor:pointer}\n      .roi-slider::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:9999px;background:#fff;border:3px solid #2563eb;box-shadow:0 2px 8px rgba(37,99,235,.35);cursor:grab;transition:transform .15s ease, box-shadow .15s ease}\n      .roi-slider::-webkit-slider-thumb:hover{transform:scale(1.12);box-shadow:0 4px 14px rgba(37,99,235,.45)}\n      .roi-slider::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.05)}\n      .roi-slider::-moz-range-thumb{width:24px;height:24px;border-radius:9999px;background:#fff;border:3px solid #2563eb;box-shadow:0 2px 8px rgba(37,99,235,.35);cursor:grab}\n    <\u002Fstyle>\n\n    <script>\n      (function(){\n        /* ── Currency config per language ── */\n        const CURRENCY_CONFIG = {\n          hu: { code:'HUF', symbol:'Ft',   locale:'hu-HU', position:'after',  divisor:1,     valueMin:5000,  valueMax:150000, valueStep:1000, valueDefault:25000 },\n          en: { code:'USD', symbol:'$',    locale:'en-US', position:'before', divisor:1,     valueMin:25,    valueMax:600,    valueStep:5,    valueDefault:85  },\n          de: { code:'EUR', symbol:'€',    locale:'de-DE', position:'before', divisor:1,     valueMin:20,    valueMax:500,    valueStep:5,    valueDefault:80   },\n          nl: { code:'EUR', symbol:'€',    locale:'nl-NL', position:'before', divisor:1,     valueMin:20,    valueMax:500,    valueStep:5,    valueDefault:80   },\n          fr: { code:'EUR', symbol:'€',    locale:'fr-FR', position:'before', divisor:1,     valueMin:20,    valueMax:500,    valueStep:5,    valueDefault:80   },\n          it: { code:'EUR', symbol:'€',    locale:'it-IT', position:'before', divisor:1,     valueMin:20,    valueMax:500,    valueStep:5,    valueDefault:80   },\n          da: { code:'DKK', symbol:'kr.',  locale:'da-DK', position:'after',  divisor:1,     valueMin:150,   valueMax:3500,   valueStep:10,   valueDefault:550  },\n          no: { code:'NOK', symbol:'kr',   locale:'nb-NO', position:'after',  divisor:1,     valueMin:150,   valueMax:3500,   valueStep:10,   valueDefault:550  },\n          sv: { code:'SEK', symbol:'kr',   locale:'sv-SE', position:'after',  divisor:1,     valueMin:150,   valueMax:3500,   valueStep:10,   valueDefault:550  },\n          fi: { code:'EUR', symbol:'€',    locale:'fi-FI', position:'before', divisor:1,     valueMin:20,    valueMax:500,    valueStep:5,    valueDefault:80   },\n          sk: { code:'EUR', symbol:'€',    locale:'sk-SK', position:'before', divisor:1,     valueMin:20,    valueMax:500,    valueStep:5,    valueDefault:80   },\n        };\n\n        /* ── Exchange rate cache (7 days, localStorage) ── */\n        const RATES_CACHE_KEY = 'dentalAiFxRates';\n        const RATES_CACHE_MS  = 7 * 24 * 60 * 60 * 1000;\n        let fxRates = { HUF: 1 }; // fallback: HUF=1 (base)\n\n        function loadCachedRates() {\n          try {\n            const raw = localStorage.getItem(RATES_CACHE_KEY);\n            if (!raw) return null;\n            const obj = JSON.parse(raw);\n            if (Date.now() - obj.ts < RATES_CACHE_MS && obj.rates && obj.rates.HUF) return obj.rates;\n          } catch(e) {}\n          return null;\n        }\n        function saveCachedRates(rates) {\n          try { localStorage.setItem(RATES_CACHE_KEY, JSON.stringify({ ts: Date.now(), rates: rates })); } catch(e) {}\n        }\n\n        async function fetchRates() {\n          const cached = loadCachedRates();\n          if (cached) { fxRates = cached; return; }\n          try {\n            // frankfurter.app: free, ECB-based, HUF as target\n            const resp = await fetch('https://api.frankfurter.app/latest?from=EUR&to=HUF,DKK,NOK,SEK,USD');\n            if (!resp.ok) throw new Error('FX API ' + resp.status);\n            const data = await resp.json();\n            // data.rates = { HUF: 395.xx, DKK: 7.46, NOK: 11.6x, SEK: 11.2x, USD: 1.08 }\n            fxRates = { EUR: 1 };\n            Object.assign(fxRates, data.rates);\n            saveCachedRates(fxRates);\n          } catch(e) {\n            console.warn('[ROI fx] fetch failed, using fallback rates', e);\n            // Hardcoded fallback (approx. 2025 Q1)\n            fxRates = { EUR: 1, HUF: 400, DKK: 7.46, NOK: 11.6, SEK: 11.2, USD: 1.08 };\n          }\n        }\n\n        /* ── Convert HUF amount to target currency ── */\n        function convertHuf(amountHuf, targetCode) {\n          if (targetCode === 'HUF') return amountHuf;\n          const eurToHuf  = fxRates.HUF || 400;\n          const eurToTarget = fxRates[targetCode] || 1;\n          return amountHuf / eurToHuf * eurToTarget;\n        }\n\n        /* ── DOM refs ── */\n        const calls   = document.getElementById('roi-calls');\n        const missed  = document.getElementById('roi-missed');\n        const valueSlider = document.getElementById('roi-value');\n        const cV = document.getElementById('roi-calls-value');\n        const mV = document.getElementById('roi-missed-value');\n        const vV = document.getElementById('roi-value-value');\n        const monthlyEl   = document.getElementById('roi-monthly');\n        const yearlyEl    = document.getElementById('roi-yearly');\n        const bookingsEl  = document.getElementById('roi-bookings');\n        const monthlyCurEl  = document.getElementById('roi-monthly-currency');\n        const currencyLabel = document.querySelector('[data-i18n=\"roi-value-currency\"]');\n        if (!calls) return;\n\n        /* ── Formatting ── */\n        function formatNum(n, locale) {\n          return Math.round(n).toLocaleString(locale).replace(/,/g, ' ');\n        }\n        function formatCurrency(amount, cfg) {\n          const formatted = formatNum(amount, cfg.locale);\n          return cfg.position === 'before'\n            ? cfg.symbol + ' ' + formatted\n            : formatted + ' ' + cfg.symbol;\n        }\n\n        /* ── Slider fill ── */\n        function updateFill(el) {\n          const min = +el.min, max = +el.max, val = +el.value;\n          const pct = ((val - min) / (max - min)) * 100;\n          el.style.setProperty('--roi-fill', pct + '%');\n        }\n\n        /* ── Update slider range for current currency ── */\n        function updateSliderRange(cfg) {\n          valueSlider.min   = cfg.valueMin;\n          valueSlider.max   = cfg.valueMax;\n          valueSlider.step  = cfg.valueStep;\n          valueSlider.value = cfg.valueDefault;\n          // Update range labels\n          const labels = [\n            document.getElementById('roi-value-lbl-0'),\n            document.getElementById('roi-value-lbl-1'),\n            document.getElementById('roi-value-lbl-2'),\n            document.getElementById('roi-value-lbl-3'),\n          ];\n          const steps = [0, 1/3, 2/3, 1];\n          labels.forEach((el, i) => {\n            if (!el) return;\n            const v = cfg.valueMin + (cfg.valueMax - cfg.valueMin) * steps[i];\n            if (v >= 1000) {\n              el.textContent = Math.round(v / 1000) + 'k';\n            } else {\n              el.textContent = Math.round(v);\n            }\n          });\n          // Update currency labels\n          if (monthlyCurEl) monthlyCurEl.textContent = cfg.symbol;\n          if (currencyLabel) currencyLabel.textContent = cfg.symbol;\n        }\n\n        /* ── Constants ── */\n        const CONVERSION = 0.5;\n        const WORKDAYS = 22;\n\n        /* ── Main recalc ── */\n        function recalc() {\n          const lang = window.currentLang || document.documentElement.lang || 'hu';\n          const cfg  = CURRENCY_CONFIG[lang] || CURRENCY_CONFIG.hu;\n\n          updateFill(calls);\n          updateFill(missed);\n          updateFill(valueSlider);\n\n          const c = +calls.value, m = +missed.value / 100, v = +valueSlider.value;\n          cV.textContent = c;\n          mV.textContent = missed.value;\n          vV.textContent = formatNum(v, cfg.locale);\n\n          const recoveredPerDay = c * m;\n          const newBookingsPerMonth = recoveredPerDay * WORKDAYS * CONVERSION;\n          const monthlyRevenue = newBookingsPerMonth * v;\n          const yearlyRevenue  = monthlyRevenue * 12;\n\n          monthlyEl.textContent  = formatNum(monthlyRevenue, cfg.locale);\n          if (monthlyCurEl) monthlyCurEl.textContent = cfg.symbol;\n          yearlyEl.textContent   = formatNum(yearlyRevenue, cfg.locale) + ' ' + cfg.symbol;\n          bookingsEl.textContent = Math.round(newBookingsPerMonth);\n        }\n\n        /* ── Switch currency when language changes ── */\n        function switchCurrency() {\n          const lang = window.currentLang || document.documentElement.lang || 'hu';\n          const cfg  = CURRENCY_CONFIG[lang] || CURRENCY_CONFIG.hu;\n          updateSliderRange(cfg);\n          recalc();\n        }\n\n        // Expose switchCurrency globally so switchLang can call it\n        window.roiSwitchCurrency = switchCurrency;\n\n        // Also watch for lang attribute changes as backup\n        const _htmlEl = document.documentElement;\n        const _langObs = new MutationObserver(function(mutations) {\n          mutations.forEach(function(m) {\n            if (m.attributeName === 'lang') switchCurrency();\n          });\n        });\n        _langObs.observe(_htmlEl, { attributes: true });\n\n        /* ── Init ── */\n        [calls, missed, valueSlider].forEach(el => el.addEventListener('input', recalc));\n\n        // Init immediately, then refresh after rates load\n        switchCurrency();\n        fetchRates().then(() => {\n          switchCurrency();\n        });\n      })();\n    <\u002Fscript>\n  <\u002Fsection>\n\n  <!-- Capabilities Section: What Anna Can Do -->\n  <section id=\"capabilities\" class=\"py-16 lg:py-24 bg-slate-50 relative overflow-hidden\">\n    <!-- Decorative glow elements -->\n    <div class=\"cap-glow w-72 h-72 bg-dental-200/20 -top-10 -left-36\" style=\"position:absolute\"><\u002Fdiv>\n    <div class=\"cap-glow w-56 h-56 bg-emerald-200/20 -bottom-10 -right-28\" style=\"position:absolute\"><\u002Fdiv>\n    <div class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10\">\n      <!-- Section Header -->\n      <div class=\"text-center max-w-2xl mx-auto mb-16\">\n        <span class=\"text-xs font-semibold tracking-widest uppercase text-dental-500\" data-i18n=\"cap-sub\">Anna képességei<\u002Fspan>\n        <h2 class=\"mt-3 text-3xl sm:text-4xl font-bold text-slate-900 tracking-tight\" data-i18n=\"cap-title\">Mindent tud, amit egy recepciósnak tudnia kell<\u002Fh2>\n        <p class=\"mt-4 text-base text-slate-500 leading-relaxed\" data-i18n=\"cap-desc\">A foglalástól a lemondáson át a várólistáig — Anna önállóan, valós időben kezeli a teljes pácienskommunikációt telefonon. Minden funkció az összes támogatott nyelven elérhető.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- 8 Capability Cards — 4×2 grid matching How-it-works style -->\n      <div class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 lg:gap-8\">\n\n        <!-- Cap 1: Szabad időpontok keresése -->\n        <div class=\"step-animate group\">\n          <div class=\"bg-slate-50 rounded-3xl border border-slate-200/80 p-7 h-full shadow-sm hover:shadow-xl hover:border-dental-200/80 transition-all duration-300 relative overflow-hidden\">\n            <div class=\"absolute top-0 right-0 w-24 h-24 bg-dental-50 rounded-bl-[3rem] -z-0\"><\u002Fdiv>\n            <div class=\"relative z-10\">\n              <div class=\"w-14 h-14 rounded-2xl bg-gradient-to-br from-dental-500 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-dental-500/25 mb-5\">\n                <svg class=\"w-7 h-7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"flex items-center gap-2 mb-3\">\n                <span class=\"step-num bg-gradient-to-br from-dental-50 to-dental-100 text-dental-700 ring-1 ring-dental-200/60\">1<\u002Fspan>\n                <h3 class=\"text-lg font-bold text-slate-900\" data-i18n=\"cap1-title\">Szabad időpontok<\u002Fh3>\n              <\u002Fdiv>\n              <p class=\"text-sm text-slate-500 leading-relaxed\" data-i18n=\"cap1-desc\">Anna valós időben keresi a szabad helyeket a Google Naptárban — megadott napra, napszakra vagy orvosra szűrve. A páciens azonnal választ kaphat.<\u002Fp>\n              <div class=\"mt-4 flex flex-wrap items-center gap-2\">\n                <span class=\"inline-flex items-center gap-1.5 bg-dental-50 text-dental-700 text-[11px] font-semibold px-2.5 py-1.5 rounded-lg whitespace-nowrap\">\n                  <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5\"><\u002Fpath><\u002Fsvg>\n                  <span>Google Calendar<\u002Fspan>\n                <\u002Fspan>\n                <span class=\"inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 text-[11px] font-semibold px-2.5 py-1.5 rounded-lg whitespace-nowrap\">\n                  <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z\"><\u002Fpath><\u002Fsvg>\n                  <span data-i18n=\"cap1-tag2\">Valós idejű<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Cap 2: Időpont foglalás -->\n        <div class=\"step-animate group\">\n          <div class=\"bg-white rounded-3xl border border-slate-200/80 p-7 h-full shadow-sm hover:shadow-xl hover:border-emerald-200/80 transition-all duration-300 relative overflow-hidden\">\n            <div class=\"absolute top-0 right-0 w-24 h-24 bg-emerald-50 rounded-bl-[3rem] -z-0\"><\u002Fdiv>\n            <div class=\"relative z-10\">\n              <div class=\"w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white shadow-lg shadow-emerald-500/25 mb-5\">\n                <svg class=\"w-7 h-7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"flex items-center gap-2 mb-3\">\n                <span class=\"step-num bg-gradient-to-br from-emerald-50 to-emerald-100 text-emerald-700 ring-1 ring-emerald-200/60\">2<\u002Fspan>\n                <h3 class=\"text-lg font-bold text-slate-900\" data-i18n=\"cap2-title\">Időpontfoglalás<\u002Fh3>\n              <\u002Fdiv>\n              <p class=\"text-sm text-slate-500 leading-relaxed\" data-i18n=\"cap2-desc\">A páciens nevének, e-mail-címének és a kívánt időpont megadásával Anna rögzíti a foglalást a naptárban, és azonnal küld egy visszaigazoló SMS-t és e-mailt.<\u002Fp>\n              <div class=\"mt-4 flex flex-wrap items-center gap-2\">\n                <span class=\"inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 text-[11px] font-semibold px-2.5 py-1.5 rounded-lg whitespace-nowrap\">\n                  <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z\"><\u002Fpath><\u002Fsvg>\n                  <span data-i18n=\"cap2-tag1\">Visszaigazolás<\u002Fspan>\n                <\u002Fspan>\n                <span class=\"inline-flex items-center gap-1.5 bg-dental-50 text-dental-700 text-[11px] font-semibold px-2.5 py-1.5 rounded-lg whitespace-nowrap\">\n                  <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3\"><\u002Fpath><\u002Fsvg>\n                  <span>SMS + e-mail<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Cap 3: Időpont módosítás -->\n        <div class=\"step-animate group\">\n          <div class=\"bg-white rounded-3xl border border-slate-200/80 p-7 h-full shadow-sm hover:shadow-xl hover:border-violet-200/80 transition-all duration-300 relative overflow-hidden\">\n            <div class=\"absolute top-0 right-0 w-24 h-24 bg-violet-50 rounded-bl-[3rem] -z-0\"><\u002Fdiv>\n            <div class=\"relative z-10\">\n              <div class=\"w-14 h-14 rounded-2xl bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-violet-500/25 mb-5\">\n                <svg class=\"w-7 h-7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"flex items-center gap-2 mb-3\">\n                <span class=\"step-num bg-gradient-to-br from-violet-50 to-violet-100 text-violet-700 ring-1 ring-violet-200/60\">3<\u002Fspan>\n                <h3 class=\"text-lg font-bold text-slate-900\" data-i18n=\"cap3-title\">Időpontmódosítás<\u002Fh3>\n              <\u002Fdiv>\n              <p class=\"text-sm text-slate-500 leading-relaxed\" data-i18n=\"cap3-desc\">Ha a páciens másik időpontot kér, Anna törli a régit és lefoglalja az újat — ellenőrzi a naptárban az új időpont elérhetőségét is, hogy ne ütközzön semmivel.<\u002Fp>\n              <div class=\"mt-4 flex flex-wrap items-center gap-2\">\n                <span class=\"inline-flex items-center gap-1.5 bg-violet-50 text-violet-700 text-[11px] font-semibold px-2.5 py-1.5 rounded-lg whitespace-nowrap\">\n                  <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182\"><\u002Fpath><\u002Fsvg>\n                  <span data-i18n=\"cap3-tag1\">Régi → Új<\u002Fspan>\n                <\u002Fspan>\n                <span class=\"inline-flex items-center gap-1.5 bg-dental-50 text-dental-700 text-[11px] font-semibold px-2.5 py-1.5 rounded-lg whitespace-nowrap\">\n                  <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z\"><\u002Fpath><\u002Fsvg>\n                  <span data-i18n=\"cap3-tag2\">Ellenőrzött<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Cap 4: Időpont lemondás -->\n        <div class=\"step-animate group\">\n          <div class=\"bg-white rounded-3xl border border-slate-200/80 p-7 h-full shadow-sm hover:shadow-xl hover:border-red-200/80 transition-all duration-300 relative overflow-hidden\">\n            <div class=\"absolute top-0 right-0 w-24 h-24 bg-red-50 rounded-bl-[3rem] -z-0\"><\u002Fdiv>\n            <div class=\"relative z-10\">\n              <div class=\"w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-white shadow-lg shadow-amber-500/25 mb-5\">\n                <svg class=\"w-7 h-7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M6 18L18 6M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"flex items-center gap-2 mb-3\">\n                <span class=\"step-num bg-gradient-to-br from-amber-50 to-amber-100 text-amber-700 ring-1 ring-amber-200/60\">4<\u002Fspan>\n                <h3 class=\"text-lg font-bold text-slate-900\" data-i18n=\"cap4-title\">Időpontlemondás<\u002Fh3>\n              <\u002Fdiv>\n              <p class=\"text-sm text-slate-500 leading-relaxed\" data-i18n=\"cap4-desc\">A páciens megerősítheti a lemondást — Anna eltávolítja az eseményt a naptárból, és lemondást visszaigazoló SMS-t és e-mailt küld a megfelelő nyelven.<\u002Fp>\n              <div class=\"mt-4 flex flex-wrap items-center gap-2\">\n                <span class=\"inline-flex items-center gap-1.5 bg-amber-50 text-amber-700 text-[11px] font-semibold px-2.5 py-1.5 rounded-lg whitespace-nowrap\">\n                  <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0\"><\u002Fpath><\u002Fsvg>\n                  <span data-i18n=\"cap4-tag1\">Értesítés<\u002Fspan>\n                <\u002Fspan>\n                <span class=\"inline-flex items-center gap-1.5 bg-dental-50 text-dental-700 text-[11px] font-semibold px-2.5 py-1.5 rounded-lg whitespace-nowrap\">\n                  <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5\"><\u002Fpath><\u002Fsvg>\n                  <span data-i18n=\"cap4-tag2\">Naptárfrissítés<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Cap 5: Meglévő időpontok lekérdezése -->\n        <div class=\"step-animate group\">\n          <div class=\"bg-white rounded-3xl border border-slate-200/80 p-7 h-full shadow-sm hover:shadow-xl hover:border-dental-200/80 transition-all duration-300 relative overflow-hidden\">\n            <div class=\"absolute top-0 right-0 w-24 h-24 bg-blue-50 rounded-bl-[3rem] -z-0\"><\u002Fdiv>\n            <div class=\"relative z-10\">\n              <div class=\"w-14 h-14 rounded-2xl bg-gradient-to-br from-dental-500 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-dental-500/25 mb-5\">\n                <svg class=\"w-7 h-7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 010 3.75H5.625a1.875 1.875 0 010-3.75z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"flex items-center gap-2 mb-3\">\n                <span class=\"step-num bg-gradient-to-br from-dental-50 to-dental-100 text-dental-700 ring-1 ring-dental-200/60\">5<\u002Fspan>\n                <h3 class=\"text-lg font-bold text-slate-900\" data-i18n=\"cap5-title\">Időpontok lekérdezése<\u002Fh3>\n              <\u002Fdiv>\n              <p class=\"text-sm text-slate-500 leading-relaxed\" data-i18n=\"cap5-desc\">Ha a páciens nem emlékszik a foglalására, Anna telefon vagy e-mail alapján lekéri a jövőbeli időpontokat, és felolvassa őket a módosítás vagy lemondás megkönnyítéséhez.<\u002Fp>\n              <div class=\"mt-4 flex flex-wrap items-center gap-2\">\n                <span class=\"inline-flex items-center gap-1.5 bg-dental-50 text-dental-700 text-[11px] font-semibold px-2.5 py-1.5 rounded-lg whitespace-nowrap\">\n                  <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z\"><\u002Fpath><\u002Fsvg>\n .25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5\"><\u002Fpath><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9.75 12.75h4.5\"><\u002Fpath><\u002Fsvg><p class=\"text-sm font-semibold text-slate-600 mb-1\" data-i18n=\"cal-err-title\">A naptár jelenleg nem elérhető<\u002Fp><p class=\"text-xs text-slate-400 mb-3\" data-i18n=\"cal-err-desc\">Kérjük, próbálja újra később, vagy hívja Annát közvetlenül.<\u002Fp><button onclick=\"retryCalendar()\" class=\"text-xs font-semibold text-dental-600 hover:text-dental-700 bg-dental-50 hover:bg-dental-100 px-4 py-2 rounded-lg transition-colors\" data-i18n=\"cal-err-retry\">Újrapróbálkozás<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"bg-slate-50/60 border-t border-slate-200/60 px-6 py-3 flex items-center justify-between\">\n              <div class=\"flex items-center gap-2\"><span class=\"w-2 h-2 rounded-full bg-emerald-500 animate-pulse\"><\u002Fspan><span class=\"text-xs text-slate-500\" data-i18n=\"cal-auto\">Automatikus frissítés 30 másodpercenként<\u002Fspan><\u002Fdiv>\n              <button onclick=\"refreshCalendar()\" class=\"text-xs font-semibold text-dental-600 hover:text-dental-700 transition-colors flex items-center gap-1.5 bg-dental-50 hover:bg-dental-100 px-3 py-1.5 rounded-lg\"><svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182\"><\u002Fpath><\u002Fsvg><span data-i18n=\"cal-refresh\">Frissítés most<\u002Fspan><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ Section -->\n  <section id=\"faq\" class=\"bg-gradient-to-b from-white via-slate-50/60 to-white relative overflow-hidden\" style=\"padding-top:5rem;padding-bottom:5rem;\">\n    <div class=\"absolute inset-0 pointer-events-none\" aria-hidden=\"true\">\n      <div class=\"absolute top-10 left-1/2 -translate-x-1/2 w-[600px] h-[400px] bg-dental-100/30 rounded-full blur-3xl\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 relative\">\n      <div class=\"text-center max-w-2xl mx-auto mb-14\">\n        <div class=\"inline-flex items-center gap-2 bg-dental-50 border border-dental-200/60 rounded-full px-4 py-1.5 mb-5\">\n          <svg class=\"w-3.5 h-3.5 text-dental-600\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z\"><\u002Fpath><\u002Fsvg>\n          <span class=\"text-[11px] font-bold text-dental-700 tracking-widest uppercase\" data-i18n=\"faq-sub\">Gyakori kérdések<\u002Fspan>\n        <\u002Fdiv>\n        <h2 class=\"text-3xl sm:text-4xl lg:text-5xl font-extrabold text-slate-900 tracking-tight leading-[1.1]\" data-i18n=\"faq-title\">Minden, amit <span class=\"bg-gradient-to-r from-dental-600 to-blue-500 bg-clip-text text-transparent\">tudni szeretne<\u002Fspan><\u002Fh2>\n        <p class=\"mt-5 text-base text-slate-500 leading-relaxed max-w-lg mx-auto\" data-i18n=\"faq-desc\">A leggyakoribb kérdések és válaszok Annáról — ha nem találja amit keres, vegye fel velem a kapcsolatot!<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"space-y-3\" id=\"faq-list\">\n        <!-- FAQ 1 -->\n        <div class=\"faq-item bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden transition-all duration-300 hover:border-dental-200/80\">\n          <button class=\"faq-toggle w-full flex items-center justify-between gap-4 px-6 py-5 text-left focus:outline-none\" aria-expanded=\"false\">\n            <div class=\"flex items-center gap-3.5\">\n              <span class=\"flex-shrink-0 w-9 h-9 rounded-xl bg-dental-100 text-dental-600 flex items-center justify-center\">\n                <svg class=\"w-4.5 h-4.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <h3 class=\"font-semibold text-slate-800 text-sm sm:text-base\" data-i18n=\"faq1-q\">Működik a meglévő telefonszámomon?<\u002Fh3>\n            <\u002Fdiv>\n            <svg class=\"faq-chevron w-5 h-5 text-slate-400 flex-shrink-0 transition-transform duration-300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M19 9l-7 7-7-7\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <div class=\"faq-answer max-h-0 overflow-hidden transition-all duration-300 ease-in-out\">\n            <div class=\"px-6 pb-5 pt-0\">\n              <div class=\"pl-[52px]\">\n                <p class=\"text-sm text-slate-500 leading-relaxed\" data-i18n=\"faq1-a\">Igen! Anna a meglévő telefonszámára érkező hívásokat veszi fel — nincs szükség új számra, szolgáltatóváltásra vagy extra eszközre. A rendszer zökkenőmentesen integrálható a jelenlegi telefonvonalával, így a páciensek ugyanazon a számon hívhatják Önt, amit eddig is ismertek. A beállítás mindössze néhány percet vesz igénybe.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- FAQ 7 -->\n        <div class=\"faq-item bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden transition-all duration-300 hover:border-dental-200/80\">\n          <button class=\"faq-toggle w-full flex items-center justify-between gap-4 px-6 py-5 text-left focus:outline-none\" aria-expanded=\"false\">\n            <div class=\"flex items-center gap-3.5\">\n              <span class=\"flex-shrink-0 w-9 h-9 rounded-xl bg-violet-100 text-violet-700 flex items-center justify-center\">\n                <svg class=\"w-4.5 h-4.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <h3 class=\"font-semibold text-slate-800 text-sm sm:text-base\" data-i18n=\"faq7-q\">Hogyan kerül Anna egy telefonszámra?<\u002Fh3>\n            <\u002Fdiv>\n            <svg class=\"faq-chevron w-5 h-5 text-slate-400 flex-shrink-0 transition-transform duration-300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M19 9l-7 7-7-7\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <div class=\"faq-answer max-h-0 overflow-hidden transition-all duration-300 ease-in-out\">\n            <div class=\"px-6 pb-5 pt-0\">\n              <div class=\"pl-[52px]\">\n                <p class=\"text-sm text-slate-500 leading-relaxed\" data-i18n=\"faq7-a\">Két fő megközelítés használható. Új szám kiosztása: Twilio-tól vagy más VoIP-szolgáltatótól (pl. magyar SIP-trunk: Hipernet, Voipgate) vásárolható egy telefonszám, amely közvetlenül az ElevenLabs Conversational AI Agentre van irányítva — Twilio integrációval ez néhány óra alatt beüzemelhető. Meglévő szám átirányítása: a rendelő mostani számán beállítható időszakos átirányítás (pl. csak munkaidőn kívül vagy foglalt vonal esetén), így Anna csak akkor fogadja a hívást, amikor a recepció nem elérhető. A pontos beállítás minden rendelő infrastruktúrájához egyedileg igazítható.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- FAQ 2 -->\n        <div class=\"faq-item bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden transition-all duration-300 hover:border-dental-200/80\">\n          <button class=\"faq-toggle w-full flex items-center justify-between gap-4 px-6 py-5 text-left focus:outline-none\" aria-expanded=\"false\">\n            <div class=\"flex items-center gap-3.5\">\n              <span class=\"flex-shrink-0 w-9 h-9 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center\">\n                <svg class=\"w-4.5 h-4.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <h3 class=\"font-semibold text-slate-800 text-sm sm:text-base\" data-i18n=\"faq2-q\">Mi van, ha az AI nem tud válaszolni?<\u002Fh3>\n            <\u002Fdiv>\n            <svg class=\"faq-chevron w-5 h-5 text-slate-400 flex-shrink-0 transition-transform duration-300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M19 9l-7 7-7-7\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <div class=\"faq-answer max-h-0 overflow-hidden transition-all duration-300 ease-in-out\">\n            <div class=\"px-6 pb-5 pt-0\">\n              <div class=\"pl-[52px]\">\n                <p class=\"text-sm text-slate-500 leading-relaxed\" data-i18n=\"faq2-a\">Ha Anna olyan kérdést kap, amelyre nincs felkészítve (pl. egyedi orvosi kérdés, panaszkezelés, komplex árajánlat), automatikusan értesíti a rendelő recepcióját a visszahívásról — feljegyzi a páciens adatait és a kérés részleteit, hogy a recepciós a lehető leghamarabb visszakeresi a pácienst. Ha a rendelő zárva van, Anna jegyzetet készít a kérésről, és a következő munkanapon a recepciós felkeresi a pácienst. A páciens sosem marad válasz nélkül.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- FAQ 4 -->\n        <div class=\"faq-item bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden transition-all duration-300 hover:border-dental-200/80\">\n          <button class=\"faq-toggle w-full flex items-center justify-between gap-4 px-6 py-5 text-left focus:outline-none\" aria-expanded=\"false\">\n            <div class=\"flex items-center gap-3.5\">\n              <span class=\"flex-shrink-0 w-9 h-9 rounded-xl bg-violet-100 text-violet-600 flex items-center justify-center\">\n                <svg class=\"w-4.5 h-4.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <h3 class=\"font-semibold text-slate-800 text-sm sm:text-base\" data-i18n=\"faq4-q\">Milyen nyelveken beszél?<\u002Fh3>\n            <\u002Fdiv>\n            <svg class=\"faq-chevron w-5 h-5 text-slate-400 flex-shrink-0 transition-transform duration-300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M19 9l-7 7-7-7\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <div class=\"faq-answer max-h-0 overflow-hidden transition-all duration-300 ease-in-out\">\n            <div class=\"px-6 pb-5 pt-0\">\n              <div class=\"pl-[52px]\">\n                <p class=\"text-sm text-slate-500 leading-relaxed\" data-i18n=\"faq4-a\">Jelenleg tizenegy nyelven kommunikál folyékonyan: magyarul, angolul, németül, hollandul, franciául, olaszul, dánul, norvégul, svédül, finnül és szlovákul. A nyelvválasztás automatikus — Anna felismeri a páciens nyelvét, és azon válaszol. Ez különösen értékes a turisztikailag frekventált régiókban, ahol külföldi páciensek is gyakran hívják a rendelőt.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- FAQ 5 -->\n        <div class=\"faq-item bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden transition-all duration-300 hover:border-dental-200/80\">\n          <button class=\"faq-toggle w-full flex items-center justify-between gap-4 px-6 py-5 text-left focus:outline-none\" aria-expanded=\"false\">\n            <div class=\"flex items-center gap-3.5\">\n              <span class=\"flex-shrink-0 w-9 h-9 rounded-xl bg-red-100 text-red-600 flex items-center justify-center\">\n                <svg class=\"w-4.5 h-4.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <h3 class=\"font-semibold text-slate-800 text-sm sm:text-base\" data-i18n=\"faq5-q\">Hogyan kezeli a sürgős eseteket?<\u002Fh3>\n            <\u002Fdiv>\n            <svg class=\"faq-chevron w-5 h-5 text-slate-400 flex-shrink-0 transition-transform duration-300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M19 9l-7 7-7-7\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <div class=\"faq-answer max-h-0 overflow-hidden transition-all duration-300 ease-in-out\">\n            <div class=\"px-6 pb-5 pt-0\">\n              <div class=\"pl-[52px]\">\n                <p class=\"text-sm text-slate-500 leading-relaxed\" data-i18n=\"faq5-a\">Sürgős helyzetben — például erős fogfájás, trauma vagy vérzés esetén — Anna azonnal prioritást ad a hívásnak. Felismeri a sürgősségi kulcsszavakat, és a lehető leggyorsabban aznapi időpontot keres a páciensnek. Valódi vészhelyzet esetén (pl. állcsonttörés, kontrollálhatatlan vérzés) a legközelebbi sürgősségi ellátásra irányítja a pácienst. A sürgős hívások sosem kerülnek véletlenül rutinfoglalásnak.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- FAQ 6 -->\n        <div class=\"faq-item bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden transition-all duration-300 hover:border-dental-200/80\">\n          <button class=\"faq-toggle w-full flex items-center justify-between gap-4 px-6 py-5 text-left focus:outline-none\" aria-expanded=\"false\">\n            <div class=\"flex items-center gap-3.5\">\n              <span class=\"flex-shrink-0 w-9 h-9 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center\">\n                <svg class=\"w-4.5 h-4.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <h3 class=\"font-semibold text-slate-800 text-sm sm:text-base\" data-i18n=\"faq6-q\">Hogyan kezeli az adatvédelmet (GDPR)?<\u002Fh3>\n            <\u002Fdiv>\n            <svg class=\"faq-chevron w-5 h-5 text-slate-400 flex-shrink-0 transition-transform duration-300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M19 9l-7 7-7-7\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <div class=\"faq-answer max-h-0 overflow-hidden transition-all duration-300 ease-in-out\">\n            <div class=\"px-6 pb-5 pt-0\">\n              <div class=\"pl-[52px]\">\n                <p class=\"text-sm text-slate-500 leading-relaxed\" data-i18n=\"faq6-a\">Anna a GDPR követelményeit szem előtt tartva készült, de fontos átláthatóan tájékoztatni a használt szolgáltatókról. A weboldal és az API-forgalom a Cloudflare CDN-en keresztül megy, a hangfeldolgozást pedig az ElevenLabs biztosítja — mindkettő USA-beli szolgáltató, amelyek Standard Szerződési Klauzulákkal (SCC) és adatfeldolgozási megállapodással (DPA) működnek, ennek ellenére az adatok EGT-n kívüli harmadik országba (USA) is továbbításra kerülhetnek. Élesítés előtt minden rendelőnek saját DPA-t kell kötnie a szolgáltatókkal, az adatkezelési tájékoztatójában fel kell tüntetnie az adattovábbítás tényét és jogalapját, valamint javasolt adatvédelmi hatásvizsgálat (DPIA) készítése. Egészségügyi panaszok részletezéséhez (különleges adat, GDPR 9. cikk (2) a) pont) külön kifejezett hozzájárulás szükséges. Éles bevezetés előtt minden esetben javasolt adatvédelmi szakértővel/jogásszal egyeztetni.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- FAQ 8 -->\n        <div class=\"faq-item bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden transition-all duration-300 hover:border-dental-200/80\">\n          <button class=\"faq-toggle w-full flex items-center justify-between gap-4 px-6 py-5 text-left focus:outline-none\" aria-expanded=\"false\">\n            <div class=\"flex items-center gap-3.5\">\n              <span class=\"flex-shrink-0 w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center\">\n                <svg class=\"w-4.5 h-4.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <h3 class=\"font-semibold text-slate-800 text-sm sm:text-base\" data-i18n=\"faq8-q\">Hogyan történik a beleegyezés a telefonhívásnál?<\u002Fh3>\n            <\u002Fdiv>\n            <svg class=\"faq-chevron w-5 h-5 text-slate-400 flex-shrink-0 transition-transform duration-300\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M19 9l-7 7-7-7\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <div class=\"faq-answer max-h-0 overflow-hidden transition-all duration-300 ease-in-out\">\n            <div class=\"px-6 pb-5 pt-0\">\n              <div class=\"pl-[52px]\">\n                <p class=\"text-sm text-slate-500 leading-relaxed\" data-i18n=\"faq8-a\">A hívás fogadásakor Anna első mondatában tájékoztatja a hívót: AI-asszisztens beszél, a hívás minőségbiztosítás céljából rögzíthető, és bármikor kérheti egy élő munkatárs visszahívását (kérésre Anna visszahívást szervez). Ha a páciens folytatja a beszélgetést, az ráutaló magatartással történő hozzájárulásnak minősül (GDPR 6. cikk (1) a) és b) pontok). Egészségügyi panaszok részletezésénél (pl. fájdalom, gyógyszer) további kifejezett megerősítés szükséges. A hozzájárulás tényét és időpontját a rendszer naplózza.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002F b',\n        'flow-2': 'Igényfelmérés',\n        'flow-3': 'Naptár-szinkron',\n        'flow-4': 'Visszaigazolás',\n        'flow-done': 'Kész!',\n        'why-sub': 'Miért Anna?',\n        'why-title': 'Felszabadult recepciós kapacitás — azonnal',\n        'why-desc': 'Anna nem helyettesíti a recepcióst — átvállalja a repetitív feladatokat, hogy a csapata a valóban fontos dolgokra koncentrálhasson.',\n        'ben1-title': 'Nincs több elveszett hívás',\n        'ben1-desc': 'Anna éjjel-nappal fogadja a hívásokat — étkezési szünetben, hétvégén és ünnepnapokon is. Minden páciens beszélhet valakivel, aki azonnal segít.',\n        'ben2-title': 'Felszabadult recepciós kapacitás',\n        'ben2-desc': 'A recepciós a személyes találkozókra, a páciens-kommunikációra és az értékesítésre fókuszálhat — Anna elvégzi a rutinfeladatokat a háttérben.',\n        'ben3-title': 'Tizenegy nyelven, egy hangon',\n        'ben3-desc': 'Magyarul, angolul, németül, hollandul, franciául, olaszul, dánul, norvégul, svédül, finnül és szlovákul egyaránt folyékonyan kommunikál — a külföldi páciensek is otthon érzik magukat a praxisban.',\n        'clinic-sub': 'Rendelő információk',\n        'clinic-title': 'A rendelő részletei',\n        'clinic-desc': 'Anna ismeri a rendelő minden fontos adatát — a nyitvatartástól a kezelések időtartamáig.',\n        'clinic-details-title': 'Rendelő adatok',\n        'clinic-location-label': 'Helyszín',\n        'clinic-location-value': 'Budapest, V. kerület, Belváros',\n        'clinic-hours-label': 'Nyitvatartás',\n        'clinic-hours-value': 'Hétfő–Péntek 08:00–18:00',\n        'clinic-closed-label': 'Zárva',\n        'clinic-closed-value': 'Szombat, Vasárnap és ünnepnapok',\n        'clinic-doctors-label': 'Orvosok',\n        'clinic-doctors-value': 'Dr. Kovács és Dr. Nagy',\n        'clinic-treatments-title': 'Kezelések és időtartam',\n        'clinic-treatments-note': '30 perces sávrácson',\n        'treat1-name': 'Vizsgálat / Konzultáció',\n
