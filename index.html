Din mening er vigtig for os: venligst del dine erfaringer gennem et kort spørgeskema, således at vi kan hæve niveauet på vores behandling endnu mere.',\n        'care2-email-cta': '→ Udfyld spørgeskemaet',\n        'care-stat1-value': '~40%',\n        'care-stat1-label': 'Færre glemte tider takket være påmindelser',\n        'care-stat2-value': '0',\n        'care-stat2-label': 'Håndarbejde og fuldt automatiseret proces',\n        'care-stat3-value': '24t',\n        'care-stat3-label': 'Feedback efter behandling',\n        'flow-1': 'Indkommende samtale/Net',\n        'flow-2': 'Behovskortlægning',\n        'flow-3': 'Kalendersynk',\n        'flow-4': 'Bekræftelse',\n        'flow-done': 'Færdig!',\n        'why-sub': 'Hvorfor Anna?',\n        'why-title': 'Frigjort receptionskapacitet — øjeblikkeligt',\n        'why-desc': 'Anna erstatter ikke receptionen — hun tager sig af de gentagne opgaver, således at dit team kan fokusere på det der virkelig betyder noget.',\n        'ben1-title': 'Aldrig flere ubesvarede opkald',\n        'ben1-desc': 'Anna tager imod samtaler dag og nat — i frokosten, i weekender og på helligdage. Hver patient får snakke med nogen der hjælper øjeblikkeligt.',\n        'ben2-title': 'Frigjort receptionskapacitet',\n        'ben2-desc': 'Receptionen kan fokusere på personlige møder, patientkommunikation og salg — Anna tager sig af rutineopgaverne i baggrunden.',\n        'ben3-title': 'På elleve sprog, med én stemme',\n        'ben3-desc': 'Anna kommunikerer lige så flydende på dansk, norsk, svensk, finsk, engelsk, tysk, nederlandsk, fransk, italiensk, slovakisk og ungarsk — udenlandske patienter føler sig også hjemme i praksissen.',\n        'clinic-sub': 'Klinikinformation',\n        'clinic-title': 'Klinikdetaljer',\n        'clinic-desc': 'Anna kender alle vigtige oplysninger om klinikken — fra åbningstider til behandlingsvarighed.',\n        'clinic-details-title': 'Klinikdetaljer',\n        'clinic-location-label': 'Placering',\n        'clinic-location-value': 'Budapest, 5. distrikt, Indre by',\n        'clinic-hours-label': 'Åbningstider',\n        'clinic-hours-value': 'Mandag–Fredag 08:00–18:00',\n        'clinic-closed-label': 'Lukket',\n        'clinic-closed-value': 'Lørdag, søndag og helligdage',\n        'clinic-doctors-label': 'Læger',\n        'clinic-doctors-value': 'Dr. Kovács og Dr. Nagy',\n        'clinic-treatments-title': 'Behandlinger & Varighed',\n        'clinic-treatments-note': '30-minutters tidsblokke',\n        'treat1-name': 'Undersøgelse / Konsultation',\n        'treat1-dur': '30 min',\n        'treat2-name': 'Tandstensfjernelse',\n        'treat2-dur': '30 min',\n        'treat4-name': 'Fyldningsskift',\n        'treat4-dur': '45 min',\n        'treat5-name': 'Rodbehandling',\n        'treat5-dur': '90 min',\n        'treat6-name': 'Akutbehandling',\n        'treat6-dur': '60 min',\n\n        'social-sub': 'Social AutoPilot',\n        'social-title': 'Anna poster for dig',\n        'social-desc': 'Hver dag nyt AI-genereret indhold på Facebook og LinkedIn — både tekst og billeder, fuldt automatiseret.',\n        'social-card1-title': 'Automatisk indholdsoprettelse',\n        'social-card1-text': 'Hver dag skriver Anna et nyt fagligt opslag om de mest forskelligartede tandplejeemner — fra tandblegning til implantater, fra børnetandpleje til akut tandlægehjælp. AI\\'en vælger tilfældigt et emne og udarbejder derefter en formel, faglig tekst: overskrift, spørgsmål, 3–5 praktiske tips og en call-to-action. Ingen gentagelser, ingen generisk tone — hvert opslag er unikt og frisk.',\n        'social-card2-title': 'AI genererer billederne',\n        'social-card2-text': 'Til hvert opslag genererer Anna et professionelt billede med tandplejetema — rene, moderne klinikmiljøer, strålende smil og æstetiske behandlingsresultater. Billederne tilpasser sig automatisk opslagets emne, så dit Facebook- og LinkedIn-indhold forbliver visuelt tiltalende og konsistent, helt uden fotograf.',\n        'social-card2-tag2': 'Uden vandmærke',\n        'social-card3-title': 'Facebook og LinkedIn',\n        'social-card3-text': 'Anna poster samtidigt på begge platforme: med foto på Facebook-siden og med visuelt indhold på LinkedIn-virksomhedssiden. Opslagene vises øjeblikkeligt — uden behov for godkendelse. Hele processen kører via Make.com-automatiseringsmotoren, hvor Claude AI står for tekstforfatningen, og Pollinations genererer billederne.',\n        'social-benefit1-title': 'Tidsbesparelse',\n        'social-benefit1-text': 'Ingen grund til at skrive indhold, finde billeder eller poste — Anna klarer alt',\n        'social-benefit2-title': 'Konstant tilstedeværelse',\n        'social-benefit2-text': 'Dagligt friskt indhold sikrer, at din klinik aldrig fremstår inaktiv',\n        'social-benefit3-title': 'Voksende rækkevidde',\n        'social-benefit3-text': 'Regelmæssige opslag øger den organiske synlighed og tiltrækker nye patienter',\n        'social-benefit4-title': 'Faglig troværdighed',\n        'social-benefit4-text': 'Kvalitets- og informationsrigt indhold styrker din kliniks omdømme og bygger tillid',\n        'social-follow-fb': 'Følg på Facebook',\n        'social-follow-li': 'Følg på LinkedIn',\n        'footer-contact': 'Kontakt',\n        'faq-sub': 'Ofte stillede spørgsmål',\n        'faq-title': 'Alt du vil vide',\n        'faq-desc': 'De mest almindelige spørgsmål og svar om Anna — finder du ikke det du leder efter, så kontakt mig!',\n        'faq1-q': 'Fungerer det på mit eksisterende telefonnummer?',\n        'faq1-a': 'Ja! Anna tager imod samtaler på dit eksisterende telefonnummer — du behøver ikke nyt nummer, skifte udbyder eller ekstra udstyr. Systemet kan integreres problemfrit med din nuværende telefonlinje, således at patienterne ringer på samme nummer som de altid har brugt. Opsætningen tager kun få minutter.',\n        'faq2-q': 'Hvad hvis AI-en ikke kan svare?',\n        'faq2-a': 'Hvis Anna får et spørgsmål hun ikke er forberedt på (f.eks. specifikke medicinske spørgsmål, klagebehandling, komplekse pristilbud), giver hun automatisk praksisens reception besked om et tilbagekald — hun noterer patientens oplysninger og forespørgslens detaljer, så receptionen kan ringe patienten tilbage hurtigst muligt. Hvis praksissen er lukket, noterer Anna forespørgslen, og receptionen ringer patienten tilbage næste arbejdsdag. Patienten står aldrig uden svar.',\n        'faq3-q': 'Hvordan får man adgang til systemet?',\n        'faq3-a': 'Anna er foreløbigt tilgængelig som en portefølje-demo — udviklet af Peter Petor som privatperson, og er ikke kommercielt tilgængelig endnu. Hjemmesiden og samtale-demoen kan testes af alle, således at du som tandlæge, udvikler eller forretningsinteresseret kan få et overblik over hvordan det fungerer. Hvis du tænker på lancering eller et unikt samarbejde (pilotprogram, integration), venligst kontakt på info@dentai.me.',\n        'faq4-q': 'Hvilke sprog taler hun?',\n        'faq4-a': 'Foreløbigt kommunikerer hun flydende på elleve sprog: dansk, norsk, svensk, finsk, engelsk, tysk, nederlandsk, fransk, italiensk, slovakisk og ungarsk. Sprogvalget sker automatisk — Anna genkender patientens sprog og svarer på det. Dette er særligt værdifuldt i turistprægede områder hvor udenlandske patienter ofte ringer til praksissen.',\n        'faq5-a': 'I akutte situationer — for eksempel kraftig tandpine, traumer eller blødning — giver Anna øjeblikkeligt prioritet til samtalen. Hun genkender akut-nøgleord og forsøger at finde en tid samme dag så hurtigt som muligt. Ved virkelige nødsituationer (f.eks. kæbebrud, ukontrollerbar blødning) henviser hun patienten til den nærmeste skadestue. Akutte samtaler bliver aldrig fejlagtigt håndteret som rutinebestillinger.',\n        'faq6-q': 'Hvordan håndteres privatliv (GDPR)?',\n        'faq6-a': 'Anna er udviklet med GDPR-kravene i tankerne, men det er vigtigt at være åben om de tjenesteudbydere der bruges. Hjemmesiden og API-trafikken går via Cloudflare CDN, og talebehandlingen leveres af ElevenLabs — begge er USA-baserede udbydere der opererer med Standard Contractual Clauses (SCC) og databehandleraftaler (DPA), men data kan alligevel overføres til land udenfor EU/EOS (tredjelande, f.eks. USA). Før lancering skal hver praksis indgå sin egen DPA med udbyderne, oplyse dataoverførslen og dens retslige grundlag i privatlivspolitikken, og det anbefales at gennemføre en konsekvensanalyse vedrørende databeskyttelse (DPIA). For detaljerede sundhedsklager (specielle data, GDPR artikel 9) kræves særskilt samtykke. Før produktionslancering anbefales det altid at konsultere en privatlivsekspert/jurist.',\n        'faq7-q': 'Hvordan kobles Anna til et telefonnummer?',\n        'faq7-a': 'To hovedtilgange kan bruges. Nyt nummer: fra Twilio eller andre VoIP-udbydere kan man købe et telefonnummer der dirigeres direkte til ElevenLabs Conversational AI Agent — med Twilio-integration kan dette opsættes på få timer. Viderestilling af eksisterende nummer: på praksisens nuværende nummer kan man opsætte periodisk viderestilling (f.eks. kun uden for arbejdstid eller ved optaget linje), således at Anna kun tager samtalen når receptionen ikke er tilgængelig. Den præcise opsætning kan tilpasses hver praksis infrastruktur individuelt.',\n        'faq8-q': 'Hvordan gives samtykke ved telefonsamtaler?',\n        'faq8-a': 'Ved samtaleopkobling informerer Anna i sin første sætning den der ringer: en AI-assistent taler, samtalen kan blive registreret til kvalitetssikring, og det er altid muligt at anmode om et tilbagekald fra en levende medarbejder (Anna arrangerer et tilbagekald efter anmodning). Hvis patienten fortsætter samtalen, anses dette som samtykke ved konkludent adfærd (GDPR artikel 6(1) a og b). Ved detaljerede sundhedsklager (f.eks. smerte, medicin) kræves yderligere eksplicit bekræftelse. Dokumentation for samtykket og tidspunkt logføres af systemet.',\n        'faq10-q': 'Hvad koster de løbende omkostninger?',\n        'faq10-a': '<p>Disse betales af praksissen direkte til tjenesteudbyderne. Beløbene kan variere afhængigt af trafik (antallet af samtaler og længde). Anna genererer desuden dagligt indhold til Facebook og LinkedIn.<\u002Fp><ul class=\"space-y-1.5 list-disc pl-5\"><li><strong class=\"text-slate-700\">Domænenavn:<\u002Fstrong> 60 – 150 kr / år<\u002Fli><li><strong class=\"text-slate-700\">Make.com (Logik & Automatisering):<\u002Fstrong> ca. 820 kr / år<\u002Fli><li><strong class=\"text-slate-700\">ElevenLabs (Stemme):<\u002Fstrong> 930 – 1 870 kr / år<\u002Fli><li><strong class=\"text-slate-700\">Twilio (SMS):<\u002Fstrong> 370 – 1 120 kr / år<\u002Fli><li><strong class=\"text-slate-700\">Cloudflare (Kode):<\u002Fstrong> 0 kr<\u002Fli><li><strong class=\"text-slate-700\">Hosting:<\u002Fstrong> 0 – 280 kr / år<\u002Fli><li><strong class=\"text-slate-700\">Claude AI (Tekstgenerering):<\u002Fstrong> ca. 37 kr / år<\u002Fli><li><strong class=\"text-slate-700\">Pollinations AI (Billedgenerering):<\u002Fstrong> 0 kr (gratis)<\u002Fli><\u002Ful><div class=\"bg-slate-50 rounded-xl px-4 py-2.5 border border-slate-200/60 -ml-1\"><p class=\"text-sm font-semibold text-slate-800\">Totalt: <span class=\"text-dental-700\">ca. 2 230 – 4 280 kr / år<\u002Fspan><\u002Fp><\u002Fdiv><p class=\"text-xs text-slate-400 italic\">Vigtigt for praksissen: Længere samtaler betyder højere regning. Flere samtaler betyder højere regning. Flere SMS betyder højere regning. Dette er kun estimerede værdier.<\u002Fp>',\n\n        'demo-sub': 'Live demo',\n        'demo-title': 'Prøv Anna!',\n        'demo-desc': 'Tal med hende på telefon, eller tjek ledige tider i realtid — og oplev hvordan det er når intet glipper.',\n        'demo-what': 'Hvad du kan spørge Anna om',\n        'demo-what-sub': 'Bare tal naturligt — Anna forstår!',\n        'prompt1-title': 'Tidsbestilling',\n        'prompt1-text': '«Jeg vil gerne bestille et tandeftersyn til næste tirsdag kl. 14»',\n        'prompt2-title': 'Ændre tid', strong>Taledata (kun ved samtalestart):<\u002Fstrong> Lyd fra din mikrofon behandles midlertidigt for at generere samtalen (ElevenLabs). Venligst ikke del reelle personoplysninger!',\n        'priv-li2-3': '<strong>LocalStorage:<\u002Fstrong> I din browser gemmes en markering om at du har accepteret den juridiske erklæring — dette sendes ikke til nogen server.',\n        'priv-h3': '3. Tredjepartsudbydere (dataoverførsel til udlandet)',\n        'priv-p3': 'Hjemmesiden indlæser ressourcer fra følgende eksterne udbydere. Derved kan din IP-adresse og browserdata overføres til land udenfor EU/EOS (tredjelande, typisk USA), hvor den pågældende udbyders egne privatlivsregler gælder for databehandlingen:',\n        'priv-li3-1': '<strong>Cloudflare<\u002Fstrong> (CDN, hosting) — <a href=\"https://www.cloudflare.com/privacypolicy/\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">privacypolicy<\u002Fa>',\n        'priv-li3-2': '<strong>Google Fonts<\u002Fstrong> (skrifttyper) — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-li3-3': '<strong>Tailwind CDN<\u002Fstrong> (CSS-rammeværk)',\n        'priv-li3-4': '<strong>ElevenLabs<\u002Fstrong> (talebaseret AI) — <a href=\"https://elevenlabs.io/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">elevenlabs.io/privacy<\u002Fa>',\n        'priv-li3-5': '<strong>Google Kalender<\u002Fstrong> — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-h4': '4. Retsligt grundlag og varighed for databehandling',\n        'priv-p4': 'Det retslige grundlag for behandling af tekniske data er GDPR artikel 6(1) f (berettiget interesse — sikker hjemmesidedrift). Det retslige grundlag for talebaseret interaktion er samtykke (GDPR artikel 6(1) a), som gives i popup-vinduet før samtalen startes. Taledata gemmes ikke langsigtet.',\n        'priv-h5': '5. Dine rettigheder',\n        'priv-p5': 'Du har ret til indsigt, rettelse, sletning og indsigelse mod behandlingen af dine data. Ansøgningen kan sendes til info@dentai.me. Klager kan rettes til Datatilsynet.',\n        'priv-h6': '6. Ansvarsfraskrivelse',\n        'priv-p6': 'Dette er en portefølje-demo. Svarene genereret af AI anses ikke som medicinsk rådgivning. Den dataansvarlige påtager sig intet ansvar for data opgivet af brugeren eller for eventuelle skader der opstår fra AI-genererede svar.',\n        'priv-updated': 'Gældende fra: 26. april 2026.',\n        'modal-title': 'Samtykkeerklæring',\n        'modal-text': 'Opkaldet håndteres af kunstig intelligens (AI). Lyddata behandles under samtalen. Ved at starte opkaldet accepterer du, at AI genererer svar, og at samtalen ikke udgør lægelig rådgivning.',\n        'modal-checkbox': 'Jeg har læst og accepterer ovenstående meddelelse.',\n        'modal-cancel': 'Annuller',\n        'modal-accept': 'Jeg accepterer',\n\n        'cap-sub': 'Annas evner',\n        'cap-title': 'Alt, hvad en receptionist bør vide',\n        'cap-desc': 'Fra booking til afbestilling og venteliste — Anna håndterer selvstændigt og i realtid hele patientkommunikationen pr. telefon. Alle funktioner er tilgængelige på alle understøttede sprog.',\n        'cap1-title': 'Ledige tider',\n        'cap1-desc': 'Anna søger i realtid efter ledige tider i Google Kalender — filtreret efter dato, tidspunkt eller læge. Patienten får straks et udvalg.',\n        'cap1-tag2': 'Realtid',\n        'cap2-title': 'Tidsbestilling',\n        'cap2-desc': 'Ved at opgive patientens navn, e-mailadresse og ønsket tidspunkt registrerer Anna bookingen i kalenderen og sender straks en bekræftelses-SMS og -e-mail.',\n        'cap2-tag1': 'Bekræftelse',\n        'cap3-title': 'Ændring af tid',\n        'cap3-desc': 'Hvis patienten ønsker et andet tidspunkt, aflyser Anna den gamle og booker den nye — hun tjekker også kalenderen for det nye tidspunkts tilgængelighed, så der ikke opstår konflikter.',\n        'cap3-tag1': 'Gammel → Ny',\n        'cap3-tag2': 'Kontrolleret',\n        'cap4-title': 'Afbestilling af tid',\n        'cap4-desc': 'Patienten kan bekræfte afbestillingen — Anna fjerner begivenheden fra kalenderen og sender en bekræftelses-SMS og -e-mail for afbestillingen på det relevante sprog.',\n        'cap4-tag1': 'Notifikation',\n        'cap4-tag2': 'Kalenderopdatering',\n        'cap5-title': 'Tidsopslag',\n        'cap5-desc': 'Hvis patienten ikke kan huske sin booking, henter Anna fremtidige tider via telefon eller e-mail og læser dem op for at lette ændring eller afbestilling.',\n        'cap5-tag1': 'Søgning',\n        'cap5-tag2': 'Patientidentifikation',\n        'cap6-title': 'Venteliste',\n        'cap6-desc': 'Hvis der ikke er nogen ledig tid, skriver Anna patienten på prioritetsventelisten — med de foretrukne tidsrum. Når en plads bliver ledig, bliver patienten automatisk underrettet.',\n        'cap6-tag1': 'Prioritet',\n        'cap6-tag2': 'Automatisk underretning',\n        'cap7-title': 'Dataændring',\n        'cap7-desc': 'Hvis patienten har fået et nyt telefonnummer eller en ny e-mailadresse, opdaterer Anna dataene i systemet — baseret på den nuværende e-mailidentifikator med øjeblikkelig virkning.',\n        'cap7-tag1': 'Telefon / e-mail',\n        'cap7-tag2': 'Øjeblikkelig',\n        'cap8-title': 'Opkaldsoverførsel',\n        'cap8-desc': 'Hvis patienten ønsker at tale med en medarbejder, der opstår en teknisk fejl, eller Anna ikke kan svare, underretter hun automatisk receptionen om tilbageopkald — patienten bliver aldrig uden svar.',\n        'cap8-tag1': 'Tilbageopkald',\n        'cap8-tag2': 'Sikkerhedsnet',\n        'cap-stat1-label': 'Indbyggede værktøjer til patientkommunikation',\n        'cap-stat2-label': 'Sprog, der tales flydende',\n        'cap-stat3-label': ønsker en annen tid.',\n        'step3-tag1': 'Sanntid',\n        'step3-tag2': 'Bestilling/Endring',\n        'step4-title': 'Faglig informasjon',\n        'step4-desc': 'Anna svarer på spørsmål om behandlinger og praksisens drift, slik at pasienten får all informasjon som trengs for å ta en beslutning.',\n        'step4-tag1': 'E-post',\n        'step4-tag2': 'SMS',\n        'step4-tag3': 'Kalender',\n        'care-sub': 'Automatisk oppfølging',\n        'care-title': 'Til stede både før og etter timen',\n        'care-desc': 'Anna booker ikke bare — hun sørger for alt. Dagen før behandlingen sender hun en påminnelse, og dagen etter spør hun hvordan det gikk. Pasienten føler seg aldri glemt, og praksisen får tilbakemelding på kvaliteten i sanntid.',\n        'care1-title': 'SMS-påminnelse før timen',\n        'care1-subtitle': 'Automatisk — Uten menneskelig inngrep',\n        'care1-desc': 'Morgenen før behandlingen sender Anna automatisk en SMS til pasienten om den kommende timen, for å forhindre at den glemmes. Dette reduserer antall no-shows dramatisk, og frigjør resepsjonen fullstendig fra manuelle påminnelser.',\n        'care1-tag1': 'Twilio SMS',\n        'care1-tag2': 'Google Kalender',\n        'care1-tag3': 'Tidsstyrt',\n        'care1-step1-title': 'Tidsinnstilling: hver morgen',\n        'care1-step1-desc': 'Systemet sender påminnelses-SMS hver morgen for bookinger dagen etter',\n        'care1-step2-title': 'Kalendersøk',\n        'care1-step2-desc': 'Anna henter hendelsen fra Google Kalender og sjekker detaljene',\n        'care1-step3-title': 'SMS-sending (Twilio)',\n        'care1-step3-desc': 'Personlig påminnelses-SMS — navn, tidspunkt og sted inkludert',\n        'care1-sms-header': 'Påminnelse · timen i morgen',\n        'care1-sms-body': 'Påminnelse: din tannlegetime i morgen',\n        'care1-sms-arrival': 'Vennligst kom 10 minutter i forveien.',\n        'care1-sms-date': '📅 29.04.2026 · 10:00',\n        'care1-sms-footer': '— DentAi Assistent',\n        'care1-sms-preview': 'Kjære Jan Kovács! 👋',\n        'care2-title': 'Oppfølging etter behandling / spørreundersøkelse',\n        'care2-subtitle': 'Automatisk — Uten menneskelig inngrep',\n        'care2-desc': 'Dagen etter behandlingen sender Anna en kort spørreundersøkelse på e-post der pasienten kan vurdere tjenesten. Tilbakemeldingene loggføres automatisk, slik at praksisen kontinuerlig kan forbedre tjenestekvaliteten uten manuell dataregistrering.',\n        'care2-tag1': 'Gmail',\n        'care2-tag2': 'Statistikk',\n        'care2-tag3': 'Tidsstyrt',\n        'care2-step1-title': 'Tidsinnstilling: dagen etter behandling',\n        'care2-step1-desc': 'Dagen etter behandlingen sender systemet spørreundersøkelser på e-post til pasientene',\n        'care2-step2-title': 'Spørreundersøkelse på e-post (Gmail)',\n        'care2-step2-desc': 'Personlig e-post med lenke til spørreundersøkelse — tilfredshet, opplevelse, forslag',\n        'care2-step3-title': 'Statistisk loggføring',\n        'care2-step3-desc': 'Svarene registreres automatisk i Google Sheets statistikkside',\n        'care2-email-from': 'DentAi Assistent',\n        'care2-email-to': '→ jan.kovacs@epost.no',\n        'care2-email-subject': 'Tilbakemelding på undersøkelsen – DentAi',\n        'care2-email-body': 'Kjære Jan Kovács! Vi håper at dagens besøk gikk smidig. Din mening er viktig for oss: vennligst del dine erfaringer gjennom en kort spørreundersøkelse, slik at vi kan heve nivået på behandlingen vår enda mer.',\n        'care2-email-cta': '→ Fyll ut spørreundersøkelsen',\n        'care-stat1-value': '~40%',\n        'care-stat1-label': 'Færre glemte timer takket være påminnelser',\n        'care-stat2-value': '0',\n        'care-stat2-label': 'Håndarbeid og helt automatisert prosess',\n        'care-stat3-value': '24t',\n        'care-stat3-label': 'Tilbakemelding etter behandling',\n        'flow-1': 'Innkommende samtale/Nett',\n        'flow-2': 'Behovskartlegging',\n        'flow-3': 'Kalendersynk',\n        'flow-4': 'Bekreftelse',\n        'flow-done': 'Ferdig!',\n        'why-sub': 'Hvorfor Anna?',\n        'why-title': 'Frigjort resepsjonskapasitet — umiddelbart',\n        'why-desc': 'Anna erstatter ikke resepsjonen — hun tar seg av de repeterende oppgavene, slik at teamet ditt kan fokusere på det som virkelig betyr noe.',\n        'ben1-title': 'Aldri mer en tapt samtale',\n        'ben1-desc': 'Anna tar imot samtaler dag og natt — i lunsjen, i helger og på helligdager. Hver pasient får snakke med noen som hjelper umiddelbart.',\n        'ben2-title': 'Frigjort resepsjonskapasitet',\n        'ben2-desc': 'Resepsjonen kan fokusere på personlige møter, pasientkommunikasjon og salg — Anna tar seg av rutineoppgavene i bakgrunnen.',\n        'ben3-title': 'På elleve språk, med én stemme',\n        'ben3-desc': 'Anna kommuniserer like flytende på norsk, dansk, svensk, finsk, engelsk, tysk, nederlandsk, fransk, italiensk, slovakisk og ungarsk — utenlandske pasienter føler seg også hjemme i praksisen.',\n        'clinic-sub': 'Klinikk informasjon',\n        'clinic-title': 'Klinikkdetaljer',\n        'clinic-desc': 'Anna kjenner alle viktige opplysninger om klinikken — fra åpningstider til behandlingsvarighet.',\n        'clinic-details-title': 'Klinikkdetaljer',\n        'clinic-location-label': 'Beliggenhet',\n        'clinic-location-value': 'Budapest, distrikt V, Sentrum',\n        'clinic-hours-label': 'Åpningstider',\n        'clinic-hours-value': 'Mandag–Fredag 08:00–18:00',\n        'clinic-closed-label': 'Stengt',\n        'clinic-closed-value': 'Lørdag, søndag og helligdager',\n        'clinic-doctors-label': 'Leger',\n        'clinic-doctors-value': 'Dr. Kovács og Dr. Nagy',\n        'clinic-treatments-title': 'Behandlinger & Varighet',\n        'clinic-treatments-note': '30-minutters tidsblokker',\n        'treat1-name': 'Undersøkelse / Konsultasjon',\n        'treat1-dur': '30 min',\n        'treat2-name': 'Tannstensfjerning',\n        'treat2-dur': '30 min',\n        'treat4-name': 'Fyllingsskift',\n        'treat4-dur': '45 min',\n        'treat5-name': 'Rotbehandling',\n        'treat5-dur': '90 min',\n        'treat6-name': 'Akuttbehandling',\n        'treat6-dur': '60 min',\n\n        'faq-sub': 'Ofte stilte spørsmål',\n        'social-sub': 'Social AutoPilot',\n        'social-title': 'Anna poster for deg',\n        'social-desc': 'Hver dag nytt AI-generert innhold på Facebook og LinkedIn — både tekst og bilder, helt automatisert.',\n        'social-card1-title': 'Automatisk innholdsproduksjon',\n        'social-card1-text': 'Hver dag skriver Anna et nytt faglig innlegg om ulike tannbehandlingsemner — fra tannbleking til implantater, fra barnetannpleie til akuttbehandling. AI-en velger tilfeldig et emne og utarbeider deretter en formell, faglig tekst: overskrift, spørsmål, 3–5 praktiske tips og en call-to-action. Ingen gjentakelser, ingen generisk tone — hvert innlegg er unikt og ferskt.',\n        'social-card2-title': 'AI genererer bildene',\n        'social-card2-text': 'For hvert innlegg genererer Anna et profesjonelt tannbehandlingsrelatert bilde — rene, moderne klinikkmiljøer, strålende smil og estetiske behandlingsresultater. Bildene tilpasser seg automatisk innleggets emne, slik at Facebook- og LinkedIn-innholdet ditt forblir visuelt tiltalende og helhetlig, helt uten fotograf.',\n        'social-card2-tag2': 'Uten vannmerke',\n        'social-card3-title': 'Facebook og LinkedIn',\n        'social-card3-text': 'Anna poster samtidig på begge plattformer: med foto på Facebook-siden og med visuelt innhold på LinkedIn-bedriftssiden. Innleggene vises umiddelbart — uten behov for godkjenning. Hele prosessen kjøres via Make.com-automatiseringsmotoren, hvor Claude AI står for tekstforfattingen og Pollinations genererer bildene.',\n        'social-benefit1-title': 'Tidsbesparelse',\n        'social-benefit1-text': 'Ingen behov for å skrive innhold, finne bilder eller poste — Anna ordner alt',\n        'social-benefit2-title': 'Konstant tilstedeværelse',\n        'social-benefit2-text': 'Daglig ferskt innhold sikrer at klinikken din aldri fremstår som inaktiv',\n        'social-benefit3-title': 'Voksende rekkevidde',\n        'social-benefit3-text': 'Regelmessige innlegg øker organisk synlighet og tiltrekker nye pasienter',\n        'social-benefit4-title': 'Faglig troverdighet',\n        'social-benefit4-text': 'Kvalitets- og informasjonsrike innlegg styrker klinikkens omdømme og bygger tillit',\n        'social-follow-fb': 'Følg på Facebook',\n        'social-follow-li': 'Følg på LinkedIn',\n        'footer-contact': 'Kontakt',\n        'faq-title': 'Alt du vil vite',\n        'faq-desc': 'De vanligste spørsmålene og svarene om Anna — finner du ikke det du leter etter, ta kontakt med meg!',\n        'faq1-q': 'Fungerer det på mitt eksisterende telefonnummer?',\n        'faq1-a': 'Ja! Anna tar imot samtaler på ditt eksisterende telefonnummer — du trenger ikke nytt nummer, bytte leverandør eller ekstra utstyr. Systemet kan integreres sømløst med din nåværende telefonlinje, slik at pasientene ringer på samme nummer som de alltid har brukt. Oppsettet tar bare noen få minutter.',\n        'faq2-q': 'Hva hvis AI-en ikke kan svare?',\n        'faq2-a': 'Hvis Anna får et spørsmål hun ikke er forberedt på (f.eks. spesifikke medisinske spørsmål, klagehåndtering, komplekse pristilbud), gir hun automatisk praksisens resepsjon beskjed om et tilbakeringing — hun noterer pasientens opplysninger og forespørselens detaljer, slik at resepsjonen kan ringe pasienten tilbake så raskt som mulig. Hvis praksisen er stengt, noterer Anna forespørselen, og resepsjonen ringer pasienten tilbake neste arbeidsdag. Pasienten står aldri uten svar.',\n        'faq3-q': 'Hvordan får man tilgang til systemet?',\n        'faq3-a': 'Anna er foreløpig tilgjengelig som en portefølje-demo — utviklet av Peter Petor som privatperson, og er ikke kommersielt tilgjengelig ennå. Nettsiden og samtale-demoen kan testes av alle, slik at du som tannlege, utvikler eller forretningsinteressert kan få en oversikt over hvordan det fungerer. Hvis du tenker på lansering eller et unikt samarbeid (pilotprogram, integrasjon), vennligst ta kontakt på info@dentai.me.',\n        'faq4-q': 'Hvilke språk snakker hun?',\n        'faq4-a': 'Foreløpig kommuniserer hun flytende på elleve språk: norsk, dansk, svensk, finsk, engelsk, tysk, nederlandsk, fransk, italiensk, slovakisk og ungarsk. Språkvalget skjer automatisk — Anna gjenkjenner pasientens språk og svarer på det. Dette er spesielt verdifullt i turistområder der utenlandske pasienter ofte ringer praksisen.',\n        'faq5-a': 'I akutte situasjoner — for eksempel kraftig tannpine, tannskader eller blødning — gir Anna umiddelbart prioritet til samtalen. Hun gjenkjenner akutt-nøkkelord og forsøker å finne en time samme dag så raskt som mulig. Ved virkelige nødsituasjoner (f.eks. kjevebrudd, ukontrollerbar blødning) henviser hun pasienten til nærmeste akuttmottak. Akutte samtaler blir aldri feilaktig håndtert som rutinebestillinger.',\n        'faq6-q': 'Hvordan håndteres personvern (GDPR)?',\n        'faq6-a': 'Anna er utviklet med GDPR-kravene i tankene, men det er viktig å være åpen om tjenesteleverandørene som brukes. Nettsiden og API-trafikken går via Cloudflare CDN, og talebehandlingen leveres av ElevenLabs — begge er USA-baserte leverandører som opererer med Standard Contractual Clauses (SCC) og databehandleravtaler (DPA), men data kan likevel overføres til land utenfor EU/EØS (tredjeland, f.eks. USA). Før lansering må hver praksis inngå sin egen DPA med leverandørene, oppgi dataoverføringen og dens rettslige grunnlag i personvernerklæringen, og det anbefales å gjennomføre en vurdering av personvernkonsekvenser (DPIA). For detaljerte helseklager (spesielle data, GDPR artikkel 9) kreves eget samtykke. Før produksjonslansering anbefales det alltid å konsultere en personvernekspert/jurist.',\n        'faq7-q': 'Hvordan integreres Anna med et telefonnummer?',\n        'faq7-a': 'To hovedtilnærminger kan brukes. Nytt nummer: fra Twilio eller andre VoIP-leverandører kan man kjøpe et telefonnummer som dirigeres direkte til ElevenLabs Conversational AI Agent — med Twilio-integrasjon kan dette settes opp på noen få timer. Viderekobling av eksisterende nummer: på praksisens nåværende nummer kan man sette opp periodisk viderekobling (f.eks. bare utenfor arbeidstid eller ved opptatt linje), slik at Anna bare tar samtalen når resepsjonen ikke er tilgjengelig. Det nøyaktige oppsettet kan tilpasses hver praksis infrastruktur individuelt.',\n        'faq8-q': 'Hvordan gis samtykke ved telefonsamtaler?',\n        'faq8-a': 'Ved samtaleoppkobling informerer Anna i sin første setning den som ringer: en AI-assistent snakker, samtalen kan bli registrert for kvalitetssikring, og det er alltid mulig å be om en tilbakeringing fra en levende medarbeider (Anna arrangerer en tilbakeringing på forespørsel). Hvis pasienten fortsetter samtalen, anses dette som samtykke ved konkludent handling (GDPR artikkel 6(1) a og b). Ved detaljerte helseklager (f.eks. smerte, medisiner) kreves ytterligere eksplisitt bekreftelse. Dokumentasjon på samtykket og tidspunkt loggføres av systemet.',\n        'faq10-q': 'Hva koster de løpende kostnadene?',\n        'faq10-a': '<p>Disse betales av praksisen direkte til tjenesteleverandørene. Beløpene kan variere avhengig av trafikk (antall samtaler og lengde). Anna genererer i tillegg daglig innhold til Facebook og LinkedIn.<\u002Fp><ul class=\"space-y-1.5 list-disc pl-5\"><li><strong class=\"text-slate-700\">Domenenavn:<\u002Fstrong> 90 – 230 kr / år<\u002Fli><li><strong class=\"text-slate-700\">Make.com (Logikk og automatisering):<\u002Fstrong> ca. 1 270 kr / år<\u002Fli><li><strong class=\"text-slate-700\">ElevenLabs (Stemme):<\u002Fstrong> 1 440 – 2 880 kr / år<\u002Fli><li><strong class=\"text-slate-700\">Twilio (SMS):<\u002Fstrong> 580 – 1 730 kr / år<\u002Fli><li><strong class=\"text-slate-700\">Cloudflare (Kode):<\u002Fstrong> 0 kr<\u002Fli><li><strong class=\"text-slate-700\">Webhotell:<\u002Fstrong> 0 – 440 kr / år<\u002Fli><li><strong class=\"text-slate-700\">Claude AI (Tekstgenerering):<\u002Fstrong> ca. 58 kr / år<\u002Fli><li><strong class=\"text-slate-700\">Pollinations AI (Bildegenerering):<\u002Fstrong> 0 kr (gratis)<\u002Fli><\u002Ful><div class=\"bg-slate-50 rounded-xl px-4 py-2.5 border border-slate-200/60 -ml-1\"><p class=\"text-sm font-semibold text-slate-800\">Totalt: <span class=\"text-dental-700\">ca. 3 440 – 6 610 kr / år<\u002Fspan><\u002Fp><\u002Fdiv><p class=\"text-xs text-slate-400 italic\">Viktig for praksissen: Lengre samtaler betyr høyere regning. Flere samtaler betyr høyere regning. Flere SMS betyr høyere regning. Dette er kun estimerte verdier.<\u002Fp>',\n\n        'demo-sub': 'Live demo',\n        'demo-title': 'Prøv Anna!',\n        'demo-desc': 'Snakk med henne på telefon, eller sjekk ledige timer i sanntid — og opplev hvordan det er når ingenting glipper.',\n        'demo-what': 'Hva du kan spørre Anna om',\n        'demo-what-sub': 'Bare snakk naturlig — Anna forstår!',\n        'prompt1-title': 'Timebestilling',\n        'prompt1-text': '«Jeg vil gjerne bestille en tannrensning til neste tirsdag kl. 14»',\n        'prompt2-title': 'Endre time',\n        'prompt2-text': '«Jeg vil flytte min time i morgen til torsdag»',\n        'prompt3-title': 'Akutt tannpine',\n        'prompt3-text': '«Det gjør vondt i tanden og det blir verre — kan dere ta meg i dag?»',\n        'prompt4-title': 'Faglig informasjon',\n        'prompt4-text': 'Anna svarer på spørsmål om behandlinger og praksisens drift, slik at pasienten får all informasjon som trengs for å ta en beslutning.',\n        'demo-available': 'Anna tilgjengelig',\n        'demo-response': 'Svar <2 sek',\n        'demo-voice': 'Veiledet samtale med Anna',\n        'cal-title': 'Annas live-kalender',\n        'cal-sub': 'Ledige timer i sanntid',\n        'cal-sync': 'Synk:',\n        'cal-auto': 'Automatisk oppdatering hvert 30. sekund',\n        'cal-refresh': 'Oppdater nå',\n        'cal-loading': 'Laster Annas kalender...',\n        'cal-err-title': 'Kalenderen er for øyeblikket ikke tilgjengelig',\n        'cal-err-desc': 'Prøv igjen senere, eller ring Anna direkte.',\n        'cal-err-retry': 'Prøv igjen',\n        'footer-desc': 'Anna — DentAi Senior Assistent. Døgnåpen samtalehåndtering, nettbestilling og automatisk bekreftelse, slik at praksisen din alltid fungerer rolig.',\n        'footer-langs': 'Språk',\n        'footer-info-title': 'Informasjon',\n        'footer-portfolio': 'Portefølje Demo Laget av: Peter Petor',\n        'footer-impressum': 'Impressum',\n        'footer-privacy': 'Personvernerklæring',\n        'footer-gdpr': 'Juridisk merknad: Dette er en portefølje-demo. Vennligst ikke oppgi ekte data! Jeg tar ikke ansvar for AI-ens svar.',\n        'footer-copy': '© 2026 DentAi Assistent. Alle rettigheter forbeholdt. Drevet av Anna AI.',\n        'time-past': 'Det valgte tidspunktet er allerede passert. Vennligst velg et fremtidig tidspunkt.',\n        'time-too-close': 'For nært tidspunkt — minimum 2 timer i forveien kreves for bestilling.',\n        'time-too-late': 'Det valgte tidspunktet er for sent — behandlingen passer ikke innen åpningstiden (08:00–18:00).',\n        'time-closed': 'Praksisen er stengt på dette tidspunktet. Åpningstider: Man–Fre 08:00–18:00.',\n        'time-invalid': 'Ugyldig tidspunkt. Vennligst velg et annet.',\n        'time-suggest-prefix': 'Ledige timer:',\n        'time-booking-sent': 'Bestilling sendt — bekreftelse kommer snart!',\n        'legal-title': 'Juridisk informasjon',\n        'legal-tab-impressum': 'Impressum',\n        'legal-tab-privacy': 'Personvernerklæring',\n        'legal-close': 'Lukk',\n        'imp-intro': 'Denne nettsiden er en porteføljepresentasjon drevet av den nedenfor oppførte fysiske personen. Nettsiden tilbyr ikke reelle helsetjenester.',\n        'imp-name-label': 'Innehaver:',\n        'imp-name-value': 'Peter Petor (privatperson)',\n        'imp-email-label': 'E-postadresse:',\n        'imp-purpose-label': 'Nettsidens formål:',\n        'imp-purpose-value': 'Portefølje / teknologidemo (ikke kommersiell tjeneste)',\n        'imp-host-label': 'Vertsleverandør:',\n        'imp-host-value': 'Cloudflare, Inc. (101 Townsend St, San Francisco, CA 94107, USA)',\n        'imp-legal-basis': 'Rettslig grunnlag: Lov om elektronisk handel. Navnet \"DentAi Assistent\" er utelukkende fiktivt og tjener demonstrasjonsformål, det finnes ingen reell helseinstitusjon under dette navnet.',\n        'priv-intro': 'Denne erklæringen gir informasjon om databehandling under besøk på nettsiden, basert på GDPR (forordning EU 2016/679) og gjeldende nasjonal lovgivning.',\n        'priv-h1': '1. Dataansvarlig',\n        'priv-p1': 'Peter Petor som privatperson, kontakt: info@dentai.me. Siden er en portefølje-demo, ingen reell behandling av helsedata skjer.',\n        'priv-h2': '2. Behandlede data og formål',\n        'priv-li2-1': '<strong>Tekniske data:<\u002Fstrong> IP-adresse, nettleser og enhetstype, besøkstidspunkt — utelukkende for nettsidebetjening og sikkerhetsgrunner (Cloudflare).',\n        'priv-li2-2': '<strong>Taledata (kun ved samtalestart):<\u002Fstrong> Lyd fra mikrofonen din behandles midlertidig for å generere samtalen (ElevenLabs). Vennligst ikke del reelle personopplysninger!',\n        'priv-li2-3': '<strong>LocalStorage:<\u002Fstrong> I nettleseren din lagres en merking om at du har akseptert den juridiske erklæringen — dette sendes ikke til noen server.',\n        'priv-h3': '3. Tredjepartsleverandører (dataoverføring til utlandet)',\n        'priv-p3': 'Nettsiden laster inn ressurser fra følgende eksterne leverandører. Dermed kan din IP-adresse og nettleserdata overføres til land utenfor EU/EØS (tredjeland, typisk USA), der den aktuelle leverandørens egne personvernregler gjelder for databehandlingen:',\n        'priv-li3-1': '<strong>Cloudflare<\u002Fstrong> (CDN, hosting) — <a href=\"https://www.cloudflare.com/privacypolicy/\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">privacypolicy<\u002Fa>',\n        'priv-li3-2': '<strong>Google Fonts<\u002Fstrong> (skrifttyper) — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-li3-3': '<strong>Tailwind CDN<\u002Fstrong> (CSS-rammeverk)',\n        'priv-li3-4': '<strong>ElevenLabs<\u002Fstrong> (talebasert AI) — <a href=\"https://elevenlabs.io/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">elevenlabs.io/privacy<\u002Fa>',\n        'priv-li3-5': '<strong>Google Kalender<\u002Fstrong> — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-h4': '4. Rettslig grunnlag og varighet for databehandling',\n        'priv-p4': 'Det rettslige grunnlaget for behandling av tekniske data er GDPR artikkel 6(1) f (berettiget interesse — sikker nettsidedrift). Det rettslige grunnlaget for talebasert interaksjon er samtykke (GDPR artikkel 6(1) a), som gis i popup-vinduet før samtalen startes. Taledata lagres ikke langsiktig.',\n        'priv-h5': '5. Dine rettigheter',\n        'priv-p5': 'Du har rett til innsyn, retting, sletting og innsigelse mot behandlingen av dine data. Søknaden kan sendes til info@dentai.me. Klager kan rettes til Datatilsynet.',\n        'priv-h6': '6. Ansvarsfraskrivelse',\n        'priv-p6': 'Dette er en portefølje-demo. Svarene generert av AI anses ikke som medisinsk råd. Innehaveren tar intet ansvar for data oppgitt av brukeren eller for eventuelle skader som oppstår fra AI-genererte svar.',\n        'priv-updated': 'Gjeldende fra: 26. april 2026.',\n        'modal-title': 'Samtykkeerklæring',\n        'modal-text': 'Samtalen håndteres av kunstig intelligens (AI). Lyddata behandles under samtalen. Ved å starte samtalen aksepterer du at AI genererer svar, og at samtalen ikke utgjør medisinsk rådgivning.',\n        'modal-checkbox': 'Jeg har lest og aksepterer ovenstående varsel.',\n        'modal-cancel': 'Avbryt',\n        'modal-accept': 'Jeg aksepterer',\n\n        'cap-sub': 'Annas funksjoner',\n        'cap-title': 'Alt en resepsjonist bør vite',\n        'cap-desc': 'Fra bestilling og avbestilling til ventelister — Anna håndterer selvstendig og i sanntid all pasientkommunikasjon per telefon. Alle funksjoner er tilgjengelige på alle støttede språk.',\n        'cap1-title': 'Ledige timer',\n        'cap1-desc': 'Anna søker i sanntid etter ledige timer i Google Kalender — filtrert etter dato, tidspunkt eller lege. Pasienten får umiddelbart et utvalg av tider.',\n        'cap1-tag2': 'Sanntid',\n        'cap2-title': 'Timebestilling',\n        'cap2-desc': 'Når pasienten oppgir navn, e-postadresse og ønsket tidspunkt, registrerer Anna bestillingen i kalenderen og sender umiddelbart en bekreftelse på sms og e-post.',\n        'cap2-tag1': 'Bekreftelse',\n        'cap3-title': 'Endre time',\n        'cap3-desc': 'Hvis pasienten ønsker et annet tidspunkt, avbestiller Anna den gamle timen og bestiller en ny — hun sjekker også kalenderen for den nye tidens tilgjengelighet slik at det ikke oppstår konflikter.',\n        'cap3-tag1': 'Gammel → Ny',\n        'cap3-tag2': 'Kontrollert',\n        'cap4-title': 'Avbestille time',\n        'cap4-desc': 'Pasienten kan bekrefte avbestillingen — Anna sletter hendelsen fra kalenderen og sender en avbestillingsbekreftelse på sms og e-post på riktig språk.',\n        'cap4-tag1': 'Varsling',\n        'cap4-tag2': 'Kalenderoppdatering',\n        'cap5-title': 'Timeoppslag',\n        'cap5-desc': 'Hvis pasienten ikke husker avtalen sin, henter Anna fremtidige timer via telefon eller e-post og leser dem opp for å lette endring eller avbestilling.',\n        'cap5-tag1': 'Søk',\n        'cap5-tag2': 'Pasientidentifikasjon',\n        'cap6-title': 'Venteliste',\n        'cap6-desc': 'Hvis ingen time er ledig, setter Anna pasienten på en prioritert venteliste — sammen med foretrukne tidsrom. Når en plass blir ledig, blir pasienten automatisk varslet.',\n        'cap6-tag1': 'Prioritet',\n        'cap6-tag2': 'Automatisk varsling',\n        'cap7-title': 'Dataendring',\n        'cap7-desc': 'Hvis pasienten har fått nytt telefonnummer eller ny e-postadresse, oppdaterer Anna dataene i systemet — basert på nåværende e-postidentifikator, med umiddelbar virkning.',\n        'cap7-tag1': 'Telefon / e-post',\n        'cap7-tag2': 'Umiddelbart',\n        'cap8-title': 'Samtaleoverføring',\n        'cap8-desc': 'Hvis pasienten ønsker å snakke med en medarbeider, hvis det oppstår en teknisk feil, eller hvis Anna ikke kan svare, varsler hun automatisk resepsjonen om tilbakeringing — pasienten blir aldri stående uten svar.',\n        'cap8-tag1': 'Tilbakeringing',\n        'cap8-tag2': 'Sikkerhetsnett',\n        'cap-stat1-label': 'Innebygde verktøy for pasientkommunikasjon',\n        'cap-stat2-label': 'Språk som tales flytende',\n        'cap-stat3-label': 'Tilgjengelig dag og natt, også på helligdager',\n        'cap-stat3-value': '24/7',\n        'lang-title': 'Elleve språk, én stemme',\n        'lang-subtitle': 'Automatisk språkdeteksjon — alle funksjoner tilgjengelige på alle språk',\n        'lang-auto': 'Automatisk gjenkjenning',\n        'lang-desc': 'Anna kjenner automatisk igjen pasientens språk i starten av samtalen og fortsetter på det språket. SMS-er, e-poster og kalenderoppføringer opprettes også på pasientens morsmål — slik at utenlandske pasienter føler seg hjemme i praksisen og aldri står i en kommunikasjonsulempe.',\n        'lang-feat1-title': 'Muntlig kommunikasjon',\n        'lang-feat1-desc': 'Live-stemme, naturlig tale',\n        'lang-feat2-title': 'Språkspesifikk SMS',\n        'lang-feat2-desc': 'Bekreftelse på pasientens språk',\n        'lang-feat3-title': 'Flerspråklig e-post',\n        'lang-feat3-desc': 'Kalenderbeskrivelse på 11 språk, automatisk generert',\n        'roi-email-btn': 'Del via e-post',\n        'roi-email-prompt': 'Send resultatet til deg selv!',\n        'roi-email-send': 'Send',\n        'roi-email-success': 'Sendt! Sjekk innboksen din.'\n      ,\n        'roi-email-error': 'Det oppstod en feil under sending. Prøv igjen!'\n      ,\n        'roi-email-subject': 'Ditt ROI-kalkulatorresultat'\n      ,\n        'roi-email-greeting': 'Kjære'\n      ,\n        'roi-email-closing': 'Vennlig hilsen, DentAi-teamet'\n      ,\n        'roi-name-placeholder': 'Navn'\n      ,\n        'roi-email-placeholder': 'email@eksempel.no'\n      ,\n        'roi-sub': 'Hvor mye bringer Anna?',\n        'roi-title': 'ROI-kalkulator — på 30 sekunder',\n        'roi-desc': 'Still inn klinikens daglige samtalevolum — vi beregner hvor mye omsetning som glipper med tapte anrop, og hvor mye Anna bringer tilbake.',\n        'roi-inputs-title': 'Din klinikk',\n        'roi-inputs-desc': 'Dra i glidebryterne — resultatene oppdateres umiddelbart.',\n        'roi-calls-label': 'Hvor mange anrop mottar du daglig?',\n        'roi-calls-unit': 'anrop/dag',\n        'roi-missed-label': 'Tapt anropsrate',\n        'roi-missed-hint': 'Helger, lunsjtid, parallelle anrop, språkbarrierer.',\n        'roi-value-label': 'Gjennomsnittlig behandlingsverdi',\n        'roi-result-label': 'Estimert avkastning',\n        'roi-monthly-label': 'Månedlig gjenvunnet omsetning',\n        'roi-yearly-label': 'Per år',\n        'roi-bookings-label': 'Ekstra bookinger/måned',\n        'roi-monthly-sub': '',\n        'roi-cta': 'Be om demo →',\n        'roi-disclaimer': 'Estimat. Faktiske resultater avhenger av klinikkprofil og behandlingsforhold.',\n        'roi-value-currency': 'kr'},\nsv: {\n        'page-title': 'Anna — Seniorassistent på DentAi | Dygnet runt samtalshantering & bokning',\n        'brand-suffix': '-AI',\n        'senior-badge': 'Senior AI Assistent',\n        'hero-h1-1': 'Aldrig mer',\n        'hero-h1-2': 'ett missat samtal.',\n        'hero-desc': 'Möt <strong class=\"text-slate-800\">Anna<\u002Fstrong> — Seniorassistent på DentAi, som tar emot samtal <strong class=\"text-slate-800\">dygnet runt<\u002Fstrong>, bokar tider och skickar omedelbara bekräftelser — så att receptionen äntligen kan fokusera på patienterna.',\n        'hero-call': 'Prata med Anna',\n        'hero-hangup': 'Avsluta samtal',\n        'hero-calendar': 'Se kalender',\n        'feat-1': 'Dygnet runt samtalshantering',\n        'feat-2': 'Automatisk bekräftelse',\n        'feat-3': '11 språk',\n        'status-ready': 'Anna är redo — ring henne!',\n        'status-connecting': 'Ansluter till Anna...',\n        'status-listening': 'Anna lyssnar — berätta vad du behöver',\n        'status-speaking': 'Anna svarar dig',\n        'error-server': 'Kunde inte starta samtalet. Servern är inte tillgänglig.',\n        'error-mic': 'Mikrofontillstånd krävs för att starta ett samtal. Aktivera mikrofonåtkomst i dina webbläsarinställningar och försök igen.',\n        'error-no-url': 'Kunde inte ansluta till Anna (signed URL saknas). Försök igen senare!',\n\n        'header-available': 'Anna är online',\n        'header-connecting': 'Ansluter...',\n        'header-listening': 'Anna lyssnar...',\n        'header-speaking': 'Anna pratar...',\n        'mobile-available': 'Anna är online',\n        'menu-label': 'Meny',\n        'menu-close': 'Stäng',\n        'float-1': 'Inkommande samtal',\n        'float-2': 'Tid bokad',\n        'float-3': 'Bekräftelse skickad',\n        'phone-anna-name': 'Anna',\n        'phone-anna-role': 'Senior Assistent · Online',\n        'chat-1': 'God kväll! Jag vill gärna boka en tandstenstagning till imorgon förmiddag.',\n        'chat-2': 'God kväll! Jag kollar lediga tider direkt. Imorgon förmiddag klockan 09:00 och 11:30 är båda lediga — vilken passar bäst?',\n        'chat-3': '09:00 skulle vara perfekt!',\n        'chat-4': 'Klart! Du är bokad till imorgon klockan 09. Jag skickar bekräftelse via SMS och e-post.',\n        'chat-input': 'Skriv ett meddelande till Anna...',\n        'how-title-sub': 'Hur det fungerar',\n        'how-title': 'En välordnad praktik i fyra steg',\n        'how-desc': 'Fullautomatisering från samtal till tid. Patienten anmäler sig bara, Anna gör resten i bakgrunden.',\n        'step1-title': 'Inkommande förfrågan',\n        'step1-desc': 'Patienten ringer eller bokar på nätet — Anna tar samtalet omedelbart, dag och natt. Ingen väntetid, ingen upptagetsignal.',\n        'step1-tag1': 'Telefon',\n        'step1-tag2': 'Nätbokning',\n        'step2-title': 'Intelligent behovskartläggning',\n        'step2-desc': 'Anna analyserar patientens förfrågan — akut tandvärk, rutinmässig tandstenstagning eller konsultation — och remitterar omedelbart till rätt specialist.',\n        'step2-tag1': 'Triage',\n        'step2-tag2': 'Flerspråkig',\n        'step3-title': 'Kalendersynkronisering',\n        'step3-desc': 'Anna ser lediga tider i realtid och bokar omedelbart — eller ändrar om patienten önskar en annan tid.',\n        'step3-tag1': 'Realtid',\n        'step3-tag2': 'Bokning/Ändring',\n        'step4-title': 'Behandlingsinformation',\n        'step4-desc': 'Anna svarar på frågor om behandlingar och praktikens drift, så att patienten får all information som behövs för att fatta ett beslut.',\n        'step4-tag1': 'E-post',\n        'step4-tag2': 'SMS',\n        'step4-tag3': 'Kalender',\n        'care-sub': 'Automatisk uppföljning',\n        'care-title': 'Närvarande både före och efter tiden',\n        'care-desc': 'Anna bokar inte bara — hon ser till allt. Dagen före behandlingen skickar hon en påminnelse, och dagen efter frågar hon hur det gick. Patienten känner sig aldrig glömd, och praktiken får feedback på kvaliteten i realtid.',\n        'care1-title': 'SMS-påminnelse före tiden',\n        'care1-subtitle': 'Automatisk — Utan mänsklig inblandning',\n        'care1-desc': 'Morgonen före behandlingen skickar Anna automatiskt ett SMS till patienten om den kommande tiden, för att förhindra att den glöms. Detta minskar antalet no-shows dramatiskt och frigör receptionen helt från manuella påminnelser.',\n        'care1-tag1': 'Twilio SMS',\n        'care1-tag2': 'Google Kalender',\n        'care1-tag3': 'Tidsstyrd',\n        'care1-step1-title': 'Tidsinställning: varje morgon',\n        'care1-step1-desc': 'Systemet skickar påminnelse-SMS varje morgon för bokningar dagen efter',\n        'care1-step2-title': 'Kalendersökning',\n        'care1-step2-desc': 'Anna hämtar händelsen från Google Kalender och kontrollerar detaljerna',\n        'care1-step3-title': 'SMS-utskick (Twilio)',\n        'care1-step3-desc': 'Personligt påminnelse-SMS — namn, tidspunkt och plats inkluderat',\n        'care1-sms-header': 'Påminnelse · tiden imorgon',\n        'care1-sms-body': 'Påminnelse: din tandläkartid imorgon',\n        'care1-sms-arrival': 'Vänligen kom 10 minuter före din bokade tid.',\n        'care1-sms-date': '📅 2026-04-29 · 10:00',\n        'care1-sms-footer': '— DentAi Assistent',\n        'care1-sms-preview': 'Hej Jan Johansson! 👋',\n        'care2-title': 'Uppföljning efter behandling / enkät',\n        'care2-subtitle': 'Automatisk — Utan mänsklig inblandning',\n        'care2-desc': 'Dagen efter behandlingen skickar Anna en kort enkät via e-post där patienten kan bedöma servicen. Feedback loggas automatiskt, så att praktiken kontinuerligt kan förbättra servicekvaliteten utan manuell dataregistrering.',\n        'care2-tag1': 'Gmail',\n        'care2-tag2': 'Statistik',\n        'care2-tag3': 'Tidsstyrd',\n        'care2-step1-title': 'Tidsinställning: dagen efter behandling',\n        'care2-step1-desc': 'Dagen efter behandlingen skickar systemet enkäter via e-post till patienterna',\n        'care2-step2-title': 'Enkät via e-post (Gmail)',\n        'care2-step2-desc': 'Personligt e-postmeddelande med länk till enkät — nöjdhet, upplevelse, förslag',\n        'care2-step3-title': 'Statistisk loggning',\n        'care2-step3-desc': 'Svaren registreras automatiskt i Google Sheets statistiksida',\n        'care2-email-from': 'DentAi Assistent',\n        'care2-email-to': '→ jan.johansson@email.se',\n        'care2-email-subject': 'Feedback på undersökningen – DentAi',\n        'care2-email-body': 'Hej Jan Johansson! Vi hoppas att dagens besök gick smidigt. Din åsikt är viktig för oss: vänligen dela dina erfarenheter genom en kort enkät, så att vi kan höja nivån på vår behandling ännu mer.',\n        'care2-email-cta': '→ Fyll i enkäten',\n        'care-stat1-value': '~40%',\n        'care-stat1-label': 'Färre glömda tider tack vare påminnelser',\n        'care-stat2-value': '0',\n        'care-stat2-label': 'Handarbete och helt automatiserad process',\n        'care-stat3-value': '24t',\n        'care-stat3-label': 'Feedback efter behandling',\n        'flow-1': 'Inkommande samtal/Nät',\n        'flow-2': 'Behovskartläggning',\n        'flow-3': 'Kalendersynk',\n        'flow-4': 'Bekräftelse',\n        'flow-done': 'Klart!',\n        'why-sub': 'Varför Anna?',\n        'why-title': 'Frigjord receptionskapacitet — omedelbart',\n        'why-desc': 'Anna ersätter inte receptionen — hon tar hand om de repetitiva uppgifterna, så att ditt team kan fokusera på det som verkligen betyder något.',\n        'ben1-title': 'Aldrig mer ett missat samtal',\n        'ben1-desc': 'Anna tar emot samtal dag och natt — under lunchen, på helger och helgdagar. Varje patient får prata med någon som hjälper omedelbart.',\n        'ben2-title': 'Frigjord receptionskapacitet',\n        'ben2-desc': 'Receptionen kan fokusera på personliga möten, patientkommunikation och försäljning — Anna tar hand om rutinuppgifterna i bakgrunden.',\n        'ben3-title': 'På elva språk, med en röst',\n        'ben3-desc': 'Anna kommunicerar lika flytande på svenska, danska, norska, finska, engelska, tyska, nederländska, franska, italienska, slovakiska och ungerska — utländska patienter känner sig också hemma i praktiken.',\n        'clinic-sub': 'Klinikinformation',\n        'clinic-title': 'Klinikdetaljer',\n        'clinic-desc': 'Anna känner till all viktig information om kliniken — från öppettider till behandlingstider.',\n        'clinic-details-title': 'Klinikdetaljer',\n        'clinic-location-label': 'Plats',\n        'clinic-location-value': 'Budapest, distrikt V, Centrum',\n        'clinic-hours-label': 'Öppettider',\n        'clinic-hours-value': 'Måndag–Fredag 08:00–18:00',\n        'clinic-closed-label': 'Stängt',\n        'clinic-closed-value': 'Lördag, söndag och helgdagar',\n        'clinic-doctors-label': 'Läkare',\n        'clinic-doctors-value': 'Dr. Kovács och Dr. Nagy',\n        'clinic-treatments-title': 'Behandlingar & Duration',\n        'clinic-treatments-note': '30-minuters tidsluckor',\n        'treat1-name': 'Undersökning / Konsultation',\n        'treat1-dur': '30 min',\n        'treat2-name': 'Tandstensborttagning',\n        'treat2-dur': '30 min',\n        'treat4-name': 'Fyllningsbyte',\n        'treat4-dur': '45 min',\n        'treat5-name': 'Rotbehandling',\n        'treat5-dur': '90 min',\n        'treat6-name': 'Akutvård',\n        'treat6-dur': '60 min',\n\n        'faq-sub': 'Vanliga frågor',\n        'social-sub': 'Social AutoPilot',\n        'social-title': 'Anna postar åt dig',\n        'social-desc': 'Varje dag nytt AI-genererat innehåll på Facebook och LinkedIn — både text och bilder, helt automatiskt.',\n        'social-card1-title': 'Automatiskt innehållsskapande',\n        'social-card1-text': 'Anna skriver varje dag ett nytt professionellt inlägg om olika tandvårdsämnen — från tandblekning till implantat, från barntandvård till akutvård. AI:n väljer slumpmässigt ett ämne och skapar sedan en formell, yrkesmässig text: rubrik, fråga, 3-5 praktiska tips och call-to-action. Ingen upprepning, ingen generisk ton — varje inlägg är unikt och färskt.',\n        'social-card2-title': 'AI skapar bilderna',\n        'social-card2-text': 'För varje inlägg genererar Anna en professionell tandvårdsrelaterad bild — rena, moderna klinkmiljöer, strålande leenden, estetiska behandlingsresultat. Bilderna anpassas automatiskt till inläggets ämne, så att ditt Facebook- och LinkedIn-innehåll förblir visuellt tilltalande och konsekvent, utan fotograf.',\n        'social-card2-tag2': 'Utan vattenmärke',\n        'social-card3-title': 'Facebook och LinkedIn',\n        'social-card3-text': 'Anna postar samtidigt på båda plattformarna: med foto på Facebook-sidan och med visuellt innehåll på LinkedIn-företagsprofilen. Inlägg visas omedelbart — ingen väntan på godkännande. Hela processen körs via Make.com-automatiseringsmotorn med Claude AI-textskapande och Pollinations bildgenerering.',\n        'social-benefit1-title': 'Tidsbesparing',\n        'social-benefit1-text': 'Inget behov av att skriva innehåll, hitta bilder eller posta — Anna sköter allt',\n        'social-benefit2-title': 'Konstant närvaro',\n        'social-benefit2-text': 'Dagligt färskt innehåll säkerställer att din klinik aldrig framstår som inaktiv',\n        'social-benefit3-title': 'Växande räckvidd',\n        'social-benefit3-text': 'Regelbundna inlägg ökar organisk synlighet och attraherar nya patienter',\n        'social-benefit4-title': 'Professionell trovärdighet',\n        'social-benefit4-text': 'Kvalitativa, informativa inlägg stärker din kliniks rykte och bygger förtroende',\n        'social-follow-fb': 'Följ på Facebook',\n        'social-follow-li': 'Följ på LinkedIn',\n        'footer-contact': 'Kontakt',\n        'faq-title': 'Allt du vill veta',\n        'faq-desc': 'De vanligaste frågorna och svaren om Anna — hittar du inte det du letar efter, kontakta mig!',\n        'faq1-q': 'Fungerar det på mitt befintliga telefonnummer?',\n        'faq1-a': 'Ja! Anna tar emot samtal på ditt befintliga telefonnummer — du behöver inte nytt nummer, byta leverantör eller extra utrustning. Systemet kan integreras sömlöst med din nuvarande telefonlinje, så att patienterna ringer på samma nummer som de alltid har använt. Installationen tar bara några få minuter.',\n        'faq2-q': 'Vad händer om AI:n inte kan svara?',\n        'faq2-a': 'Om Anna får en fråga hon inte är förberedd på (t.ex. specifika medicinska frågor, klagomålshantering, komplexa prisförslag), meddelar hon automatiskt praktikens reception om ett återuppringning — hon noterar patientens uppgifter och förfrågans detaljer, så att receptionen kan ringa tillbaka patienten så snart som möjligt. Om praktiken är stängd noterar Anna förfrågan, och receptionen ringer patienten tillbaka nästa arbetsdag. Patienten lämnas aldrig utan svar.',\n        'faq3-q': 'Hur får man tillgång till systemet?',\n        'faq3-a': 'Anna är för närvarande tillgänglig som en portfölj-demo — utvecklad av Peter Petor som privatperson, och är inte kommersiellt tillgänglig ännu. Webbplatsen och samtal-demo kan testas av alla, så att du som tandläkare, utvecklare eller affärsintresserad kan få en överblick över hur det fungerar. Om du tänker på lansering eller ett unikt samarbete (pilotprogram, integration), vänligen kontakta info@dentai.me.',\n        'faq4-q': 'Vilka språk talar hon?',\n        'faq4-a': 'För närvarande kommunicerar hon flytande på elva språk: svenska, danska, norska, finska, engelska, tyska, nederländska, franska, italienska, slovakiska och ungerska. Språkvalet sker automatiskt — Anna känner igen patientens språk och svarar på det. Detta är särskilt värdefullt i turistområden där utländska patienter ofta ringer praktiken.',\n        'faq5-a': 'I akuta situationer — till exempel kraftig tandvärk, tandskador eller blödning — ger Anna omedelbart prioritet till samtalet. Hon känner igen akut-nyckelord och försöker hitta en tid samma dag så snabbt som möjligt. Vid verkliga nödsituationer (t.ex. käkfraktur, okontrollerbar blödning) hänvisar hon patienten till närmaste akutmottagning. Akuta samtal blir aldrig felaktigt hanterade som rutinbokningar.',\n        'faq6-q': 'Hur hanteras integritet (GDPR)?',\n        'faq6-a': 'Anna är utvecklad med GDPR-kraven i åtanke, men det är viktigt att vara öppen om de tjänsteleverantörer som används. Webbplatsen och API-trafiken går via Cloudflare CDN, och talbehandlingen levereras av ElevenLabs — båda är USA-baserade leverantörer som opererar med Standard Contractual Clauses (SCC) och databehandlaravtal (DPA), men data kan ändå överföras till länder utanför EU/EES (tredjeländer, t.ex. USA). Innan lansering måste varje praktik ingå sitt eget DPA med leverantörerna, ange dataöverföringen och dess rättsliga grund i integritetspolicyn, och det rekommenderas att genomföra en konsekvensbedömning avseende dataskydd (DPIA). För detaljerade hälsoklagomål (speciella data, GDPR artikel 9) krävs särskilt samtycke. Innan produktionslansering rekommenderas det alltid att konsultera en integritetsexpert/jurist.',\n        'faq7-q': 'Hur kopplas Anna till ett telefonnummer?',\n        'faq7-a': 'Två huvudsakliga metoder kan användas. Nytt nummer: från Twilio eller andra VoIP-leverantörer kan man köpa ett telefonnummer som dirigeras direkt till ElevenLabs Conversational AI Agent — med Twilio-integration kan detta sättas upp på några få timmar. Vidarekoppling av befintligt nummer: på praktikens nuvarande nummer kan man ställa in periodisk vidarekoppling (t.ex. bara utanför arbetstid eller vid upptagen linje), så att Anna bara tar samtalet när receptionen inte är tillgänglig. Den exakta installationen kan anpassas till varje praktiks infrastruktur individuellt.',\n        'faq8-q': 'Hur ges samtycke vid telefonsamtal?',\n        'faq8-a': 'Vid samtalsanslutning informerar Anna i sin första mening den som ringer: en AI-assistent pratar, samtalet kan komma att registreras för kvalitetssäkring, och det är alltid möjligt att begära en återuppringning från en levande medarbetare (Anna ordnar en återuppringning på begäran). Om patienten fortsätter samtalet anses detta som samtycke genom konkludent handlande (GDPR artikel 6(1) a och b). Vid detaljerade hälsoklagomål (t.ex. smärta, mediciner) krävs ytterligare uttrycklig bekräftelse. Samtyckets faktum och tidspunkt loggas av systemet.',\n        'faq10-q': 'Vad kostar de löpande kostnaderna?',\n        'faq10-a': '<p>Dessa betalas av praktiken direkt till tjänsteleverantörerna. Beloppen kan variera beroende på trafik (antal samtal och längd). Anna genererar även dagligt innehåll för Facebook och LinkedIn.<\u002Fp><ul class=\"space-y-1.5 list-disc pl-5\"><li><strong class=\"text-slate-700\">Domännamn:<\u002Fstrong> 90 – 230 kr / år<\u002Fli><li><strong class=\"text-slate-700\">Make.com (Logik & Automatisering):<\u002Fstrong> ca. 1 240 kr / år<\u002Fli><li><strong class=\"text-slate-700\">ElevenLabs (Röst):<\u002Fstrong> 1 410 – 2 830 kr / år<\u002Fli><li><strong class=\"text-slate-700\">Twilio (SMS):<\u002Fstrong> 570 – 1 700 kr / år<\u002Fli><li><strong class=\"text-slate-700\">Cloudflare (Kod):<\u002Fstrong> 0 kr<\u002Fli><li><strong class=\"text-slate-700\">Webbhotell:<\u002Fstrong> 0 – 430 kr / år<\u002Fli><li><strong class=\"text-slate-700\">Claude AI (Textgenerering):<\u002Fstrong> ca. 57 kr / år<\u002Fli><li><strong class=\"text-slate-700\">Pollinations AI (Bildgenerering):<\u002Fstrong> 0 kr (gratis)<\u002Fli><\u002Ful><div class=\"bg-slate-50 rounded-xl px-4 py-2.5 border border-slate-200/60 -ml-1\"><p class=\"text-sm font-semibold text-slate-800\">Totalt: <span class=\"text-dental-700\">ca. 3 370 – 6 490 kr / år<\u002Fspan><\u002Fp><\u002Fdiv><p class=\"text-xs text-slate-400 italic\">Viktigt för praktiken: Längre samtal innebär högre räkning. Fler samtal innebär högre räkning. Fler SMS innebär högre räkning. Detta är endast uppskattade värden.<\u002Fp>',\n\n        'demo-sub': 'Live demo',\n        'demo-title': 'Prova Anna!',\n        'demo-desc': 'Prata med henne på telefon, eller kolla lediga tider i realtid — och upplev hur det är när ingenting glappar.',\n        'demo-what': 'Vad du kan fråga Anna om',\n        'demo-what-sub': 'Bara prata naturligt — Anna förstår!',\n        'prompt1-title': 'Tidsbokning',\n        'prompt1-text': '«Jag vill gärna boka en tandstenstagning till nästa tisdag kl. 14»',\n        'prompt2-title': 'Ändra tid',\n        'prompt2-text': '«Jag vill flytta min tid imorgon till torsdag»',\n        'prompt3-title': 'Akut tandvärk',\n        'prompt3-text': '«Det gör ont i tanden och det blir värre — kan ni ta mig idag?»',\n        'prompt4-title': 'Behandlingsinformation',\n        'prompt4-text': 'Anna svarar på frågor om behandlingar och praktikens drift, så att patienten får all information som behövs för att fatta ett beslut.',\n        'demo-available': 'Anna är online',\n        'demo-response': 'Svar <2 sek',\n        'demo-voice': 'Vägledt samtal med Anna',\n        'cal-title': 'Annas live-kalender',\n        'cal-sub': 'Lediga tider i realtid',\n        'cal-sync': 'Synk:',\n        'cal-auto': 'Automatisk uppdatering var 30:e sekund',\n        'cal-refresh': 'Uppdatera nu',\n        'cal-loading': 'Laddar Annas kalender...',\n        'cal-err-title': 'Kalendern är för närvarande inte tillgänglig',\n        'cal-err-desc': 'Försök igen senare eller ring Anna direkt.',\n        'cal-err-retry': 'Försök igen',\n        'footer-desc': 'Anna — Seniorassistent på DentAi. Dygnet runt samtalshantering, nätbokning och automatisk bekräftelse, så att din praktik alltid fungerar lugnt.',\n        'footer-langs': 'Språk',\n        'footer-info-title': 'Information',\n        'footer-portfolio': 'Portfölj Demo Skapad av: Peter Petor',\n        'footer-impressum': 'Impressum',\n        'footer-privacy': 'Integritetspolicy',\n        'footer-gdpr': 'Juridiskt meddelande: Detta är en portfölj-demo. Vänligen uppge inte riktiga data! Jag tar inget ansvar för AI:ns svar.',\n        'footer-copy': '© 2026 DentAi Assistent. Alla rättigheter förbehållna. Drivs av Anna AI.',\n        'time-past': 'Den valda tidspunkten har redan passerat. Vänligen välj en framtida tidspunkt.',\n        'time-too-close': 'För nära tidspunkt — minimum 2 timmar i förväg krävs för bokning.',\n        'time-too-late': 'Den valda tidspunkten är för sent — behandlingen passar inte inom öppettiderna (08:00–18:00).',\n        'time-closed': 'Praktiken är stängd vid denna tidspunkt. Öppettider: Mån–Fre 08:00–18:00.',\n        'time-invalid': 'Ogiltig tidspunkt. Vänligen välj en annan.',\n        'time-suggest-prefix': 'Lediga tider:',\n        'time-booking-sent': 'Bokning skickad — bekräftelse kommer snart!',\n        'legal-title': 'Juridisk information',\n        'legal-tab-impressum': 'Impressum',\n        'legal-tab-privacy': 'Integritetspolicy',\n        'legal-close': 'Stäng',\n        'imp-intro': 'Denna webbplats är en portföljpresentation driven av den nedan uppräknade fysiska personen. Webbplatsen erbjuder inte verkliga hälso- och sjukvårdstjänster.',\n        'imp-name-label': 'Webbplatsansvarig:',\n        'imp-name-value': 'Peter Petor (privatperson)',\n        'imp-email-label': 'E-postadress:',\n        'imp-purpose-label': 'Webbplatsens syfte:',\n        'imp-purpose-value': 'Portfölj / teknologidemo (inte kommersiell tjänst)',\n        'imp-host-label': 'Webbhotell:',\n        'imp-host-value': 'Cloudflare, Inc. (101 Townsend St, San Francisco, CA 94107, USA)',\n        'imp-legal-basis': 'Rättslig grund: Lag om elektronisk handel. Namnet \"DentAi Assistent\" är uteslutande fiktivt och tjänar demonstrationssyfte, det finns ingen verklig vårdinrättning under detta namn.',\n        'priv-intro': 'Denna förklaring ger information om databehandling vid besök på webbplatsen, baserat på GDPR (förordning EU 2016/679) och gällande nationell lagstiftning.',\n        'priv-h1': '1. Dataansvarig',\n        'priv-p1': 'Peter Petor som privatperson, kontakt: info@dentai.me. Sidan är en portfölj-demo, ingen verklig behandling av hälsodata sker.',\n        'priv-h2': '2. Behandlade data och syfte',\n        'priv-li2-1': '<strong>Tekniska data:<\u002Fstrong> IP-adress, webbläsare och enhetstyp, besökstidspunkt — uteslutande för webbplatsdrift och säkerhetsskäl (Cloudflare).',\n        'priv-li2-2': '<strong>Taldata (endast vid samtalstart):<\u002Fstrong> Ljud från din mikrofon bearbetas tillfälligt för att generera samtalet (ElevenLabs). Vänligen dela inte verkliga personuppgifter!',\n        'priv-li2-3': '<strong>LocalStorage:<\u002Fstrong> I din webbläsare lagras en markering om att du har accepterat den juridiska förklaringen — detta skickas inte till någon server.',\n        'priv-h3': '3. Tredjepartsleverantörer (dataöverföring till utlandet)',\n        'priv-p3': 'Webbplatsen laddar in resurser från följande externa leverantörer. Därmed kan din IP-adress och webbläsardata överföras till länder utanför EU/EES (tredjeländer, typiskt USA), där den aktuella leverantörens egna integritetsregler gäller för databehandlingen:',\n        'priv-li3-1': '<strong>Cloudflare<\u002Fstrong> (CDN, hosting) — <a href=\"https://www.cloudflare.com/privacypolicy/\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">privacypolicy<\u002Fa>',\n        'priv-li3-2': '<strong>Google Fonts<\u002Fstrong> (typsnitt) — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-li3-3': '<strong>Tailwind CDN<\u002Fstrong> (CSS-ramverk)',\n        'priv-li3-4': '<strong>ElevenLabs<\u002Fstrong> (talbaserad AI) — <a href=\"https://elevenlabs.io/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">elevenlabs.io/privacy<\u002Fa>',\n        'priv-li3-5': '<strong>Google Kalender<\u002Fstrong> — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-h4': '4. Rättslig grund och varaktighet för databehandling',\n        'priv-p4': 'Den rättsliga grunden för behandling av tekniska data är GDPR artikel 6(1) f (berättigat intresse — säker webbplatsdrift). Den rättsliga grunden för talbaserad interaktion är samtycke (GDPR artikel 6(1) a), som ges i popup-fönstret innan samtalet startas. Taldata lagras inte långsiktigt.',\n        'priv-h5': '5. Dina rättigheter',\n        'priv-p5': 'Du har rätt till tillgång, rättning, radering och invändning mot behandlingen av dina data. Ansökan kan skickas till info@dentai.me. Klagomål kan riktas till Integritetsskyddsmyndigheten.',\n        'priv-h6': '6. Ansvarsfriskrivning',\n        'priv-p6': 'Detta är en portfölj-demo. Svaren genererade av AI anses inte som medicinsk rådgivning. Webbplatsansvarige tar inget ansvar för data som anges av användaren eller för eventuella skador som uppstår från AI-genererade svar.',\n        'priv-updated': 'Gällande från: 26 april 2026.',\n        'modal-title': 'Samtyckesförklaring',\n        'modal-text': 'Samtalet hanteras av artificiell intelligens (AI). Röstdata bearbetas under samtalet. Genom att starta samtalet accepterar du att AI genererar svar och att samtalet inte utgör medicinsk rådgivning.',\n        'modal-checkbox': 'Jag har läst och accepterar ovanstående meddelande.',\n        'modal-cancel': 'Avbryt',\n        'modal-accept': 'Jag accepterar',\n\n        'cap-sub': 'Annas funktioner',\n        'cap-title': 'Allt en receptionist behöver veta',\n        'cap-desc': 'Från bokning och avbokning till väntelistan — Anna hanterar självständigt och i realtid all patientkommunikation per telefon. Alla funktioner är tillgängliga på alla språk som stöds.',\n        'cap1-title': 'Lediga tider',\n        'cap1-desc': 'Anna söker i realtid efter lediga tider i Google Kalender — filtrerat efter datum, tidpunkt eller läkare. Patienten får omedelbart ett urval av alternativ.',\n        'cap1-tag2': 'Realtid',\n        'cap2-title': 'Tidsbokning',\n        'cap2-desc': 'När patienten uppger sitt namn, sin e-postadress och önskad tid registrerar Anna bokningen i kalendern och skickar omedelbart ett bekräftelse-sms och ett e-postmeddelande.',\n        'cap2-tag1': 'Bekräftelse',\n        'cap3-title': 'Ändra tid',\n        'cap3-desc': 'Om patienten önskar en annan tid avbokar Anna den gamla tiden och bokar en ny — hon kontrollerar även kalendern för den nya tidens tillgänglighet så att inga konflikter uppstår.',\n        'cap3-tag1': 'Gammel → Ny',\n        'cap3-tag2': 'Kontrollerad',\n        'cap4-title': 'Avboka tid',\n        'cap4-desc': 'Patienten kan bekräfta avbokningen — Anna tar bort händelsen från kalendern och skickar en avbokningsbekräftelse via sms och e-post på rätt språk.',\n        'cap4-tag1': 'Avisering',\n        'cap4-tag2': 'Kalenderuppdatering',\n        'cap5-title': 'Hitta bokning',\n        'cap5-desc': 'Om patienten inte kommer ihåg sin bokning hämtar Anna kommande tider via telefon eller e-post och läser upp dem för att underlätta ändring eller avbokning.',\n        'cap5-tag1': 'Sök',\n        'cap5-tag2': 'Patientidentifiering',\n        'cap6-title': 'Väntelista',\n        'cap6-desc': 'Om ingen tid är tillgänglig skriver Anna in patienten på prioritetsväntelistan — med önskade tidsintervall. När en plats blir ledig meddelas patienten automatiskt.',\n        'cap6-tag1': 'Prioritet',\n        'cap6-tag2': 'Automatiskt meddelande',\n        'cap7-title': 'Dataändring',\n        'cap7-desc': 'Om patienten har fått ett nytt telefonnummer eller en ny e-postadress uppdaterar Anna uppgifterna i systemet — baserat på nuvarande e-postadress som identifierare, med omedelbar verkan.',\n        'cap7-tag1': 'Telefon / e-post',\n        'cap7-tag2': 'Omedelbar',\n        'cap8-title': 'Samtalsöverföring',\n        'cap8-desc': 'Om patienten vill prata med en medarbetare, om ett tekniskt fel uppstår eller om Anna inte kan svara, meddelar hon automatiskt receptionen för återringning — patienten lämnas aldrig utan svar.',\n        'cap8-tag1': 'Återringning',\n        'cap8-tag2': 'Säkerhetsnät',\n        'cap-stat1-label': 'Inbyggda verktyg för patientkommunikation',\n        'cap-stat2-label': 'Språk som talas flytande',\n        'cap-stat3-label': 'Tillgänglig dag och natt, även på helgdagar',\n        'cap-stat3-value': '24/7',\n        'lang-title': 'Elva språk, en röst',\n        'lang-subtitle': 'Automatisk språkdetektering — alla funktioner tillgängliga på alla språk',\n        'lang-auto': 'Automatisk identifiering',\n        'lang-desc': 'Anna känner automatiskt igen patientens språk i början av samtalet och fortsätter konversationen på det språket. SMS, e-post och kalenderposter skapas också på patientens modersmål — så att utländska patienter känner sig hemma i praktiken och aldrig har en kommunikationsnackdel.',\n        'lang-feat1-title': 'Muntlig kommunikation',\n        'lang-feat1-desc': 'Live-röst, naturligt tal',\n        'lang-feat2-title': 'Språkspecifik SMS',\n        'lang-feat2-desc': 'Bekräftelse på patientens språk',\n        'lang-feat3-title': 'Flerspråkig e-post',\n        'lang-feat3-desc': 'Kalenderbeskrivning på 11 språk, automatiskt genererad',\n        'roi-email-btn': 'Dela via e-post',\n        'roi-email-prompt': 'Skicka resultatet till dig själv!',\n        'roi-email-send': 'Skicka',\n        'roi-email-success': 'Skickat! Kontrollera din inkorg.'\n      ,\n        'roi-email-error': 'Ett fel uppstod vid sändningen. Försök igen!'\n      ,\n        'roi-email-subject': 'Ditt ROI-kalkylatorresultat'\n      ,\n        'roi-email-greeting': 'Bästa'\n      ,\n        'roi-email-closing': 'Vänliga hälsningar, DentAi-teamet'\n      ,\n        'roi-name-placeholder': 'Namn'\n      ,\n        'roi-email-placeholder': 'email@exempel.se'\n      ,\n        'roi-sub': 'Hur mycket tar Anna in?',\n        'roi-title': 'ROI-kalkylator — på 30 sekunder',\n        'roi-desc': 'Ställ in klinikens dagliga samtalvolum — vi beräknar hur mycket intäkter som går förlorade med missade samtal och hur mycket Anna tar tillbaka.',\n        'roi-inputs-title': 'Din klinik',\n        'roi-inputs-desc': 'Dra i reglagen — resultaten uppdateras omedelbart.',\n        'roi-calls-label': 'Hur många samtal tar du emot dagligen?',\n        'roi-calls-unit': 'samtal/dag',\n        'roi-missed-label': 'Missade samtal andel',\n        'roi-missed-hint': 'Helger, lunchtid, parallella samtal, språkbarriärer.',\n        'roi-value-label': 'Genomsnittligt behandlingsvärde',\n        'roi-result-label': 'Beräknad avkastning',\n        'roi-monthly-label': 'Månatlig återvunnen intäkt',\n        'roi-yearly-label': 'Per år',\n        'roi-bookings-label': 'Extra bokningar/månad',\n        'roi-monthly-sub': '',\n        'roi-cta': 'Begär demo →',\n        'roi-disclaimer': 'Uppskattning. Faktiska resultat beror på klinikprofil och behandlingsförhållanden.',\n        'roi-value-currency': 'kr'},\nfi: {\n        'page-title': 'Anna — DentAi Senior Avustaja | Ympärivuorokautinen puhelinvastaus & ajanvaraus',\n        'brand-suffix': '-AI',\n        'senior-badge': 'Senior AI Avustaja',\n        'hero-h1-1': 'Ei enää',\n        'hero-h1-2': 'vastaamattomia puheluita.',\n        'hero-desc': 'Tapaa <strong class=\"text-slate-800\">Anna<\u002Fstrong> — DentAi Senior Avustaja, joka vastaa puheluihin <strong class=\"text-slate-800\">vuorokauden ympäri<\u002Fstrong>, varaa aikoja ja lähettää välittömiä vahvistuksia — jotta vastaanotto voi vihdoin keskittyä potilaisiin.',\n        'hero-call': 'Puhu Annalle',\n        'hero-hangup': 'Lopeta puhelu',\n        'hero-calendar': 'Katso kalenteri',\n        'feat-1': 'Ympärivuorokautinen puhelinvastaus',\n        'feat-2': 'Automaattinen vahvistus',\n        'feat-3': '11 kieltä',\n        'status-ready': 'Anna on valmis — soita hänelle!',\n        'status-connecting': 'Y tle': 'Älykäs tarvekartoitus',\n        'step2-desc': 'Anna analysoi potilaan pyynnön — akuutti hammaskipu, rutiininomainen hammaspuhdistus tai konsultaatio — ja ohjaa välittömästi oikealle erikoislääkärille.',\n        'step2-tag1': 'Hoidon tarpeen arviointi',\n        'step2-tag2': 'Monikielinen',\n        'step3-title': 'Kalenterisynkronointi',\n        'step3-desc': 'Anna näkee vapaat ajat reaaliajassa ja varaa välittömästi — tai muuttaa jos potilas haluaa toisen ajan.',\n        'step3-tag1': 'Reaaliaika',\n        'step3-tag2': 'Varaus/Muutos',\n        'step4-title': 'Ammattitietoa',\n        'step4-desc': 'Anna vastaa kysymyksiin hoidoista ja vastaanoton toiminnasta, jotta potilas saa kaiken tarvittavan tiedon päätöksentekoa varten.',\n        'step4-tag1': 'Sähköposti',\n        'step4-tag2': 'Tekstiviesti',\n        'step4-tag3': 'Kalenteri',\n        'care-sub': 'Automaattinen seuranta',\n        'care-title': 'Paikalla sekä ennen että jälkeen ajan',\n        'care-desc': 'Anna ei vain varaa — hän huolehtii kaikesta. Päivä ennen hoitoa hän lähettää muistutuksen, ja päivä sen jälkeen hän kysyy miten meni. Potilas ei koskaan tunne olevansa unohdettu, ja vastaanotto saa palautetta laadusta reaaliajassa.',\n        'care1-title': 'Tekstiviestimuistutus ennen aikaa',\n        'care1-subtitle': 'Automaattinen — Ilman ihmisen väliintuloa',\n        'care1-desc': 'Aamuna ennen hoitoa Anna lähettää automaattisesti tekstiviestin potilaalle tulevasta ajasta, estääkseen sen unohtumisen. Tämä vähentää ei-esittymisten määrää dramaattisesti ja vapauttaa vastaanoton täysin manuaalisista muistutuksista.',\n        'care1-tag1': 'Twilio SMS',\n        'care1-tag2': 'Google Kalenteri',\n        'care1-tag3': 'Ajastettu',\n        'care1-step1-title': 'Ajastus: joka aamu',\n        'care1-step1-desc': 'Järjestelmä lähettää muistutus-tekstiviestin joka aamu seuraavan päivän varauksille',\n        'care1-step2-title': 'Kalenterihaku',\n        'care1-step2-desc': 'Anna hakee t
