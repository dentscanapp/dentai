rijk transparant te zijn over de gebruikte dienstverleners. Website- en API-verkeer loopt via het Cloudflare CDN, en spraakverwerking wordt geleverd door ElevenLabs — beide zijn Amerikaanse aanbieders die werken met Standard Contractual Clauses (SCC) en een verwerkersovereenkomst (DPA), maar gegevens kunnen toch worden overgedragen aan derde landen (VS). Voor productief gebruik moet elke praktijk een eigen DPA sluiten met de aanbieders, de gegevensoverdracht en de rechtsgrondslag in de privacyverklaring vermelden, en een Gegevensbeschermingseffectbeoordeling (DPIA) wordt aanbevolen. Het bespreken van gedetailleerde gezondheidsklachten (bijzondere categorieën, AVG art. 9) vereist een aparte uitdrukkelijke toestemming. Raadpleeg voor productielancering altijd een privacy-expert/jurist.',\n        'faq7-q': 'Hoe wordt Anna aan een telefoonnummer gekoppeld?',\n        'faq7-a': 'Er zijn twee benaderingen. Nieuw nummer: bij Twilio of een andere VoIP-aanbieder kunt u een telefoonnummer kopen dat direct naar de ElevenLabs Conversational AI Agent wordt geleid — met de Twilio-integratie is dit binnen enkele uren ingesteld. Doorschakeling van het bestaande nummer: op het huidige praktijknummer kunt u een tijdgestuurde doorschakeling instellen (bijv. alleen buiten kantooruren of bij een bezette lijn), zodat Anna alleen antwoordt als de receptie niet beschikbaar is. De exacte configuratie wordt individueel afgestemd op de infrastructuur van elke praktijk.',\n        'faq8-q': 'Hoe werkt de toestemming bij een telefoongesprek?',\n        'faq8-a': 'Bij het aannemen van de oproep informeert Anna in haar eerste zin de beller: een AI-assistente spreekt, het gesprek kan worden opgenomen voor kwaliteitscontrole, en een terugbelverzoek aan een menselijke medewerker kan altijd worden ingediend (Anna kan op verzoek een terugbelverzoek doorgeven). Als de patiënt het gesprek voortzet, wordt dit beschouwd als impliciete toestemming (AVG art. 6 lid 1 a en b). Voor het bespreken van gedetailleerde gezondheidsklachten (bijv. pijn, medicijnen) is een aanvullende uitdrukkelijke bevestiging vereist. Het feit en het tijdstip van de toestemming worden door het systeem geregistreerd.',\n        'faq10-q': 'Hoe hoog zijn de lopende kosten?',\n        'faq10-a': '<p>Deze worden door de praktijk direct aan de dienstverleners betaald. De bedragen kunnen variëren afhankelijk van het belvolume (aantal en duur van de gesprekken). Anna genereert daarnaast dagelijks content voor Facebook en LinkedIn.<\u002Fp><ul class=\"space-y-1.5 list-disc pl-5\"><li><strong class=\"text-slate-700\">Domeinnaam:<\u002Fstrong> 8 – 20 € / jaar<\u002Fli><li><strong class=\"text-slate-700\">Make.com (Logica):<\u002Fstrong> ca. 110 € / jaar<\u002Fli><li><strong class=\"text-slate-700\">ElevenLabs (Stem):<\u002Fstrong> 125 – 250 € / jaar<\u002Fli><li><strong class=\"text-slate-700\">Twilio (SMS):<\u002Fstrong> 50 – 150 € / jaar<\u002Fli><li><strong class=\"text-slate-700\">Cloudflare (Code):<\u002Fstrong> 0 €<\u002Fli><li><strong class=\"text-slate-700\">Webhosting:<\u002Fstrong> 0 – 38 € / jaar<\u002Fli><li><strong class=\"text-slate-700\">Claude AI (Tekstgeneratie):<\u002Fstrong> ca. 5 € / jaar<\u002Fli><li><strong class=\"text-slate-700\">Pollinations AI (Afbeeldinggeneratie):<\u002Fstrong> 0 € (gratis)<\u002Fli><\u002Ful><div class=\"bg-slate-50 rounded-xl px-4 py-2.5 border border-slate-200/60 -ml-1\"><p class=\"text-sm font-semibold text-slate-800\">Totaal: <span class=\"text-dental-700\">ca. 298 – 573 € / jaar<\u002Fspan><\u002Fp><\u002Fdiv><p class=\"text-xs text-slate-400 italic\">Belangrijk voor de praktijk: Langere gesprekken betekenen meer tekens. Meer oproepen betekenen een hogere rekening. Meer SMS\\'en betekenen een hogere rekening. Dit zijn slechts geschatte waarden.<\u002Fp>',\n\n        'demo-sub': 'Live demo',\n        'demo-title': 'Probeer Anna!',\n        'demo-desc': 'Spreek met haar aan de telefoon, of bekijk de beschikbare tijden in realtime — en ervaar hoe het is als er niets meer door de mazen glipt.',\n        'demo-what': 'Wat u Anna kunt vragen',\n        'demo-what-sub': 'Gewoon natuurlijk praten — Anna begrijpt u!',\n        'prompt1-title': 'Afspraak boeken',\n        'prompt1-text': '«Ik wil graag een gebitsreiniging boeken voor volgende week dinsdag om 14:00»',\n        'prompt2-title': 'Afspraak wijzigen',\n        'prompt2-text': '«Ik moet mijn afspraak van morgen verzetten naar donderdag»',\n        'prompt3-title': 'Acute kiespijn',\n        'prompt3-text': '«Mijn tand doet pijn en het wordt erger — kunt u mij vandaag nog behandelen?»',\n        'prompt4-title': 'Informatie over behandelingen',\n        'prompt4-text': 'Anna beantwoordt vragen over behandelingen en de praktijkvoering, zodat uw patiënten optimaal geïnformeerd zijn.',\n        'demo-available': 'Anna beschikbaar',\n        'demo-response': 'Antwoord <2 sec',\n        'demo-voice': 'Spraakgesprek met Anna',\n        'cal-title': 'Anna\\'s live-agenda',\n        'cal-sub': 'Beschikbare tijden in realtime',\n        'cal-sync': 'Sync:',\n        'cal-auto': 'Automatische update elke 30 seconden',\n        'cal-refresh': 'Nu vernieuwen',\n        'cal-loading': 'Agenda van Anna laden...',\n        'cal-err-title': 'Agenda momenteel niet beschikbaar',\n        'cal-err-desc': 'Probeer het later opnieuw of bel Anna direct.',\n        'cal-err-retry': 'Opnieuw proberen',\n        'footer-desc': 'Anna — de DentAi Senior Assistente. 24/7 oproepafhandeling, online boeking en automatische bevestiging, zodat uw praktijk altijd soepel draait.',\n        'footer-langs': 'Talen',\n        'footer-info-title': 'Informatie',\n        'footer-portfolio': 'Portfolio-demo Gemaakt door: Peter Petor',\n        'footer-impressum': 'Impressum',\n        'footer-privacy': 'Privacyverklaring',\n        'footer-gdpr': 'Juridische disclaimer: Dit is een portfolio-demo. Geef alstublieft geen echte gegevens! Ik aanvaard geen aansprakelijkheid voor AI-antwoorden.',\n        'footer-copy': '© 2026 DentAi Assistente. Alle rechten voorbehouden. Aangedreven door Anna AI.',\n        'time-past': 'Het gekozen tijdstip ligt in het verleden. Kies alstublieft een toekomstig tijdstip.',\n        'time-too-close': 'Te kort dag — boekingen moeten minimaal 2 uur van tevoren worden gedaan.',\n        'time-too-late': 'Het gekozen tijdstip is te laat — de behandeling past niet binnen de openingstijden (08:00–18:00).',\n        'time-closed': 'De praktijk is op dit tijdstip gesloten. Openingstijden: Ma–Vr 08:00–18:00.',\n        'time-invalid': 'Ongeldig tijdstip. Kies alstublieft een ander.',\n        'time-suggest-prefix': 'Beschikbare tijden:',\n        'time-booking-sent': 'Boeking verzonden — bevestiging volgt!',\n        'legal-title': 'Juridische informatie',\n        'legal-tab-impressum': 'Impressum',\n        'legal-tab-privacy': 'Privacyverklaring',\n        'legal-close': 'Sluiten',\n        'imp-intro': 'Deze website is een portfoliodemonstratie, beheerd door de hieronder vermelde particuliere persoon. Er worden geen echte gezondheidsdiensten aangeboden.',\n        'imp-name-label': 'Beheerder:',\n        'imp-name-value': 'Peter Petor (particulier)',\n        'imp-email-label': 'E-mailadres:',\n        'imp-purpose-label': 'Doel van de site:',\n        'imp-purpose-value': 'Portfolio / technologiedemo (geen commerciële dienst)',\n        'imp-host-label': 'Hostingprovider:',\n        'imp-host-value': 'Cloudflare, Inc. (101 Townsend St, San Francisco, CA 94107, VS)',\n        'imp-legal-basis': 'Rechtsgrondslag: Wet CVIII van 2001 van Hongarije inzake elektronische handelsdiensten. De naam « DentAi Assistente » is fictief en dient uitsluitend demonstratiedoeleinden — er bestaat geen echte gezondheidsinstelling onder deze naam.',\n        'priv-intro': 'Deze verklaring informeert over de gegevensverwerking bij het bezoeken van deze website conform de AVG (EU 2016/679) en de Hongaarse Informatiewet (Wet CXII van 2011).',\n        'priv-h1': '1. Verwerkingsverantwoordelijke',\n        'priv-p1': 'Peter Petor, particulier. Contact: info@dentai.me. Deze site is een portfolio-demo; er vindt geen echte verwerking van gezondheidsgegevens plaats.',\n        'priv-h2': '2. Verwerkte gegevens en doeleinden',\n        'priv-li2-1': '<strong>Technische gegevens:<\u002Fstrong> IP-adres, browser-/apparaattype, bezoekduur — uitsluitend voor de technische werking van de website en om veiligheidsredenen (Cloudflare).',\n        'priv-li2-2': '<strong>Spraakgegevens (alleen bij gespreksstart):<\u002Fstrong> Audio van uw microfoon wordt tijdelijk verwerkt om het gesprek te genereren (ElevenLabs). Deel alstublieft geen echte persoonlijke gegevens!',\n        'priv-li2-3': '<strong>LocalStorage:<\u002Fstrong> In uw browser wordt een markering opgeslagen dat u de juridische kennisgeving heeft geaccepteerd — deze wordt niet naar een server verzonden.',\n        'priv-h3': '3. Derde partijen (internationale gegevensoverdracht)',\n        'priv-p3': 'De site laadt bronnen van de volgende derde partijen. Daardoor kunnen uw IP-adres en browsergegevens worden overgedragen aan derde landen (meestal de VS), waar het desbetreffende privacybeleid van de aanbieder geldt:',\n        'priv-li3-1': '<strong>Cloudflare<\u002Fstrong> (CDN, hosting) — <a href=\"https://www.cloudflare.com/privacypolicy/\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">privacypolicy<\u002Fa>',\n        'priv-li3-2': '<strong>Google Fonts<\u002Fstrong> (lettertypen) — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-li3-3': '<strong>Tailwind CDN<\u002Fstrong> (CSS-framework)',\n        'priv-li3-4': '<strong>ElevenLabs<\u002Fstrong> (spraak-AI) — <a href=\"https://elevenlabs.io/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">elevenlabs.io/privacy<\u002Fa>',\n        'priv-li3-5': '<strong>Google Agenda<\u002Fstrong> — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-h4': '4. Rechtsgrondslag en bewaartermijn',\n        'priv-p4': 'Technische gegevens worden verwerkt op basis van AVG art. 6 lid 1 f (gerechtvaardigd belang — veilige websiteexploitatie). Spraakinteractie vindt plaats op basis van toestemming (AVG art. 6 lid 1 a), die voor het gesprek in de pop-up wordt gegeven. Spraakgegevens worden niet langdurig opgeslagen.',\n        'priv-h5': '5. Uw rechten',\n        'priv-p5': 'U heeft het recht op inzage, rectificatie, verwijdering en bezwaar met betrekking tot uw gegevens. Aanvragen naar info@dentai.me. Klachten kunnen worden ingediend bij de Autoriteit Persoonsgegevens.',\n        'priv-h6': '6. Aansprakelijkheidsuitsluiting',\n        'priv-p6': 'Dit is een portfolio-demo. Door AI gegenereerde antwoorden vormen geen medisch advies. De beheerder aanvaardt geen aansprakelijkheid voor door de gebruiker verstrekte gegevens of voor schade voortvloeiend uit AI-antwoorden.',\n        'priv-updated': 'Geldig vanaf: 26 april 2026.',\n        'modal-title': 'Toestemmingsverklaring',\n        'modal-text': 'Dit gesprek wordt afgehandeld door kunstmatige intelligentie (AI). Tijdens het gesprek worden spraakgegevens verwerkt. Door het gesprek te starten, accepteert u dat de AI antwoorden genereert en dat het gesprek geen medisch advies vormt.',\n        'modal-checkbox': 'Ik heb bovenstaande kennisgeving gelezen en accepteer deze.',\n        'modal-cancel': 'Annuleren',\n        'modal-accept': 'Ik accepteer',\n\n        'cap-sub': 'Anna\\'s mogelijkheden',\n        'cap-title': 'Alles wat een receptioniste moet weten',\n        'cap-desc': 'Van boeken tot annuleren en de wachtlijst — Anna behandelt zelfstandig en in realtime de volledige patiëntcommunicatie telefonisch. Elke functie is beschikbaar in alle ondersteunde talen.',\n        'cap1-title': 'Beschikbare afspraken',\n        'cap1-desc': 'Anna zoekt in realtime naar beschikbare plekken in Google Agenda — gefilterd op datum, dagdeel of arts. De patiënt krijgt direct een overzicht van de opties.',\n        'cap1-tag2': 'Realtime',\n        'cap2-title': 'Afspraak boeken',\n        'cap2-desc': 'Met opgave van de naam, het e-mailadres en de gewenste tijd van de patiënt legt Anna de boeking vast in de agenda en stuurt onmiddellijk een bevestigings-sms en -e-mail.',\n        'cap2-tag1': 'Bevestiging',\n        'cap3-title': 'Afspraak wijzigen',\n        'cap3-desc': 'Als de patiënt een andere tijd wil, annuleert Anna de oude en boekt een nieuwe — ze controleert ook de beschikbaarheid van de nieuwe tijd in de agenda zodat er geen conflicten ontstaan.',\n        'cap3-tag1': 'Oud → Nieuw',\n        'cap3-tag2': 'Gecontroleerd',\n        'cap4-title': 'Afspraak annuleren',\n        'cap4-desc': 'De patiënt kan de annulering bevestigen — Anna verwijdert de afspraak uit de agenda en stuurt een annuleringsbevestiging per sms en e-mail in de juiste taal.',\n        'cap4-tag1': 'Melding',\n        'cap4-tag2': 'Agenda-update',\n        'cap5-title': 'Afspraken opvragen',\n        'cap5-desc': 'Als de patiënt zich de afspraak niet meer herinnert, haalt Anna komende afspraken op via telefoon of e-mail en leest ze voor om wijziging of annulering te vergemakkelijken.',\n        'cap5-tag1': 'Zoeken',\n        'cap5-tag2': 'Patiëntidentificatie',\n        'cap6-title': 'Wachtlijst',\n        'cap6-desc': 'Als er geen afspraak beschikbaar is, zet Anna de patiënt op de prioriteitswachtlijst — met de gewenste tijdsvakken. Als er een plek vrijkomt, wordt de patiënt automatisch op de hoogte gebracht.',\n        'cap6-tag1': 'Prioriteit',\n        'cap6-tag2': 'Automatische melding',\n        'cap7-title': 'Gegevens wijzigen',\n        'cap7-desc': 'Als de patiënt een nieuw telefoonnummer of e-mailadres heeft, werkt Anna de gegevens bij in het systeem — op basis van de huidige e-mailidentificatie, met onmiddellijke ingang.',\n        'cap7-tag1': 'Telefoon / e-mail',\n        'cap7-tag2': 'Onmiddellijk',\n        'cap8-title': 'Oproep doorverbinden',\n        'cap8-desc': 'Als de patiënt met een medewerker wil spreken, er een technische fout optreedt of Anna niet kan antwoorden, brengt ze automatisch de receptie op de hoogte voor een terugbelverzoek — de patiënt blijft nooit zonder antwoord.',\n        'cap8-tag1': 'Terugbellen',\n        'cap8-tag2': 'Vangnet',\n        'cap-stat1-label': 'Ingebouwde tools voor patiëntcommunicatie',\n        'cap-stat2-label': 'Talen waarin vloeiend wordt gecommuniceerd',\n        'cap-stat3-label': 'Dag en nacht beschikbaar, ook op feestdagen',\n        'cap-stat3-value': '24/7',\n        'lang-title': 'Elf talen, één stem',\n        'lang-subtitle': 'Automatische taaldetectie — elke functie beschikbaar in elke taal',\n        'lang-auto': 'Automatische detectie',\n        'lang-desc': 'Anna herkent de taal van de patiënt automatisch aan het begin van het gesprek en gaat door in die taal. SMS-berichten, e-mails en agenda-items worden ook in de moedertaal van de patiënt aangemaakt — zodat internationale patiënten zich thuis voelen in de praktijk en nooit een communicatieachterstand oplopen.',\n        'lang-feat1-title': 'Spraakcommunicatie',\n        'lang-feat1-desc': 'Live stem, natuurlijk gesproken',\n        'lang-feat2-title': 'Taalspecifieke SMS',\n        'lang-feat2-desc': 'Bevestiging in de taal van de patiënt',\n        'lang-feat3-title': 'Meertalige e-mail',\n        'lang-feat3-desc': 'Agendabeschrijving in 11 talen, automatisch gegenereerd',\n        'roi-email-btn': 'Deel per e-mail',\n        'roi-email-prompt': 'Stuur het resultaat naar uzelf!',\n        'roi-email-send': 'Verzenden',\n        'roi-email-success': 'Verzonden! Controleer uw inbox.'\n      ,\n        'roi-email-error': 'Er is een fout opgetreden bij het verzenden. Probeer het opnieuw!'\n      ,\n        'roi-email-subject': 'Uw ROI-calculatorresultaat'\n      ,\n        'roi-email-greeting': 'Beste'\n      ,\n        'roi-email-closing': 'Met vriendelijke groet, Het DentAi-team'\n      ,\n        'roi-name-placeholder': 'Naam'\n      ,\n        'roi-email-placeholder': 'email@voorbeeld.nl'\n      ,\n        'roi-sub': 'Hoeveel brengt Anna in?',\n        'roi-title': 'ROI-calculator — in 30 seconden',\n        'roi-desc': 'Stel het dagelijkse belvolume van uw praktijk in — wij berekenen hoeveel omzet u mist door gemiste oproepen en hoeveel Anna terugbrengt.',\n        'roi-inputs-title': 'Uw praktijk',\n        'roi-inputs-desc': 'Beweg de schuifregelaars — resultaten worden direct bijgewerkt.',\n        'roi-calls-label': 'Hoeveel oproepen ontvangt u dagelijks?',\n        'roi-calls-unit': 'oproepen/dag',\n        'roi-missed-label': 'Gemiste oproepen percentage',\n        'roi-missed-hint': 'Weekenden, lunchtijd, parallelle oproepen, taalbarrières.',\n        'roi-value-label': 'Gemiddelde behandelduur waarde',\n        'roi-result-label': 'Geschat rendement',\n        'roi-monthly-label': 'Maandelijks teruggevonden omzet',\n        'roi-yearly-label': 'Per jaar',\n        'roi-bookings-label': 'Extra boekingen/maand',\n        'roi-monthly-sub': '',\n        'roi-cta': 'Demo aanvragen →',\n        'roi-disclaimer': 'Schatting. Werkelijke resultaten zijn afhankelijk van praktijkprofiel en behandelverhoudingen.',\n        'roi-value-currency': '€'},\n\n      fr: {\n        'page-title': 'Anna — DentAi Assistante Senior | Gestion d\\'appels 24/7 & Prise de rendez-vous',\n        'brand-suffix': '-AI',\n        'senior-badge': 'Assistante IA Senior',\n        'hero-h1-1': 'Plus jamais',\n        'hero-h1-2': 'd\\'appel manqué.',\n        'hero-desc': 'Découvrez <strong class=\"text-slate-800\">Anna<\u002Fstrong> — l\\'Assistante Senior DentAi, qui gère les appels <strong class=\"text-slate-800\">24h/24, 7j/7<\u002Fstrong>, réserve des rendez-vous et envoie des confirmations instantanées — pour que votre réception puisse se consacrer aux patients.',\n        'hero-call': 'Parler à Anna',\n        'hero-hangup': 'Raccrocher',\n        'hero-calendar': 'Voir le calendrier',\n        'feat-1': 'Gestion d\\'appels 24/7',\n        'feat-2': 'Confirmation automatique',\n        'feat-3': '11 langues',\n        'status-ready': 'Anna est prête — appelez !',\n        'status-connecting': 'Connexion à Anna...',\n        'status-listening': 'Anna écoute — dites-lui comment elle peut vous aider',\n        'status-speaking': 'Anna vous répond',\n        'error-server': 'Impossible de démarrer l\\'appel. Le serveur est indisponible.',\n        'error-mic': 'L\\'autorisation du microphone est requise pour passer un appel. Veuillez activer l\\'accès au microphone dans les paramètres de votre navigateur et réessayer.',\n        'error-no-url': 'Impossible de se connecter à Anna (signed URL manquante). Veuillez réessayer plus tard !',\n\n        'header-available': 'Anna disponible',\n        'header-connecting': 'Connexion...',\n        'header-listening': 'Anna écoute...',\n        'header-speaking': 'Anna parle...',\n        'mobile-available': 'Anna disponible',\n        'menu-label': 'Menu',\n        'menu-close': 'Fermer',\n        'float-1': 'Appel entrant',\n        'float-2': 'Rendez-vous réservé',\n        'float-3': 'Confirmation envoyée',\n        'phone-anna-name': 'Anna',\n        'phone-anna-role': 'Assistante Senior · En ligne',\n        'chat-1': 'Bonsoir ! Je voudrais réserver un détartrage pour demain matin.',\n        'chat-2': 'Bonsoir ! Je vérifie nos disponibilités. Demain matin, nous avons des créneaux à 9h00 et 11h30. Lequel vous convient ?',\n        'chat-3': '9h00 serait parfait !',\n        'chat-4': 'C\\'est noté ! Rendez-vous demain à 9h00. Je vous envoie une confirmation par SMS et e-mail.',\n        'chat-input': 'Écrivez un message à Anna...',\n        'how-title-sub': 'Comment ça marche',\n        'how-title': 'Un cabinet serein en quatre étapes',\n        'how-desc': 'Automatisation complète de l\\'appel à la visite. Le patient prend simplement rendez-vous — Anna s\\'occupe du reste.',\n        'step1-title': 'Demande entrante',\n        'step1-desc': 'Le patient appelle ou réserve en ligne — Anna décroche immédiatement, jour et nuit. Pas d\\'attente, pas de ligne occupée.',\n        'step1-tag1': 'Téléphone',\n        'step1-tag2': 'Réservation en ligne',\n        'step2-title': 'Évaluation intelligente',\n        'step2-desc': 'Anna analyse la demande du patient — mal de dents urgent, nettoyage de routine ou consultation — et l\\'oriente vers le bon spécialiste immédiatement.',\n        'step2-tag1': 'Triage',\n        'step2-tag2': 'Multilingue',\n        'step3-title': 'Synchronisation calendrier',\n        'step3-desc': 'Anna voit les créneaux disponibles en temps réel et réserve le rendez-vous instantanément — ou le modifie si le patient le souhaite.',\n        'step3-tag1': 'Temps réel',\n        'step3-tag2': 'Réserver/Modifier',\n        'step4-title': 'Information professionnelle',\n        'step4-desc': 'Anna répond aux questions sur les traitements et le fonctionnement du cabinet, afin que les patients disposent de toutes les informations nécessaires.',\n        'step4-tag1': 'E-mail',\n        'step4-tag2': 'SMS',\n        'step4-tag3': 'Calendrier',\n        'care-sub': 'Suivi automatique',\n        'care-title': 'Avant et après le rendez-vous',\n        'care-desc': 'Anna ne se contente pas de réserver — elle prend soin. Le matin précédant le traitement, elle rappelle ; le jour suivant, elle fait un suivi. Le patient ne se sent jamais oublié, et le cabinet reçoit de vrais retours sur la qualité.',\n        'care1-title': 'SMS de rappel avant le rendez-vous',\n        'care1-subtitle': 'Automatique — Sans intervention humaine',\n        'care1-desc': 'Le matin précédant le traitement, Anna envoie automatiquement un SMS au patient concernant son rendez-vous du lendemain pour prévenir l\\'oubli. Ce processus réduit considérablement le taux d\\'absentéisme et libère entièrement la réception du travail de rappel manuel.',\n        'care1-tag1': 'Twilio SMS',\n        'care1-tag2': 'Google Calendar',\n        'care1-tag3': 'Planifié',\n        'care1-step1-title': 'Planification : chaque matin',\n        'care1-step1-desc': 'Le système envoie chaque matin des SMS de rappel pour les rendez-vous du lendemain',\n        'care1-step2-title': 'Recherche calendrier',\n        'care1-step2-desc': 'Anna récupère l\\'événement depuis Google Calendar et vérifie les détails',\n        'care1-step3-title': 'Envoi SMS (Twilio)',\n        'care1-step3-desc': 'SMS de rappel personnalisé — nom, horaire et lieu inclus',\n        'care1-sms-header': 'Rappel · rendez-vous du lendemain',\n        'care1-sms-body': 'Rappel : votre rendez-vous dentaire pour demain',\n        'care1-sms-arrival': 'Merci d\\'arriver 10 minutes en avance.',\n        'care1-sms-date': '📅 29/04/2026 · 10:00',\n        'care1-sms-footer': '— Assistante DentAi',\n        'care1-sms-preview': 'Bonjour Jean Dupont ! 👋',\n        'care2-title': 'Suivi post-rendez-vous / Questionnaire',\n        'care2-subtitle': 'Automatique — Sans intervention humaine',\n        'care2-desc': 'Le jour suivant le traitement, Anna envoie un e-mail avec un court questionnaire où le patient peut évaluer le service. Les retours sont automatiquement enregistrés, permettant au cabinet d\\'améliorer continuellement la qualité sans saisie manuelle des données.',\n        'care2-tag1': 'Gmail',\n        'care2-tag2': 'Statistiques',\n        'care2-tag3': 'Planifié',\n        'care2-step1-title': 'Planification : le lendemain du traitement',\n        'care2-step1-desc': 'Le lendemain du traitement, le système envoie des e-mails de questionnaire aux patients',\n        'care2-step2-title': 'E-mail questionnaire (Gmail)',\n        'care2-step2-desc': 'E-mail personnalisé avec lien vers le questionnaire — satisfaction, expérience, suggestions',\n        'care2-step3-title': 'Enregistrement des statistiques',\n        'care2-step3-desc': 'Les réponses sont automatiquement ajoutées à l\\'onglet statistiques Google Sheets',\n        'care2-email-from': 'DentAi Assistante',\n        'care2-email-to': '→ jean.dupont@email.fr',\n        'care2-email-subject': 'Votre avis sur votre visite – DentAi',\n        'care2-email-body': 'Bonjour Jean Dupont ! Nous espérons que votre visite s\\'est bien déroulée. Votre opinion compte pour nous : partagez votre expérience dans un bref questionnaire afin que nous puissions encore améliorer nos soins.',\n        'care2-email-cta': '→ Remplir le questionnaire',\n        'care-stat1-value': '~40%',\n        'care-stat1-label': 'Réduction des absences grâce aux rappels',\n        'care-stat2-value': '0',\n        'care-stat2-label': 'Travail manuel et processus entièrement automatisé',\n        'care-stat3-value': '24h',\n        'care-stat3-label': 'Retour après le traitement',\n        'flow-1': 'Appel entrant/Web',\n        'flow-2': 'Évaluation',\n        'flow-3': 'Sync calendrier',\n        'flow-4': 'Confirmation',\n        'flow-done': 'C\\'est fait !',\n        'why-sub': 'Pourquoi Anna ?',\n        'why-title': 'Libérez votre réception — immédiatement',\n        'why-desc': 'Anna ne remplace pas votre réceptionniste — elle prend en charge les tâches répétitives pour que votre équipe puisse se concentrer sur l\\'essentiel.',\n        'ben1-title': 'Plus d\\'appels manqués',\n        'ben1-desc': 'Anna répond aux appels jour et nuit — pendant la pause déjeuner, le week-end et les jours fériés. Chaque patient peut parler à quelqu\\'un qui l\\'aide immédiatement.',\n        'ben2-title': 'Réception allégée',\n        'ben2-desc': 'Votre réception peut se concentrer sur les patients en personne et la communication, tandis qu\\'Anna gère les appels de routine en arrière-plan.',\n        'ben3-title': 'Onze langues, une seule voix',\n        'ben3-desc': 'Communique couramment en hongrois, anglais, allemand, néerlandais, français, italien, danois, norvégien, suédois, finnois et slovaque — les patients internationaux se sentent à l\\'aise dans le cabinet.',\n        'clinic-sub': 'Informations du cabinet',\n        'clinic-title': 'Détails du cabinet',\n        'clinic-desc': 'Anna connaît toutes les informations importantes du cabinet — des horaires d\\'ouverture à la durée des traitements.',\n        'clinic-details-title': 'Détails du cabinet',\n        'clinic-location-label': 'Adresse',\n        'clinic-location-value': 'Budapest, Ve arrondissement, Centre-ville',\n        'clinic-hours-label': 'Horaires d\\'ouverture',\n        'clinic-hours-value': 'Lundi–Vendredi 08:00–18:00',\n        'clinic-closed-label': 'Fermé',\n        'clinic-closed-value': 'Samedi, dimanche et jours fériés',\n        'clinic-doctors-label': 'Médecins',\n        'clinic-doctors-value': 'Dr. Kovács et Dr. Nagy',\n        'clinic-treatments-title': 'Traitements & Durée',\n        'clinic-treatments-note': 'Créneaux de 30 minutes',\n        'treat1-name': 'Examen / Consultation',\n        'treat1-dur': '30 min',\n        'treat2-name': 'Détartrage',\n        'treat2-dur': '30 min',\n        'treat4-name': 'Remplacement d\\'obturation',\n        'treat4-dur': '45 min',\n        'treat5-name': 'Traitement de canal',\n        'treat5-dur': '90 min',\n        'treat6-name': 'Soins d\\'urgence',\n        'treat6-dur': '60 min',\n\n        'faq-sub': 'Questions fréquentes',\n        'social-sub': 'Social AutoPilot',\n        'social-title': 'Anna publie pour vous',\n        'social-desc': 'Chaque jour, de nouveaux contenus générés par l\\'IA sur Facebook et LinkedIn — texte et images, entièrement automatisés.',\n        'social-card1-title': 'Création de contenu automatisée',\n        'social-card1-text': 'Chaque jour, Anna rédige un nouveau post professionnel couvrant un large éventail de sujets dentaires — du blanchiment dentaire aux implants, de la pédodontie aux soins d\\'urgence. L\\'IA choisit aléatoirement un sujet, puis rédige un texte formel et professionnel : titre, question, 3 à 5 conseils pratiques et un appel à l\\'action (CTA). Pas de répétition, pas de ton générique — chaque post est unique et original.',\n        'social-card2-title': 'L\\'IA génère les images',\n        'social-card2-text': 'Pour chaque post, Anna génère une image professionnelle sur le thème dentaire — environnement de cabinet propre et moderne, sourires éclatants, résultats esthétiques. Les images s\\'adaptent automatiquement au sujet du post, gardant votre contenu Facebook et LinkedIn visuellement attrayant et cohérent, sans photographe.',\n        'social-card2-tag2': 'Sans filigrane',\n        'social-card3-title': 'Facebook et LinkedIn',\n        'social-card3-text': 'Anna publie simultanément sur les deux plateformes : avec une photo sur la page Facebook et un contenu visuel sur la page entreprise LinkedIn. Les posts apparaissent instantanément — sans aucune validation requise. L\\'ensemble du processus fonctionne via le moteur d\\'automatisation Make.com, avec la rédaction de textes par Claude AI et la génération d\\'images par Pollinations AI.',\n        'social-benefit1-title': 'Gain de temps',\n        'social-benefit1-text': 'Plus besoin de rédiger, chercher des images ou publier — Anna s\\'occupe de tout',\n        'social-benefit2-title': 'Présence constante',\n        'social-benefit2-text': 'Du contenu frais quotidien garantit que votre cabinet ne paraît jamais inactif',\n        'social-benefit3-title': 'Portée croissante',\n        'social-benefit3-text': 'Les publications régulières augmentent la visibilité organique et attirent de nouveaux patients',\n        'social-benefit4-title': 'Crédibilité professionnelle',\n        'social-benefit4-text': 'Des posts de qualité et informatifs renforcent la réputation de votre cabinet et instaurent la confiance',\n        'social-follow-fb': 'Suivre sur Facebook',\n        'social-follow-li': 'Suivre sur LinkedIn',\n        'footer-contact': 'Contact',\n        'faq-title': 'Tout ce que vous voulez savoir',\n        'faq-desc': 'Les questions et réponses les plus courantes sur Anna — si vous ne trouvez pas ce que vous cherchez, n\\'hésitez pas à me contacter !',\n        'faq1-q': 'Fonctionne-t-elle avec mon numéro de téléphone actuel ?',\n        'faq1-a': 'Oui ! Anna répond aux appels sur votre numéro de téléphone existant — pas besoin d\\'un nouveau numéro, de changement d\\'opérateur ou d\\'équipement supplémentaire. Le système s\\'intègre de manière transparente à votre ligne téléphonique actuelle, afin que les patients puissent appeler le même numéro qu\\'ils connaissent déjà. L\\'installation ne prend que quelques minutes.',\n        'faq2-q': 'Que se passe-t-il si l\\'IA ne peut pas répondre ?',\n        'faq2-a': 'Si Anna reçoit une question à laquelle elle n\\'est pas préparée (par ex. une question médicale spécifique, la gestion d\\'une réclamation, un devis complexe), elle informe automatiquement la réception du cabinet pour un rappel — elle note les données du patient et les détails de la demande, afin que la réceptionniste puisse rappeler le patient dès que possible. Si le cabinet est fermé, Anna prend note de la demande, et la réceptionniste rappellera le patient le jour ouvrable suivant. Le patient n\\'est jamais laissé sans réponse.',\n        'faq3-q': 'Comment le système est-il accessible ?',\n        'faq3-a': 'Anna est actuellement disponible en tant que démo de portfolio — développée par Peter Petor à titre privé, pas encore commercialisée. Le site et la démo conversationnelle sont ouverts à tous, afin que cabinets, développeurs ou prospects puissent avoir un aperçu du fonctionnement. Pour un déploiement en production ou une collaboration sur mesure (programme pilote, intégration), veuillez me contacter à info@dentai.me.',\n        'faq4-q': 'Quelles langues parle-t-elle ?',\n        'faq4-a': 'Elle communique actuellement couramment en onze langues : hongrois, anglais, allemand, néerlandais, français, italien, danois, norvégien, suédois, finnois et slovaque. La sélection de la langue est automatique — Anna reconnaît la langue du patient et répond dans cette langue. C\\'est particulièrement précieux dans les régions touristiques où les patients internationaux appellent souvent le cabinet.',\n        'faq5-q': 'Comment gère-t-elle les urgences ?',\n        'faq5-a': 'En situation d\\'urgence — comme un mal de dents sévère, une urgence dentaire ou un saignement — Anna donne immédiatement la priorité à l\\'appel. Elle reconnaît les mots-clés d\\'urgence et recherche le rendez-vous le plus rapide possible le jour même. En cas de véritable urgence (par ex. fracture de la mâchoire, saignement incontrôlable), elle oriente le patient vers les soins d\\'urgence les plus proches. Les appels d\\'urgence ne sont jamais accidentellement traités comme des rendez-vous de routine.',\n        'faq6-q': 'Comment la protection des données (RGPD) est-elle gérée ?',\n        'faq6-a': 'Anna a été conçue en tenant compte des exigences du RGPD, mais il est important d\\'informer de manière transparente sur les prestataires utilisés. Le trafic web et les appels API passent par le CDN Cloudflare, et le traitement de la voix est assuré par ElevenLabs — tous deux sont des prestataires basés aux États-Unis, qui opèrent avec des Clauses Contractuelles Types (CCT) et un accord de traitement des données (DPA), mais des données peuvent néanmoins être transférées vers un pays tiers (États-Unis). Avant la mise en production, chaque cabinet doit signer son propre DPA avec ces prestataires, mentionner le transfert de données et sa base juridique dans sa politique de confidentialité, et il est recommandé de réaliser une analyse d\\'impact relative à la protection des données (AIPD). Les détails sur les plaintes de santé (catégorie particulière, article 9 du RGPD) nécessitent un consentement explicite distinct. Une consultation avec un expert en protection des données / un avocat est recommandée avant tout déploiement en production.',\n        'faq7-q': 'Comment Anna est-elle associée à un numéro de téléphone ?',\n        'faq7-a': 'Il existe deux approches principales. Attribution d\\'un nouveau numéro : un numéro peut être acheté chez Twilio ou un autre fournisseur VoIP (par ex. SIP trunk hongrois : Hipernet, Voipgate) et acheminé directement vers l\\'agent ElevenLabs Conversational AI — avec l\\'intégration Twilio, cela peut être configuré en quelques heures. Transfert d\\'appel du numéro existant : un transfert d\\'appel temporisé peut être configuré sur le numéro actuel du cabinet (par ex. uniquement en dehors des heures d\\'ouverture ou en cas de ligne occupée), de sorte qu\\'Anna ne prend l\\'appel que lorsque la réception n\\'est pas disponible. La configuration exacte est adaptée individuellement à l\\'infrastructure de chaque cabinet.',\n        'faq8-q': 'Comment fonctionne le consentement lors de l\\'appel téléphonique ?',\n        'faq8-a': 'Lors de la prise d\\'appel, dans sa première phrase Anna informe l\\'appelant : un assistant IA parle, l\\'appel peut être enregistré à des fins d\\'assurance qualité, et un rappel par un collaborateur humain peut être demandé à tout moment (Anna organise un rappel sur demande). Si le patient poursuit la conversation, cela vaut consentement par acte positif clair (RGPD article 6, paragraphe 1, points a) et b)). Pour la communication de plaintes de santé (par ex. douleur, médicaments), une confirmation explicite supplémentaire est requise. Le fait et l\\'horodatage du consentement sont enregistrés par le système.',\n        'faq10-q': 'À combien s\\'élèvent les coûts de fonctionnement annuels ?',\n        'faq10-a': '<p>Ces coûts sont payés par le cabinet directement aux prestataires. Les montants peuvent varier en fonction du trafic (nombre et durée des appels). Anna génère également du contenu quotidien pour Facebook et LinkedIn.<\u002Fp><ul class=\"space-y-1.5 list-disc pl-5\"><li><strong class=\"text-slate-700\">Nom de domaine :<\u002Fstrong> 8 – 20 € / an<\u002Fli><li><strong class=\"text-slate-700\">Make.com (Logique) :<\u002Fstrong> ~110 € / an<\u002Fli><li><strong class=\"text-slate-700\">ElevenLabs (Voix) :<\u002Fstrong> 125 – 250 € / an<\u002Fli><li><strong class=\"text-slate-700\">Twilio (SMS) :<\u002Fstrong> 50 – 150 € / an<\u002Fli><li><strong class=\"text-slate-700\">Cloudflare (Code) :<\u002Fstrong> 0 €<\u002Fli><li><strong class=\"text-slate-700\">Hébergement web :<\u002Fstrong> 0 – 38 € / an<\u002Fli><li><strong class=\"text-slate-700\">Claude AI (Génération de texte) :<\u002Fstrong> ~5 € / an<\u002Fli><li><strong class=\"text-slate-700\">Pollinations AI (Génération d\\'images) :<\u002Fstrong> 0 € (gratuit)<\u002Fli><\u002Ful><div class=\"bg-slate-50 rounded-xl px-4 py-2.5 border border-slate-200/60 -ml-1\"><p class=\"text-sm font-semibold text-slate-800\">Total : <span class=\"text-dental-700\">~298 – 573 € / an<\u002Fspan><\u002Fp><\u002Fdiv><p class=\"text-xs text-slate-400 italic\">Informations importantes pour le cabinet : des conversations plus longues signifient plus de caractères. Plus d\\'appels signifient une facture plus élevée. Plus de SMS signifient une facture plus élevée. Ce ne sont que des estimations.<\u002Fp>',\n\n        'demo-sub': 'Démo en direct',\n        'demo-title': 'Essayez Anna !',\n        'demo-desc': 'Parlez-lui au téléphone, ou consultez les créneaux disponibles en temps réel — et découvrez ce que c\\'est quand rien ne passe entre les mailles du filet.',\n        'demo-what': 'Que demander à Anna',\n        'demo-what-sub': 'Parlez simplement naturellement — Anna comprend !',\n        'prompt1-title': 'Prendre rendez-vous',\n        'prompt1-text': '« Je voudrais réserver un détartrage mardi prochain à 14h »',\n        'prompt2-title': 'Modifier un rendez-vous',\n        'prompt2-text': '« Je voudrais déplacer mon rendez-vous de demain à jeudi »',\n        'prompt3-title': 'Mal de dents urgent',\n        'prompt3-text': '« J\\'ai mal aux dents et ça empire — pouvez-vous me voir aujourd\\'hui ? »',\n        'prompt4-title': 'Information professionnelle',\n        'prompt4-text': 'Anna répond aux questions sur les traitements et le fonctionnement du cabinet, afin que les patients disposent de toutes les informations nécessaires.',\n        'demo-available': 'Anna disponible',\n        'demo-response': 'Réponse <2 sec',\n        'demo-voice': 'Conversation vocale avec Anna',\n        'cal-title': 'Calendrier en direct d\\'Anna',\n        'cal-sub': 'Créneaux disponibles en temps réel',\n        'cal-sync': 'Synchronisation :',\n        'cal-auto': 'Actualisation automatique toutes les 30 secondes',\n        'cal-refresh': 'Actualiser',\n        'cal-loading': 'Chargement du calendrier d\\'Anna...',\n        'cal-err-title': 'Calendrier actuellement indisponible',\n        'cal-err-desc': 'Veuillez réessayer plus tard ou appeler Anna directement.',\n        'cal-err-retry': 'Réessayer',\n        'footer-desc': 'Anna — l\\'Assistante Senior DentAi. Gestion d\\'appels 24/7, réservation en ligne et confirmation automatique, pour que votre cabinet fonctionne toujours sereinement.',\n        'footer-langs': 'Langues',\n        'footer-info-title': 'Informations',\n        'footer-portfolio': 'Démo Portfolio par : Peter Petor',\n        'footer-impressum': 'Mentions légales',\n        'footer-privacy': 'Politique de confidentialité',\n        'footer-gdpr': 'Avertissement : Ceci est une démo portfolio. Veuillez ne pas fournir de données réelles ! Je décline toute responsabilité pour les réponses de l\\'IA.',\n        'footer-copy': '© 2026 DentAi Assistante. Tous droits réservés. Propulsé par Anna IA.',\n        'time-past': 'Le créneau demandé est déjà passé. Veuillez choisir un créneau futur.',\n        'time-too-close': 'Trop tard — les réservations doivent être faites au moins 2 heures à l\\'avance.',\n        'time-too-late': 'Le créneau demandé est trop tardif — le traitement ne rentre pas dans les horaires d\\'ouverture (08h00–17h00).',\n        'time-closed': 'Le cabinet est fermé à cette heure. Horaires : Lun–Ven 08h00–17h00.',\n        'time-invalid': 'Créneau invalide. Veuillez en choisir un autre.',\n        'time-suggest-prefix': 'Créneaux disponibles :',\n        'time-booking-sent': 'Réservation envoyée — confirmation à venir !',\n        'legal-title': 'Informations juridiques',\n        'legal-tab-impressum': 'Mentions légales',\n        'legal-tab-privacy': 'Politique de confidentialité',\n        'legal-close': 'Fermer',\n        'imp-intro': 'Ce site web est une démonstration de portfolio gérée par la personne physique ci-dessous. Le site ne fournit aucun service de santé réel.',\n        'imp-name-label': 'Nom de l\\'exploitant :',\n        'imp-name-value': 'Peter Petor (particulier)',\n        'imp-email-label': 'Adresse e-mail :',\n        'imp-purpose-label': 'Objectif du site :',\n        'imp-purpose-value': 'Portfolio / démo technologique (pas un service commercial)',\n        'imp-host-label': 'Hébergeur :',\n        'imp-host-value': 'Cloudflare, Inc. (101 Townsend St, San Francisco, CA 94107, USA)',\n        'imp-legal-basis': 'Base juridique : Loi hongroise CVIII de 2001 sur les services de commerce électronique. Le nom « DentAi Assistante » est fictif et utilisé à des fins de démonstration uniquement — aucun établissement de santé réel n\\'existe sous ce nom.',\n        'priv-intro': 'Le présent avis décrit le traitement des données des visiteurs sur ce site web, conformément au RGPD (UE 2016/679) et à la loi hongroise sur l\\'information (loi CXII de 2011).',\n        'priv-h1': '1. Responsable du traitement',\n        'priv-p1': 'Peter Petor, particulier. Contact : info@dentai.me. Ce site est une démo portfolio ; aucun traitement de données de santé réel n\\'a lieu.',\n        'priv-h2': '2. Données traitées et finalités',\n        'priv-li2-1': '<strong>Données techniques :<\u002Fstrong> adresse IP, type de navigateur/appareil, heure de visite — uniquement pour le bon fonctionnement du site et pour la sécurité (Cloudflare).',\n        'priv-li2-2': '<strong>Données vocales (uniquement si vous lancez l\\'appel) :<\u002Fstrong> L\\'audio de votre microphone est temporairement traité pour générer la conversation (ElevenLabs). Veuillez ne pas partager de données personnelles réelles !',\n        'priv-li2-3': '<strong>LocalStorage :<\u002Fstrong> Un indicateur est stocké dans votre navigateur confirmant que vous avez accepté l\\'avis juridique — il n\\'est transmis à aucun serveur.',\n        'priv-h3': '3. Prestataires tiers (transfert international de données)',\n        'priv-p3': 'Le site charge des ressources provenant des prestataires tiers ci-dessous. Votre adresse IP et vos données de navigation peuvent donc être transférées vers des pays tiers (généralement les USA), où les propres politiques de confidentialité des prestataires concernés s\\'appliquent :',\n        'priv-li3-1': '<strong>Cloudflare<\u002Fstrong> (CDN, hébergement) — <a href=\"https://www.cloudflare.com/privacypolicy/\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">privacypolicy<\u002Fa>',\n        'priv-li3-2': '<strong>Google Fonts<\u002Fstrong> (polices de caractères) — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-li3-3': '<strong>Tailwind CDN<\u002Fstrong> (framework CSS)',\n        'priv-li3-4': '<strong>ElevenLabs<\u002Fstrong> (IA vocale) — <a href=\"https://elevenlabs.io/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">elevenlabs.io/privacy<\u002Fa>',\n        'priv-li3-5': '<strong>Google Agenda<\u002Fstrong> — <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"text-dental-600 hover:underline\">policies.google.com/privacy<\u002Fa>',\n        'priv-h4': '4. Base juridique et durée de conservation',\n        'priv-p4': 'Les données techniques sont traitées sur la base de l\\'article 6(1)(f) du RGPD — intérêt légitime (fonctionnement sécurisé du site). L\\'interaction vocale repose sur le consentement (art. 6(1)(a)), donné via la fenêtre popup avant de lancer l\\'appel. Les données vocales ne sont pas conservées à long terme.',\n        'priv-h5': '5. Vos droits',\n        'priv-p5': 'Vous avez le droit d\\'accès, à la rectification, à l\\'effacement et à l\\'opposition concernant vos données. Envoyez vos demandes à info@dentai.me. Vous pouvez déposer une plainte auprès de la CNIL (www.cnil.fr).',\n        'priv-h6': '6. Avertissement',\n        'priv-p6': 'Ceci est une démo portfolio. Les réponses générées par l\\'IA ne constituent pas un avis médical. L\\'exploitant décline toute responsabilité pour les données fournies par les utilisateurs ou pour les dommages résultant des réponses de l\\'IA.',\n        'priv-updated': 'En vigueur : 26 avril 2026.',\n        'modal-title': 'Déclaration de consentement',\n        'modal-text': 'Cet appel est géré par l\\'intelligence artificielle (IA). Les données vocales sont traitées pendant la conversation. En lançant l\\'appel, vous acceptez que l\\'IA génère des réponses et que la conversation ne constitue pas un avis médical.',\n        'modal-checkbox': 'J\\'ai lu et j\\'accepte l\\'avis ci-dessus.',\n        'modal-cancel': 'Annuler',\n        'modal-accept': 'J\\'accepte',\n\n        'cap-sub': 'Capacités d\\'Anna',\n        'cap-title': 'Tout ce qu\\'une réceptionniste doit savoir',\n        'cap-desc': 'De la réservation à l\\'annulation en passant par la liste d\\'attente — Anna gère de manière autonome et en temps réel l\\'ensemble de la communication avec les patients par téléphone. Toutes les fonctionnalités sont disponibles dans toutes les langues prises en charge.',\n        'cap1-title': 'Rendez-vous disponibles',\n        'cap1-desc': 'Anna recherche en temps réel les créneaux disponibles dans Google Agenda — filtrés par date, moment de la journée ou médecin. Le patient obtient immédiatement une sélection.',\n        'cap1-tag2': 'Temps réel',\n        'cap2-title': 'Prise de rendez-vous',\n        'cap2-desc': 'À partir du nom du patient, de son adresse e-mail et de l\\'horaire souhaité, Anna enregistre la réservation dans l\\'agenda et envoie immédiatement un SMS et un e-mail de confirmation.',\n        'cap2-tag1': 'Confirmation',\n        'cap3-title': 'Modification de rendez-vous',\n        'cap3-desc': 'Si le patient demande un autre créneau, Anna annule l\\'ancien et réserve le nouveau — elle vérifie également la disponibilité du nouveau créneau dans l\\'agenda pour éviter tout conflit.',\n        'cap3-tag1': 'Ancien → Nouveau',\n        'cap3-tag2': 'Vérifié',\n        'cap4-title': 'Annulation de rendez-vous',\n        'cap4-desc': 'Le patient peut confirmer l\\'annulation — Anna supprime l\\'événement de l\\'agenda et envoie un SMS et un e-mail de confirmation d\\'annulation dans la langue appropriée.',\n        'cap4-tag1': 'Notification',\n        'cap4-tag2': 'Mise à jour de l\\'agenda',\n        'cap5-title': 'Recherche de rendez-vous',\n        'cap5-desc': 'Si le patient ne se souvient pas de sa réservation, Anna récupère les rendez-vous à venir et les lui lit au téléphone pour faciliter la modification ou l\\'annulation.',\n        'cap5-tag1': 'Recherche',\n        'cap5-tag2': 'Identification du patient',\n        'cap6-title': 'Liste d\\'attente',\n        'cap6-desc': 'Si aucun créneau n\\'est disponible, Anna inscrit le patient sur la liste d\\'attente prioritaire — avec ses créneaux préférés. Lorsqu\\'une place se libère, le système l\\'en avertit automatiquement.',\n        'cap6-tag1': 'Priorité',\n        'cap6-tag2': 'Notification automatique',\n        'cap7-title': 'Modification des données',\n        'cap7-desc': 'Si le patient a un nouveau numéro de téléphone ou une nouvelle adresse e-mail, Anna met à jour les données dans le système — sur la base de l\\'identifiant e-mail actuel, avec effet immédiat.',\n        'cap7-tag1': 'Téléphone / e-mail',\n        'cap7-tag2': 'Immédiat',\n        'cap8-title': 'Transfert d\\'appel',\n        'cap8-desc': 'Si le patient souhaite parler à un collaborateur, qu\\'une erreur technique se produit ou qu\\'Anna ne peut pas répondre, elle notifie automatiquement la réception pour un rappel — le patient n\\'est jamais laissé sans réponse.',\n        'cap8-tag1': 'Rappel',\n        'cap8-tag2': 'Filet de sécurité',\n        'cap-stat1-label': '8 outils intégrés pour la communication avec les patients',\n        'cap-stat2-label': 'Langues parlées couramment',\n        'cap-stat3-label': 'Disponible jour et nuit, même les jours fériés',\n        'cap-stat3-value': '24/7',\n        'lang-title': 'Onze langues, une seule voix',\n        'lang-subtitle': 'Détection automatique de la langue — chaque fonctionnalité disponible dans chaque langue',\n        'lang-auto': 'Détection automatique',\n        'lang-desc': 'Anna détecte automatiquement la langue du patient au début de l\\'appel et continue la conversation dans cette langue. Les SMS, e-mails et entrées d\\'agenda sont également créés dans la langue maternelle du patient — ainsi, les patients internationaux se sentent à l\\'aise dans le cabinet et ne sont jamais désavantagés dans la communication.',\n        'lang-feat1-title': 'Communication parlée',\n        'lang-feat1-desc': 'Voix en direct, parole naturelle',\n        'lang-feat2-title': 'SMS spécifique à la langue',\n        'lang-feat2-desc': 'Confirmation dans la langue du patient',\n        'lang-feat3-title': 'E-mail multilingue',\n        'lang-feat3-desc': 'Description de l\\'agenda en 11 langues, générée automatiquement',\n        'roi-email-btn': 'Partager par e-mail',\n        'roi-email-prompt': 'Envoyez-vous le résultat !',\n        'roi-email-send': 'Envoyer',\n        'roi-email-success': 'Envoyé ! Vérifiez votre boîte de réception.'\n      ,\n        'roi-email-error': 'Une erreur est survenue lors de l\\'envoi. Veuillez réessayer !'\n      ,\n        'roi-email-subject': 'Votre résultat du calculateur ROI'\n      ,\n        'roi-email-greeting': 'Cher/Chère'\n      ,\n        'roi-email-closing': 'Cordialement, L\\'équipe DentAi'\n      ,\n        'roi-name-placeholder': 'Nom'\n      ,\n        'roi-email-placeholder': 'email@exemple.fr'\n      ,\n        'roi-sub': 'Combien rapporte Anna ?',\n        'roi-title': 'Calculateur ROI — en 30 secondes',\n        'roi-desc': 'Réglez le volume d\\'appels quotidien de votre cabinet — nous calculons combien de chiffre d\\'affaires vous perdez avec les appels manqués et combien Anna récupère.',\n        'roi-inputs-title': 'Votre cabinet',\n        'roi-inputs-desc': 'Déplacez les curseurs — les résultats se mettent à jour instantanément.',\n        'roi-calls-label': 'Combien d\\'appels recevez-vous par jour ?',\n        'roi-calls-unit': 'appels/jour',\n        'roi-missed-label': 'Taux d\\'appels manqués',\n        'roi-missed-hint': 'Week-ends, heure du déjeuner, appels parallèles, barrières linguistiques.',\n        'roi-value-label': 'Valeur moyenne d\\'un traitement',\n        'roi-result-label': 'Rendement estimé',\n        'roi-monthly-label': 'Chiffre d\\'affaires mensuel récupéré',\n        'roi-yearly-label': 'Par an',\n        'roi-bookings-label': 'Réservations supplémentaires/mois',\n        'roi-monthly-sub': '',\n        'roi-cta': 'Demander une démo →',\n        'roi-disclaimer': 'Estimation. Les résultats réels dépendent du profil du cabinet et des ratios de traitement.',\n        'roi-value-currency': '€'},\n      it: {\n        'page-title': 'Anna — DentAi Assistente Senior | Gestione chiamate 24/7 & Prenotazione',\n        'brand-suffix': '-AI',\n        'senior-badge': 'Assistente IA Senior',\n        'hero-h1-1': 'Mai più',\n        'hero-h1-2': 'chiamate perse.',\n        'hero-desc': 'Scopri <strong class=\"text-slate-800\">Anna<\u002Fstrong> — l\\'Assistente Senior DentAi, che gestisce le chiamate <strong class=\"text-slate-800\">24/7<\u002Fstrong>, prenota appuntamenti e invia conferme istantanee — così la Sua reception può concentrarsi sui pazienti.',\n        'hero-call': 'Parla con Anna',\n        'hero-hangup': 'Chiudi la chiamata',\n        'hero-calendar': 'Vedi il calendario',\n        'feat-1': 'Gestione chiamate 24/7',\n        'feat-2': 'Conferma automatica',\n        'feat-3': '11 lingue',\n        'status-ready': 'Anna è pronta — chiami!',\n        'status-connecting': 'Connessione ad Anna...',\n        'status-listening': 'Anna sta ascoltando — dica come può aiutarLa',\n        'status-speaking': 'Anna Le risponde',\n        'error-server': 'Impossibile avviare la chiamata. Il server non è disponibile.',\n        'error-mic': 'L\\'autorizzazione del microfono è necessaria per avviare una chiamata. Abilita l\\'accesso al microfono nelle impostazioni del browser e riprova.',\n        'error-no-url': 'Impossibile connettersi ad Anna (signed URL mancante). Riprova più tardi!',\n\n        'header-available': 'Anna disponibile',\n        'header-connecting': 'Connessione...',\n        'header-listening': 'Anna ascolta...',\n        'header-speaking': 'Anna parla...',\n        'mobile-available': 'Anna disponibile',\n        'menu-label': 'Menu',\n        'menu-close': 'Chiudi',\n        'float-1': 'Chiamata in arrivo',\n        'float-2': 'Appuntamento prenotato',\n        'float-3': 'Conferma inviata',\n        'phone-anna-name': 'Anna',\n        'phone-anna-role': 'Assistente Senior · Online',\n        'chat-1': 'Buonasera! Vorrei prenotare una pulizia dentale per domani mattina.',\n        'chat-2': 'Buonasera! Controllo subito le disponibilità. Domani mattina abbiamo posti alle 9:00 e alle 11:30. Quale preferisce?',\n        'chat-3': 'Le 9:00 sarebbero perfette!',\n        'chat-4': 'Perfetto! Appuntamento confermato per domani alle 9:00. Le invio la conferma via SMS ed e-mail.',\n        'chat-input': 'Scriva un messaggio ad Anna...',\n        'how-title-sub': 'Come funziona',\n        'how-title': 'Uno studio sereno in quattro passi',\n        'how-desc': 'Automazione completa dalla chiamata alla visita. Il paziente prenota — Anna fa tutto il resto.',\n        'step1-title': 'Richiesta in arrivo',\n        'step1-desc': 'Il paziente chiama o prenota online — Anna risponde immediatamente, giorno e notte. Nessun\\'attesa, nessun segnale di occupato.',\n        'step1-tag1': 'Telefono',\n        'step1-tag2': 'Prenotazione online',\n        'step2-title': 'Valutazione intelligente',\n        'step2-desc': 'Anna analizza la richiesta del paziente — mal di denti urgente, pulizia di routine o consultazione — e lo indirizza subito allo specialista giusto.',\n        'step2-tag1': 'Triage',\n        'step2-tag2': 'Multilingue',\n        'step3-title': 'Sincronizzazione calendario',\n        'step3-desc': 'Anna vede gli slot disponibili in tempo reale e prenota l\\'appuntamento istantaneamente — o lo modifica se il paziente richiede un altro orario.',\n        'step3-tag1': 'Tempo reale',\n        'step3-tag2': 'Prenota/Modifica',\n        'step4-title': 'Informazioni professionali',\n        'step4-desc': 'Anna risponde alle domande sui trattamenti e sul funzionamento dello studio, fornendo ai pazienti tutte le informazioni necessarie.',\n        'step4-tag1': 'E-mail',\n        'step4-tag2': 'SMS',\n        'step4-tag3': 'Calendario',\n        'care-sub': 'Follow-up automatico',\n        'care-title': 'Prima e dopo l\\'appuntamento',\n        'care-desc': 'Anna non solo prenota — si prende cura. La mattina prima del trattamento ricorda, il giorno dopo fa un follow-up. Il paziente non si sente mai dimenticato, e lo studio riceve feedback reale sulla qualità.',\n        'care1-title': 'SMS promemoria pre-appuntamento',\n        'care1-subtitle': 'Automatico — Senza intervento umano',\n        'care1-desc': 'La mattina prima del trattamento, Anna invia automaticamente un SMS al paziente per il suo appuntamento del giorno seguente, per prevenire la dimenticanza. Questo processo riduce drasticamente il tasso di assenze e libera completamente la reception dal lavoro di promemoria manuale.',\n        'care1-tag1': 'Twilio SMS',\n        'care1-tag2': 'Google Calendar',\n        'care1-tag3': 'Programmato',\n        'care1-step1-title': 'Programmazione: ogni mattina',\n        'care1-step1-desc': 'Il sistema invia ogni mattina SMS di promemoria per gli appuntamenti del giorno dopo',\n        'care1-step2-title': 'Ricerca calendario',\n        'care1-step2-desc': 'Anna recupera l\\'evento da Google Calendar e verifica i dettagli',\n        'care1-step3-title': 'Invio SMS (Twilio)',\n        'care1-step3-desc': 'SMS promemoria personalizzato — nome, orario e luogo inclusi',\n        'care1-sms-header': 'Promemoria · appuntamento del giorno dopo',\n        'care1-sms-body': 'Promemoria: il Suo appuntamento dentale di domani',\n        'care1-sms-arrival': 'La preghiamo di arrivare 10 minuti prima.',\n        'care1-sms-date': '📅 29/04/2026 · 10:00',\n        'care1-sms-footer': '— Assistente DentAi',\n        'care1-sms-preview': 'Gentile Marco Rossi! 👋',\n        'care2-title': 'Follow-up post-visita / Questionario',\n        'care2-subtitle': 'Automatico — Senza intervento umano',\n        'care2-desc': 'Il giorno dopo il trattamento, Anna invia una breve e-mail con un questionario dove il paziente può valutare il servizio. I feedback vengono registrati automaticamente, permettendo allo studio di migliorare continuamente la qualità senza inserimento manuale dei dati.',\n        'care2-tag1': 'Gmail',\n        'care2-tag2': 'Statistiche',\n        'care2-tag3': 'Programmato',\n        'care2-step1-title': 'Programmazione: il giorno dopo il trattamento',\n        'care2-step1-desc': 'Il giorno dopo il trattamento, il sistema invia e-mail di feedback ai pazienti',\n        'care2-step2-title': 'E-mail questionario (Gmail)',\n        'care2-step2-desc': 'E-mail personalizzata con link al questionario — soddisfazione, esperienza, suggerimenti',\n        'care2-step3-title': 'Registrazione delle statistiche',\n        'care2-step3-desc': 'Le risposte vengono aggiunte automaticamente alla scheda statistiche di Google Sheets',\n        'care2-email-from': 'DentAi Assistente',\n        'care2-email-to': '→ marco.rossi@email.it',\n        'care2-email-subject': 'Il Suo feedback sulla visita – DentAi',\n        'care2-email-body': 'Gentile Marco Rossi! Speriamo che la Sua visita sia andata bene. La Sua opinione è importante per noi: condivida la Sua esperienza in un breve questionario per aiutarci a migliorare ulteriormente la nostra assistenza.',\n        'care2-email-cta': '→ Compila il questionario',\n        'care-stat1-value': '~40%',\n        'care-stat1-label': 'Riduzione assenze grazie ai promemoria',\n        'care-stat2-value': '0',\n        'care-stat2-label': 'Lavoro manuale e processo completamente automatizzato',\n        'care-stat3-value': '24h',\n        'care-stat3-label': 'Feedback post-trattamento',\n        'flow-1': 'Chiamata in arrivo/Web',\n        'flow-2': 'Valutazione',\n        'flow-3': 'Sync calendario',\n        'flow-4': 'Conferma',\n        'flow-done': 'Fatto!',\n        'why-sub': 'Perché Anna?',\n        'why-title': 'Liberi la Sua reception — subito',\n        'why-desc': 'Anna non sostituisce il receptionist — si occupa dei compiti ripetitivi così che il Suo team possa concentrarsi su ciò che conta davvero.',\n        'ben1-title': 'Nessuna chiamata persa',\n        'ben1-desc': 'Anna risponde alle chiamate giorno e notte — durante la pausa pranzo, nei fine settimana e nei festivi. Ogni paziente può parlare con qualcuno che lo aiuta immediatamente.',\n        'ben2-title': 'Reception alleggerita',\n        'ben2-desc': 'La Sua reception può concentrarsi sui pazienti di persona e sulla comunicazione, mentre Anna gestisce le chiamate di routine in background.',\n        'ben3-title': 'Undici lingue, una sola voce',\n        'ben3-desc': 'Comunica scorrevolmente in ungherese, inglese, tedesco, olandese, francese, italiano, danese, norvegese, svedese, finlandese e slovacco — i pazienti internazionali si sentono a casa nello studio.',\n        'clinic-sub': 'Informazioni studio',\n        'clinic-title': 'Dettagli dello studio',\n        'clinic-desc': 'Anna conosce tutti i dati importanti dello studio — dagli orari di apertura alla durata dei trattamenti.',\n        'clinic-details-title': 'Dettagli dello studio',\n        'clinic-location-label': 'Posizione',\n        'clinic-location-value': 'Budapest, Distretto V, Centro',\n        'clinic-hours-label': 'Orari di apertura',\n        'clinic-hours-value': 'Lunedì–Venerdì 08:00–18:00',\n        'clinic-closed-label': 'Chiuso',\n        'clinic-closed-value': 'Sabato, domenica e festivi',\n        'clinic-doctors-label': 'Medici',\n        'clinic-doctors-value': 'Dr. Kovács e Dr. Nagy',\n        'clinic-treatments-title': 'Trattamenti & Durata',\n        'clinic-treatments-note': 'Fasce orarie da 30 minuti',\n        'treat1-name': 'Visita / Consulenza',\n        'treat1-dur': '30 min',\n        'treat2-name': 'Pulizia tartaro',\n        'treat2-dur': '30 min',\n        'treat4-name': 'Sostituzione otturazione',\n        'treat4-dur': '45 min',\n        'treat5-name': 'Trattamento canalare',\n        'treat5-dur': '90 min',\n        'treat6-name': 'Pronto soccorso dentale',\n        'treat6-dur': '60 min',\n\n        'faq-sub': 'Domande frequenti',\n        'social-sub': 'Social AutoPilot',\n        'social-title': 'Anna pubblica per Lei',\n        'social-desc': 'Ogni giorno nuovi contenuti generati dall\\'IA su Facebook e LinkedIn — testo e immagini, completamente automatizzati.',\n        'social-card1-title': 'Creazione di contenuti automatizzata',\n        'social-card1-text': 'Ogni giorno Anna scrive un nuovo post professionale su svariati argomenti odontoiatrici — dallo sbiancamento dentale agli impianti, dall\\'odontoiatria pediatrica alle urgenze. L\\'IA seleziona casualmente un argomento, poi redige un testo formale e professionale: titolo, domanda, 3–5 consigli pratici e una call-to-action. Nessuna ripetizione, nessun tono generico — ogni post è unico e originale.',\n        'social-card2-title': 'L\\'IA crea le immagini',\n        'social-card2-text': 'Per ogni post, Anna genera un\\'immagine professionale a tema odontoiatrico — ambienti studio puliti e moderni, sorrisi luminosi, risultati estetici di alta qualità. Le immagini si adattano automaticamente all\\'argomento del post, mantenendo i contenuti Facebook e LinkedIn visivamente accattivanti e coerenti, senza bisogno di un fotografo.',\n        'social-card2-tag2': 'Senza filigrana',\n        'social-card3-title': 'Facebook e LinkedIn',\n        'social-card3-text': 'Anna pubblica contemporaneamente su entrambe le piattaforme: con foto sulla pagina Facebook e con contenuto visivo sul profilo aziendale LinkedIn. I post appaiono istantaneamente — nessuna attesa di approvazione. L\\'intero processo funziona tramite il motore di automazione Make.com, con la scrittura di Claude AI e la generazione di immagini di Pollinations.',\n        'social-benefit1-title': 'Risparmio di tempo',\n        'social-benefit1-text': 'Non c\\'è bisogno di scrivere contenuti, cercare immagini o pubblicare — Anna fa tutto',\n        'social-benefit2-title': 'Presenza costante',\n        'social-benefit2-text': 'Contenuti freschi giornalieri garantiscono che lo studio non sembri mai inattivo',\n        'social-benefit3-title': 'Reach crescente',\n        'social-benefit3-text': 'Post regolari aumentano la visibilità organica e attraggono nuovi pazienti',\n        'social-benefit4-title': 'Credibilità professionale',\n        'social-benefit4-text': 'Post di qualità e informativi rafforzano la reputazione dello studio e costruiscono fiducia',\n        'social-follow-fb': 'Segui su Facebook',\n        'social-follow-li': 'Segui su LinkedIn',\n        'footer-contact': 'Contatto',\n        'faq-title': 'Tutto quello che volete sapere',\n        'faq-desc': 'Le domande e risposte più comuni su Anna — se non trovate quello che cercate, non esitate a contattarmi!',\n        'faq1-q': 'Funziona con il mio numero di telefono attuale?',\n        'faq1-a': 'Sì! Anna risponde alle chiamate sul vostro numero di telefono esistente — non serve un nuovo numero, cambio di operatore o attrezzatura aggiuntiva. Il sistema si integra perfettamente con la vostra linea telefonica attuale, così i pazienti possono chiamare lo stesso numero che già conoscono. La configurazione richiede solo pochi minuti.',\n        'faq2-q': 'Cosa succede se l\\'IA non sa rispondere?',\n        'faq2-a': 'Se Anna riceve una domanda a cui non è preparata (ad es. domande mediche specifiche, gestione reclami, preventivi complessi), notifica automaticamente la reception dello studio per una richiamata — registra i dati del paziente e i dettagli della richiesta affinché la receptionist possa richiamare il paziente il prima possibile. Se lo studio è chiuso, Anna prende nota della richiesta, e la receptionist richiama il paziente il giorno lavorativo successivo. Il paziente non resta mai senza risposta.',\n        'faq3-q': 'Come è disponibile il sistema?',\n        'faq3-a': 'Anna è attualmente disponibile come demo di portfolio — sviluppata da Peter Petor come privato, non ancora commercializzata. Il sito e la demo conversazionale sono aperti a tutti, così studi, sviluppatori o potenziali clienti commerciali possono avere una panoramica del funzionamento. Per un\\'implementazione in produzione o una collaborazione personalizzata (programma pilota, integrazione), si prega di contattarmi all\\'indirizzo info@dentai.me.',\n        'faq4-q': 'In quali lingue parla?',\n        'faq4-a': 'Attualmente comunica scorrevolmente in undici lingue: ungherese, inglese, tedesco, olandese, francese, italiano, danese, norvegese, svedese, finlandese e slovacco. La selezione della lingua è automatica — Anna riconosce la lingua del paziente e risponde in quella lingua. Questo è particolarmente prezioso nelle regioni turistiche dove i pazienti internazionali chiamano spesso lo studio.',\n        'faq5-q': 'Come gestisce le emergenze?',\n        'faq5-a': 'In situazioni urgenti — come un forte mal di denti, un trauma dentale o un\\'emorragia — Anna dà immediatamente priorità alla chiamata. Riconosce le parole chiave di urgenza e cerca l\\'appuntamento più rapido possibile per il giorno stesso. In caso di vera emergenza (ad es. frattura mandibolare, emorragia incontrollabile), indirizza il paziente al pronto soccorso più vicino. Le chiamate di emergenza non vengono mai accidentalmente classificate come prenotazioni di routine.',\n        'faq6-q': 'Come viene gestita la protezione dei dati (GDPR)?',\n        'faq6-a': 'Anna è stata progettata tenendo conto dei requisiti del GDPR, ma è importante essere trasparenti sui fornitori di servizi utilizzati. Il traffico web e le chiamate API passano attraverso il CDN Cloudflare, e l\\'elaborazione vocale è gestita da ElevenLabs — entrambi sono fornitori con sede negli Stati Uniti, che operano con Clausole Contrattuali Standard (SCC) e un accordo di trattamento dei dati (DPA), tuttavia i dati possono comunque essere trasferiti in un paese terzo (USA). Prima del passaggio in produzione, ogni studio deve firmare il proprio DPA con questi fornitori, dichiarare il trasferimento dei dati e la sua base giuridica nell\\'informativa sulla privacy, ed è consigliata una valutazione d\\'impatto sulla protezione dei dati (DPIA). I dettagli sui reclami sanitari (categorie particolari di dati, art. 9 GDPR) richiedono un consenso esplicito separato. Si raccomanda di consultare un esperto di protezione dei dati / un avvocato prima di qualsiasi implementazione in produzione.',\n        'faq7-q': 'Come si collega Anna a un numero di telefono?',\n        'faq7-a': 'Esistono due approcci principali. Assegnazione di un nuovo numero: un numero può essere acquistato da Twilio o da un altro fornitore VoIP (ad es. SIP trunk ungherese: Hipernet, Voipgate) e instradato direttamente all\\'Agente Conversational AI di ElevenLabs — con l\\'integrazione Twilio questo può essere configurato in poche ore. Trasferimento di chiamata dal numero esistente: sul numero attuale dello studio può essere configurato un trasferimento di chiamata temporizzato (ad es. solo fuori orario o quando la linea è occupata), così Anna risponde solo quando la reception non è disponibile. La configurazione esatta è personalizzata in base all\\'infrastruttura di ogni studio.',\n        'faq8-q': 'Come funziona il consenso durante la chiamata telefonica?',\n        'faq8-a': 'Alla risposta della chiamata, nella prima frase Anna informa il chiamante: sta parlando un assistente IA, la chiamata può essere registrata a fini di garanzia della qualità, ed è possibile richiedere una richiamata da un operatore umano in qualsiasi momento (Anna organizza una richiamata su richiesta). Se il paziente continua la conversazione, ciò vale come consenso per comportamento concludente (GDPR art. 6, par. 1, lett. a) e b)). Per dettagliare reclami sanitari (ad es. dolore, farmaci) è richiesta una conferma esplicita aggiuntiva. Il fatto e l\\'orario del consenso vengono registrati dal sistema.',\n        'faq10-q': 'Quanto costano i costi operativi annuali?',\n        'faq10-a': '<p>Questi costi sono pagati dallo studio direttamente ai fornitori di servizi. Gli importi possono variare in base al traffico (numero e durata delle chiamate). Anna genera inoltre contenuti giornalieri per Facebook e LinkedIn.<\u002Fp><ul class=\"space-y-1.5 list-disc pl-5\"><li><strong class=\"text-slate-700\">Nome di dominio:<\u002Fstrong> 8 – 20 € / anno<\u002Fli><li><strong class=\"text-slate-700\">Make.com (Logica):<\u002Fstrong> ~110 € / anno<\u002Fli><li><strong class=\"text-slate-700\">ElevenLabs (Voce):<\u002Fstrong> 125 – 250 € / anno<\u002Fli><li><strong class=\"text-slate-700\">Twilio (SMS):<\u002Fstrong> 50 – 150 € / anno<\u002Fli><li><strong class=\"text-slate-700\">Cloudflare (Codice):<\u002Fstrong> 0 €<\u002Fli><li><strong class=\"text-slate-700\">Hosting web:<\u002Fstrong> 0 – 38 € / anno<\u002Fli><li><strong class=\"text-slate-700\">Claude AI (Generazione testo):<\u002Fstrong> ~5 € / anno<\u002Fli><li><strong class=\"text-slate-700\">Pollinations AI (Generazione immagini):<\u002Fstrong> 0 € (gratuito)<\u002Fli><\u002Ful><div class=\"bg-slate-50 rounded-xl px-4 py-2.5 border border-slate-200/60 -ml-1\"><p class=\"text-sm font-semibold text-slate-800\">Totale: <span class=\"text-dental-700\">~298 – 573 € / anno<\u002Fspan><\u002Fp><\u002Fdiv><p class=\"text-xs text-slate-400 italic\">Informazioni importanti per lo studio: conversazioni più lunghe significano più caratteri. Più chiamate significano una fattura più alta. Più SMS significano una fattura più alta. Questi sono solo valori stimati.<\u002Fp>',\n\n        'demo-sub': 'Demo dal vivo',\n        'demo-title': 'Provi Anna!',\n        'demo-desc': 'Parli con lei al telefono, o controlli gli slot disponibili in tempo reale — e scopra com\\'è quando nulla sfugge di mano.',\n        'demo-what': 'Cosa chiedere ad Anna',\n        'demo-what-sub': 'Parli semplicemente in modo naturale — Anna capisce!',\n        'prompt1-title': 'Prenotare un appuntamento',\n        'prompt1-text': '« Vorrei prenotare una pulizia dentale per martedì prossimo alle 14 »',\n        'prompt2-title': 'Modificare un appuntamento',\n        'prompt2-text': '« Vorrei spostare l\\'appuntamento di domani a giovedì »',\n        'prompt3-title': 'Mal di denti urgente',\n        'prompt3-text': '« Mi fa male il dente e peggiora — potete
